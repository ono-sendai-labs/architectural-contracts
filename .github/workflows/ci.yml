name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci-go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: go/go.mod

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11

      # just test-integration forces Bazel's linux-sandbox strategy (the
      # restricted-PATH hermeticity driver). Bazel silently drops that
      # strategy from its registered set if unprivileged user-namespace
      # creation is blocked, which ubuntu-latest restricts via AppArmor by
      # default; relax it for this ephemeral runner only. Best-effort: a
      # no-op if the setting is ever removed from the runner image.
      - name: Allow Bazel's sandbox strategy
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run CI
        run: CGO_ENABLED=0 just ci-go

  selfcheck:
    name: Self-hosting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: go/go.mod

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run Selfcheck
        run: CGO_ENABLED=0 just selfcheck

  bazel:
    name: Bazel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run Bazel build/test
        run: just bazel-test
