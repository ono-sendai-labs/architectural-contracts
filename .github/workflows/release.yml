name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-?*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (must match v[0-9]+.[0-9]+.[0-9]+-?*)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - name: Determine tag
        id: determine_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$PUSH_TAG"
          fi
          # Validate tag format strictly against v[0-9]+.[0-9]+.[0-9]+-?*
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "Error: Tag '$TAG' does not match required format v[0-9]+.[0-9]+.[0-9]+-?*" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.determine_tag.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.mod

      - name: Build binary
        working-directory: go
        run: |
          mkdir -p bin
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -ldflags="-s -w" -o bin/arcc-${{ matrix.os }}-${{ matrix.arch }} ./cmd/arcc

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        if: ${{ !contains(steps.determine_tag.outputs.tag, '-') }}
        with:
          subject-path: 'go/bin/arcc-${{ matrix.os }}-${{ matrix.arch }}'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arcc-${{ matrix.os }}-${{ matrix.arch }}
          path: go/bin/arcc-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: determine_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$PUSH_TAG"
          fi
          # Validate tag format strictly against v[0-9]+.[0-9]+.[0-9]+-?*
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "Error: Tag '$TAG' does not match required format v[0-9]+.[0-9]+.[0-9]+-?*" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.determine_tag.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.determine_tag.outputs.tag }}
        run: |
          # Safe shell quoting and conditional handling
          EXTRA_FLAGS=""
          if [[ "$TAG" == *-* ]]; then
            EXTRA_FLAGS="--prerelease"
          fi
          
          # Create GitHub Release and upload gathered artifacts
          gh release create "$TAG" artifacts/* --generate-notes $EXTRA_FLAGS
