  title: "test(goanalysis): prove full-build artifact determinism [Compositional Analysis: Step 13/Task 04]"
  body: |
    Reviews the complete task series: rszlotvp adds the Bazel determinism
    fixture and isolated producer-chain comparison; kmrxxumn records the final
    performance and host-import evidence; wkousqok makes both compared graph
    invocations consume identical checked-map inputs and updates the final
