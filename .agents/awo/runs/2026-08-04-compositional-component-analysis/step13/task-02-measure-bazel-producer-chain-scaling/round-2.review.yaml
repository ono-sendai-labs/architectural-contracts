findings:
  - severity: critical
    category: acceptance_criteria
    file: bazel_rules/go/tests/testdata/producerchain/producer_chain.bzl
    line: 203
    title: "Producer-chain fixtures emit failing conformance reports"
    details: |
      The fixed dependency wrapper still imports `entry` at
      `bazel_rules/go/tests/testdata/producerchain/producer_chain.bzl:127-135`,
      but the dependency component's only direct dependency is
      `nodes_component`, whose asserted surface contains only node packages at
      `:192-201`; the dependency surface therefore does not authorize `entry`.
      The root member also imports `entry` at `:117-125`, while its only direct
      dependency is the dependency component whose surface contains only the
      wrapper at `:203-210`, so the root has the same undeclared-package edge.
      A current Bazel build produced
      `bazel-out/k8-fastbuild/bin/bazel_rules/go/tests/testdata/producerchain/d01w01_dependency_component.report.json:3,20-47`
      and `d01w01_component.report.json:3,20-55`, both with `verdict: fail`,
      `UNDECLARED_DEPENDENCY` for `.../entry`, and dependency/unused warnings.
      The integration test only snapshots output bytes at
      `go/internal/goanalysis/producer_chain_scaling_integration_test.go:1138-1191`
      and never decodes or asserts report verdicts, so its passing result and
      the recorded `just ci` pass do not establish a valid checked producer
      chain. This violates Technical Requirement 1's real dependency
      surface/report path and lets a semantically invalid fixture pass the
      acceptance suite.
    suggested_action: |
      Correct the component ownership and direct-dependency declarations so
      every member-to-entry import is authorized by the surface attached to
      that direct edge, while retaining the fixed wrapper member and the
      Task 1 entry topology. Then decode/assert the generated report for every
      checked root and dependency in the integration driver (and include those
      outputs in the determinism snapshot), failing the test on an unexpected
      `verdict: fail` or `CHECKED_FAIL`. Do not mask the violations by merely
      accepting failed reports; the synthetic producer-chain rows should run
      through conforming surface/report edges.
    source: built-in

