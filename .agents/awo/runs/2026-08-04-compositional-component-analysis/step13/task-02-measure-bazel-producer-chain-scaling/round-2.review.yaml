summary: |
  The prior important finding is addressed: both checked subchains now observe one fixed typed member, and the primary graph/direct type-surface topology is explicitly checked against Task 1. The prior tool-input and native-generation suggestions remain resolved, and the recorded focused/full validation passes. A new critical finding is that the current Bazel fixtures emit `verdict: fail` reports for both the dependency and root because their direct surfaces do not own the `entry` package; the integration driver does not inspect report verdicts, so CI passes while the purported producer chain is semantically invalid.

