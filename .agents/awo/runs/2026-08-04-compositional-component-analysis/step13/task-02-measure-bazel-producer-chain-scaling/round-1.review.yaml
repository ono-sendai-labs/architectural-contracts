summary: |
  The prior important finding about a growing checked dependency workload is resolved: the dependency now has one fixed entry member, the layered nodes are behind an asserted surface, and both checked subchains are observed and reported. The prior suggestions are also addressed by excluding tool inputs from volume totals and replacing the hard-coded native-generation counter with an explicit by-construction description; focused compilation, vet, and analysis-role checks pass, with the recorded `just ci` run also passing. A new important regression remains because the rework changes the Task 1 graph semantics and moves the direct type-surface series from the directly imported entry package to a transitive node.

