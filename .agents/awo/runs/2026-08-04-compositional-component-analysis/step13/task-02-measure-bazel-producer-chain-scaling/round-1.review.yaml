findings:
  - severity: important
    category: architecture
    file: bazel_rules/go/tests/testdata/producerchain/producer_chain.bzl
    line: 80
    title: "Rework changed the Task 1 graph fixture semantics"
    details: |
      The Task 1 fixture puts the width fan-out in the directly imported entry
      package (`go/internal/goanalysis/member_analysis_scaling_fixture_test.go:496-503`)
      and emits the growing type/signature surface in that same entry package
      (`:507-511`). The reworked Bazel fixture instead makes entry import only
      `node/l00/i00` at lines 74-88, moves the width fan-out to that node at
      lines 96-101, and emits the type surface on that transitive node at
      lines 108-116. Therefore the `d01w04` and related rows no longer have the
      Task 1 import topology/depth semantics, and `s0008`/`s0032`/`s0128` no
      longer measure a growing surface in the package directly imported by the
      fixed member. The new assertions prove the altered graph's counts and
      workloads, but do not prove equivalence to Task 1; the research note
      explicitly describes the direct series as growing a non-member node at
      `current-analysis-pipeline.md:447-448`.
    suggested_action: |
      Preserve the Task 1 graph edges for the primary rows and keep the direct
      type/signature pairs in the directly imported entry package, or add a
      separate Bazel fixture/series that is explicitly equivalent to those Task
      1 cases. If the fixed dependency-check workload requires the current
      ownership split, structure the asserted/checked component boundaries so
      that entry can retain its direct role without making a checked member
      workload scale; update the role, volume, and research assertions to pin
      that equivalence.
    source: built-in

