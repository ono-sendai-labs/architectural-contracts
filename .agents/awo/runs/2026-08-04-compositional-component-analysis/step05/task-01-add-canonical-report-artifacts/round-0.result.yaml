notes: |
  Implemented the persisted report artifact contract across four incremental jj
  changes: pure verdict derivation in report, canonical codec plus bounded file
  reader in the artifactio shell, and the arcc verdict CLI command with 0/1/2
  exit semantics. Two self-check-discovered constraints were addressed in the
  final change: the JSON codec had to move out of the pure report package
  (reflection authority), and native dependency resolution had to load declared
  member import paths for PACKAGE_SURFACE dependencies so cli can consume
  artifactio. `just ci` is fully green, including self-check, parity, and the
  Bazel leg.
