escalation:
  reason: spec_defect
  details: |
    Req 2 (task file line 23) mandates the asserted surface be produced with
    `ctx.actions.write` (or an equivalent analysis-time deterministic write) "from data
    already known to the rule", forbidding any arcc execution or component analysis
    action. Req 1 + AC 2 (lines 22, 51-54) demand the asserted surface contain "the same
    exact symbols/packages and identity metadata a checked emitter would derive from the
    same inputs, including namespace, SDK key, format version, producer version, and
    digest" — for both declared-interface and PACKAGE_SURFACE fixtures.

    These two requirements are jointly unsatisfiable. The checked emitter's exact
    content requires (1) `symbol.ExtractSurface` over type-checked interface files —
    `surface.Derive` (go/internal/surface/derive.go:129-134) consumes `types.Info`
    produced by goanalysis.LoadSurfaceInputs' full go/packages load
    (goanalysis/surfaceinputs.go:72-77) — and (2) a SHA-256 digest over member source
    bytes and manifest bytes (go/internal/surface/digest.go:13-44). Bazel Starlark
    analysis has neither type information nor any hashing primitive, so no
    analysis-time write from rule-known data can reproduce the required content. The
    design's own prescription (DR-01, design-review-response.md:102-104) justifies the
    analysis-time write only with "(packages are known from the layout)" and is silent
    on declared-interface symbols and the digest — the task inherits both sides of the
    gap. AC 2 additionally requires a declared-interface asserted fixture, which the
    audit confirms exists (reportboundary/manual:manual_component, the only genuine
    asserted component).

    What was explored before escalating:
    - Extending the Step 4 seam per req 5: ArccStdlibMapInfo
      (bazel_rules/go/providers.bzl:11-22) lacks classifier_hash and
      map_format_version, so even the complete SDK key is not assemblable in Starlark
      today; that extension is implementable but cannot supply symbols or the digest,
      which are component-specific.
    - A dedicated deterministic non-arcc emitter action reusing surface.Derive: exact
      and drift-free (req 5 satisfied by construction), but it is an execution that
      type-checks member sources — contradicting req 2's mechanism and the design/plan's
      "analysis-time ctx.actions.write" prescription, and re-coupling the asserted path
      to analysis-time-scale work the design's asserted branch is meant to avoid.
    - Starlark-computed content with text-approximate symbols and no digest: fails AC 2
      outright and reintroduces the independently-drifting duplicate the design forbids.
    - Restricting the transitional asserted path to PACKAGE_SURFACE and failing closed
      on declared-interface manual components: narrows req 6 and leaves the genuine
      manual_component fixture unplaceable.

    Decision needed from the orchestrator (any of):
    (a) Amend req 2 / design DR-01 to permit a dedicated deterministic asserted-surface
        emitter action (non-arcc, no report, no verdict) reusing surface.Derive.
    (b) Amend req 1/AC 2 so asserted surfaces carry analysis-time-derivable content
        only, with explicitly defined asserted digest semantics (e.g. a documented
        empty digest), accepting schema divergence from checked surfaces.
    (c) Amend req 6 to fail closed on declared-interface manual components and move the
        declared-interface asserted fixture to PACKAGE_SURFACE or to a later step.

    No code was written and no commit was produced; the working copy is untouched.

notes: |
  Explored the task fully — task file, design (R8, I1, Build topology, surface manifest,
