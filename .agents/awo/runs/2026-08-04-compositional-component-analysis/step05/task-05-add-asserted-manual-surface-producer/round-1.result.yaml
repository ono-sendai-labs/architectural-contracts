notes: |
  Implemented the re-specified asserted producer per design invariant I6:
  manual-tagged components write a canonical package-level surface at analysis
  time (no symbols, empty digest, UNKNOWN authority, the complete SDK key
  assembled through the once-extended ArccStdlibMapInfo seam) with provenance
  "asserted", report None, and no analysis action; declared-interface and
  declared-authority manual components fail analysis naming the target; the
  generated .check is omitted and the assertion rules refuse asserted components
  with a clear diagnostic. Every fixture-only manual tag migrated to
  check_tags; the conflict fixture keeps its component-level tag as a
  wildcard-build exclusion and is documented as such; the pattern-match probe
  tag turned out to be a trivial probe rule, not a component. Because Starlark
  has no hashing primitive, the classifier hash and version/format constants
  are mirrored once in arcc_metadata.bzl and equality-pinned by a new sh_test
  against both a built checked surface and the stamped map artifact (req 5).
  Work was committed incrementally across five jj changes; `just ci` is fully
  green (Go leg, selfcheck, wildcard build, bazel test //... 114 tests, and the
  tool-error gate proving the malformed fixture's ArccCheck action still runs
  and fails on the checked path).
