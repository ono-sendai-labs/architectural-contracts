merge_request:
  title: "feat(rules): add asserted manual surface producer [Component Analysis: Step 05/Task 05]"
  body: |
    Reviews the complete ordered series from the I6 specification repair through
    the current change: the ArccStdlibMapInfo SDK-key seam, the analysis-time
    asserted producer, fail-closed asserted checks, fixture-only manual-tag
    migration, and the documentation/manual-tag audit. The implementation and
    focused asserted-surface Bazel tests are largely correct, but several
    migrated negative report tests bypass the component ArccCheck output group,
    and the work log lacks RED evidence for most requirements.

summary: |
  The implementation correctly follows I6 for the genuine manual component: it
  writes a package-level asserted surface, publishes structural provenance, and
  avoids the checked analysis action and report. The focused Bazel suites pass,
  but several migrated negative tests using grep/golden assertion rules do not
  build the component's ArccCheck output group, so AC4 is only partial. The TDD
  log also records GREEN results without corresponding RED cycles for most
  requirements; no LSP tool was available in the review harness.

acceptance_criteria:
  - text: |
      1. **Manual components are structurally asserted**
         - Given a `manual`-tagged component
         - When analyzed
         - Then its provider carries a canonical surface, `report = None`, and `provenance = "asserted"`, with no component analysis action.
    status: pass
    evidence: |
      The manual branch writes only the surface and sets report/provenance at
      bazel_rules/go/private/component.bzl:549-580. The analysis test checks the
      provider and exactly three FileWrite actions, with no ArccCheck mnemonic,
      at bazel_rules/go/tests/asserted_surface_tests.bzl:81-102.
  - text: |
      2. **Asserted surfaces carry exactly their analysis-time content**
         - Given a manual `PACKAGE_SURFACE` fixture
         - When its surface is built
         - Then its packages match the layout and its namespace, SDK key, format version and producer version equal what a checked emitter would derive for the same component; its symbol list is empty and its digest is the empty string.
    status: pass
    evidence: |
      The canonical I6 writer and complete SDK-key assembly are implemented at
      bazel_rules/go/private/component.bzl:197-247 and :571-578. The analysis
      test decodes the write content and checks package-level fields, SDK-key
      identity, and omitted zero-valued symbols/digest at
      bazel_rules/go/tests/asserted_surface_tests.bzl:112-146. The shell test
      compares asserted and checked emitter identity plus the stamped map at
      bazel_rules/go/tests/asserted_surface_sdk_key_test.sh:57-75.
  - text: |
      2b. **A declared-interface component cannot be asserted**
         - Given a `manual`-tagged declared-interface component
         - When it is analyzed
         - Then analysis fails with an error naming the target and stating that asserted surfaces are package-level (I6), rather than emitting a partial or symbol-less declared-interface surface.
    status: pass
    evidence: |
      bazel_rules/go/private/component.bzl:558-563 fails manual declared-interface
      targets with the target name and package-level/I6 explanation. The fixture
      is defined at bazel_rules/go/tests/testdata/reportboundary/manual/BUILD.bazel:32-36
      and the expect-failure assertions are at
      bazel_rules/go/tests/asserted_surface_tests.bzl:17-35.
  - text: |
      3. **Provenance is not self-asserted by the file**
         - Given checked and asserted surfaces with otherwise identical schema content
         - When their providers are inspected
         - Then only provider/report topology distinguishes them; the surface schema contains no checked/asserted bit.
    status: pass
    evidence: |
      The asserted surface key-set test at
      bazel_rules/go/tests/asserted_surface_tests.bzl:148-170 excludes any
      provenance field, and proto/archcontracts/v1/surface.proto:22-27
      explicitly documents that the shared schema has no provenance field.
      Provider topology is set separately in
      bazel_rules/go/private/component.bzl:611-652.
  - text: |
      4. **Negative fixtures remain real analyses**
         - Given fixtures previously tagged manual only to suppress an autogenerated failing test
         - When their explicit expect-violation tests run after migration
         - Then they execute the checked analysis action and assert a failing report rather than receiving an asserted surface.
    status: partial
    evidence: |
      The fixture BUILD files are migrated to check_tags, and the violation
      fixture is proven checked by
      bazel_rules/go/tests/component_tests.bzl:565-582. The arcc_check_test
      implementation does stage the component output group at
      bazel_rules/go/private/check.bzl:294-300, but the migrated negative
      fixtures exercised by arcc_check_grep_test and
      arcc_check_report_golden_test do not: those implementations only merge
      DefaultInfo runfiles at bazel_rules/go/private/check.bzl:365-386 and
      :445-468. Their direct CLI invocations therefore do not execute the
      component's ArccCheck action or assert its report artifact.
  - text: |
      5. **An asserted component cannot masquerade as checked**
         - Given an explicitly requested `.check` for an asserted component
         - When Bazel analyzes it
         - Then it is absent or fails with a clear no-checked-report diagnostic, never passes from the asserted surface.
    status: pass
    evidence: |
      defs.bzl omits the generated check for manual components at
      bazel_rules/go/defs.bzl:188-204, while the explicit arcc_check_test guard
      fails closed with a no-checked-report diagnostic at
      bazel_rules/go/private/check.bzl:94-112. The expect-failure analysis test
      is at bazel_rules/go/tests/asserted_surface_tests.bzl:37-57.
  - text: |
      6. **Default builds remain lazy**
         - Given wildcard/default builds containing checked and asserted components
         - When no `arcc` output group or check is requested
         - Then no checked analysis runs and asserted artifacts are not unnecessarily materialized as default outputs.
    status: pass
    evidence: |
      DefaultInfo remains manifest plus layout and the arcc output group is
      assembled separately at bazel_rules/go/private/component.bzl:611-652.
      The asserted fixture's analysis test verifies both default outputs and
      the surface-only arcc group at
      bazel_rules/go/tests/asserted_surface_tests.bzl:172-192; the focused
      Bazel suites pass.

findings:
  - severity: important
    category: tests
    file: .agents/scratchpad/2026-08-04-compositional-component-analysis/step05/task-05-add-asserted-manual-surface-producer/work.log
    line: 48
    title: Most requirements lack RED-to-GREEN TDD evidence
    details: |
      After the specification repair, work.log records a RED/GREEN pair only
      for T7 at lines 48-50. T1/T2/T3/T8, T4/T5, and T6 are recorded only as
      GREEN at lines 51-54, while lines 2-3 and 42-47 describe the earlier
      escalation rather than failing tests for this implementation. The review
      contract requires a failing test followed by a passing test for each
      requirement; the current log does not substantiate that the asserted
      producer and migration tests were developed against a failing baseline.
    suggested_action: |
      Add requirement-scoped RED evidence (or an explicit, reproducible
      failing-before-implementation record) followed by the corresponding
      GREEN results for the asserted producer, check guard, and fixture
      migration requirements. Keep the existing spec-defect exploration
      separate from the post-repair implementation cycles.
    source: built-in
  - severity: important
    category: acceptance_criteria
    file: bazel_rules/go/private/check.bzl
    line: 382
    title: Migrated negative tests bypass the ArccCheck action
    details: |
      arcc_check_test merges _component_arcc_group at
      bazel_rules/go/private/check.bzl:294-300, but arcc_check_grep_test and
      arcc_check_report_golden_test do not merge it at lines 365-386 and
      445-468. The migrated negative targets
      (bazel_rules/go/tests/BUILD.bazel:187-224 and :305-310) use those latter
      rules, so their tests run a fresh direct arcc check and inspect its
      output without building the component's checked ArccCheck report. This
      leaves AC4's required checked-action/report coverage absent for the
      broken-checker, undeclared-member, hazard, and report-boundary negative
      fixtures.
    suggested_action: |
      Make the grep and golden assertion rules consume the component's arcc
      output group, and have their launchers inspect the staged report artifact
      (or add equivalent checked-analysis test targets). Preserve the expected
      negative assertions while proving that the producer action, rather than
      only a duplicate direct CLI invocation, generated the failing report.
    source: built-in
  - severity: suggestion
    category: tests
    file: bazel_rules/go/tests/asserted_surface_sdk_key_test.sh
    line: 57
    title: SDK equality guard lacks non-default key coverage
    details: |
      The identity script compares toolchain, GOOS/GOARCH, classifier and map
      format fields, but never compares cgoEnabled, buildTags, or goexperiment.
      The only asserted fixture uses the default zero-valued configuration, so
      those fields are omitted on both surfaces. The writer handles the fields
      at bazel_rules/go/private/component.bzl:204-216, but the equality guard
      does not exercise a non-default configuration.
    suggested_action: |
      Add a transitioned/manual PACKAGE_SURFACE fixture or explicit JSON checks
      covering non-empty build tags and GOEXPERIMENT (and cgo state where
      supported), including equality with the checked emitter for every SDK-key
      field.
    source: built-in

