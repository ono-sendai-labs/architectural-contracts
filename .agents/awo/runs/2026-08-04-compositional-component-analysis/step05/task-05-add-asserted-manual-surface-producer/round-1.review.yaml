merge_request:
  title: "feat(rules): add asserted manual surface producer [Component Analysis: Step 05/Task 05]"
  body: |
    Reviews the complete ordered series against the I6 specification repair:
    the ArccStdlibMapInfo SDK-key seam (rtlqvlmt), analysis-time asserted
    producer (skooplmu), fail-closed asserted checks and check_tags macro
    support (nuxnmkq), fixture migration (rnultsnr), documentation and audit
    completion (pvtlluqu), and the round-1 rework (nouumpqx) that stages and
    asserts checked reports for grep/golden tests and adds RED reconstruction
    evidence. Focused Bazel coverage passes for the asserted, migrated,
    negative, and report-golden paths.

summary: |
  Both prior important findings and the prior partial AC4 status are resolved:
  the rework stages each component's ArccCheck output group, checks the staged
  report in grep assertions, and validates the migration topology, while
  work.log now records reproducible RED-before/GREEN-after evidence. All seven
  acceptance criteria pass, and the focused re-review suite ran 32 tests
  successfully. One nonblocking suggestion remains for exercising non-default
  SDK-key configurations and parsing the boolean cgoEnabled field explicitly;
  no LSP tool was available in the review harness.

acceptance_criteria:
  - text: |
      1. **Manual components are structurally asserted**
         - Given a `manual`-tagged component
         - When analyzed
         - Then its provider carries a canonical surface, `report = None`, and `provenance = "asserted"`, with no component analysis action.
    status: pass
    evidence: |
      The manual branch writes only the surface and sets report/provenance at
      bazel_rules/go/private/component.bzl:549-580. The analysis test checks the
      provider and exactly three FileWrite actions, with no ArccCheck mnemonic,
      at bazel_rules/go/tests/asserted_surface_tests.bzl:81-102.
  - text: |
      2. **Asserted surfaces carry exactly their analysis-time content**
         - Given a manual `PACKAGE_SURFACE` fixture
         - When its surface is built
         - Then its packages match the layout and its namespace, SDK key, format version and producer version equal what a checked emitter would derive for the same component; its symbol list is empty and its digest is the empty string.
    status: pass
    evidence: |
      The canonical I6 writer and complete SDK-key assembly are implemented at
      bazel_rules/go/private/component.bzl:197-247 and :571-578. The analysis
      test decodes the write content and checks package-level fields, SDK-key
      identity, and omitted zero-valued symbols/digest at
      bazel_rules/go/tests/asserted_surface_tests.bzl:112-146. The reworked
      identity script also checks presence/value symmetry for cgoEnabled,
      buildTags, and goexperiment at
      bazel_rules/go/tests/asserted_surface_sdk_key_test.sh:57-80.
  - text: |
      2b. **A declared-interface component cannot be asserted**
         - Given a `manual`-tagged declared-interface component
         - When it is analyzed
         - Then analysis fails with an error naming the target and stating that asserted surfaces are package-level (I6), rather than emitting a partial or symbol-less declared-interface surface.
    status: pass
    evidence: |
      bazel_rules/go/private/component.bzl:558-563 fails manual declared-interface
      targets with the target name and package-level/I6 explanation. The fixture
      is defined at bazel_rules/go/tests/testdata/reportboundary/manual/BUILD.bazel:32-36
      and the expect-failure assertions are at
      bazel_rules/go/tests/asserted_surface_tests.bzl:17-35.
  - text: |
      3. **Provenance is not self-asserted by the file**
         - Given checked and asserted surfaces with otherwise identical schema content
         - When their providers are inspected
         - Then only provider/report topology distinguishes them; the surface schema contains no checked/asserted bit.
    status: pass
    evidence: |
      The asserted surface key-set test at
      bazel_rules/go/tests/asserted_surface_tests.bzl:148-170 excludes any
      provenance field, and proto/archcontracts/v1/surface.proto:22-27
      explicitly documents that the shared schema has no provenance field.
      Provider topology is set separately in
      bazel_rules/go/private/component.bzl:611-652.
  - text: |
      4. **Negative fixtures remain real analyses**
         - Given fixtures previously tagged manual only to suppress an autogenerated failing test
         - When their explicit expect-violation tests run after migration
         - Then they execute the checked analysis action and assert a failing report rather than receiving an asserted surface.
    status: pass
    evidence: |
      The rework stages the component arcc output group for grep and golden
      assertion rules at bazel_rules/go/private/check.bzl:383-412 and :482-509;
      grep assertions inspect both the direct command output and the staged
      producer report at :351-363. The new analysis tests verify the staged
      report/surface runfiles at bazel_rules/go/tests/component_tests.bzl:584-623.
      The post-repair RED reconstruction and GREEN evidence are recorded in
      work.log:59-71, and the focused suite passes the migrated negative and
      report-boundary tests.
  - text: |
      5. **An asserted component cannot masquerade as checked**
         - Given an explicitly requested `.check` for an asserted component
         - When Bazel analyzes it
         - Then it is absent or fails with a clear no-checked-report diagnostic, never passes from the asserted surface.
    status: pass
    evidence: |
      defs.bzl omits the generated check for manual components at
      bazel_rules/go/defs.bzl:188-204, and all three explicit assertion-rule
      families now fail closed through _require_checked_component at
      bazel_rules/go/private/check.bzl:94-112, :383-386, and :482-485. The
      expect-failure analysis test is at
      bazel_rules/go/tests/asserted_surface_tests.bzl:37-57.
  - text: |
      6. **Default builds remain lazy**
         - Given wildcard/default builds containing checked and asserted components
         - When no `arcc` output group or check is requested
         - Then no checked analysis runs and asserted artifacts are not unnecessarily materialized as default outputs.
    status: pass
    evidence: |
      DefaultInfo remains manifest plus layout and the arcc output group is
      assembled separately at bazel_rules/go/private/component.bzl:611-652.
      The asserted fixture's analysis test verifies both default outputs and
      the surface-only arcc group at
      bazel_rules/go/tests/asserted_surface_tests.bzl:172-192. The focused
      re-review suite passes without changing this topology.

findings:
  - severity: suggestion
    category: tests
    file: bazel_rules/go/tests/asserted_surface_sdk_key_test.sh
    line: 61
    title: SDK symmetry check lacks non-default cgo coverage
    details: |
      The rework adds presence/value symmetry checks for cgoEnabled, buildTags,
      and goexperiment, resolving the prior default-configuration coverage gap.
      However, surface_field only parses quoted string values, so a true JSON
      boolean cgoEnabled is read as empty just like an absent field. The current
      fixture is cgo-off, so this does not affect the reviewed behavior, but a
      future non-default configuration could evade this guard.
    suggested_action: |
      Parse cgoEnabled with a boolean-aware JSON parser or add a transition
      fixture that explicitly exercises nonzero SDK-key fields and verifies
      asserted/checked presence and values for every field.
    source: built-in

