escalation:
  reason: spec_defect
  details: |
    The review's critical finding — manual-tagged components take the checked
    path (ArccCheck action, checked report/surface, provenance = "checked") —
    is confirmed: e.g. the genuinely unowned
    //bazel_rules/go/tests/testdata/reportboundary/manual:manual_component
    carries an ArccCheck action today. Fixing it means implementing the
    manual→asserted producer branch (analysis-time asserted surface, no action,
    no report, provenance = "asserted"), which is the explicit charter of
    step05/task-05 ("Add Asserted Manual Surface Producer", reqs 1-9), including
    its requirement 6 to audit every current `manual` tag and migrate the
    fixture-only uses (about fifteen fixtures across testdata and go/internal
    use `manual` purely to keep deliberately failing autogenerated `.check`
    targets out of `bazel test //...`) and its requirement 7 to define
    `.check` behavior for asserted components.

    The finding and this task cannot both be satisfied here: flipping
    manual→asserted inside task 4 without that audit would misclassify the
    fixture-only tags (e.g. undeclared_dep_component, the AC2 violating
    checked fixture used by checked_violating_analysis_test) and would remove
    the violating CHECKED fixture that task 4's own AC2 execution coverage
    requires; inventing the fixture-migration arrangement is exactly the
    task-5 design decision this round may not guess. What was implemented
    instead in this round's fresh change (rylmkxmz): every other critical and
    important finding plus both suggestions — shared-argv rerouting of the
    golden rule, expect_verdict enum validation, exact transition input set
    with negative assertions, transitioned-configuration SDK-key identity
    execution coverage, an action-level tool-error failure gate, fail-closed
    wrapper, and requirement-scoped RED/GREEN work.log entries. Decision
    needed: either apply the manual→asserted branch in step05/task-05 (its
    task file already specifies it) or amend task-04's scope with the audit
    and migration plan; the reviewed provenance risk (unverified components
    labeled checked) persists until then.

notes: |
  Rework round 1: fixed every important finding and both suggestions and
  produced a fresh child change (rylmkxmz) on top of the round-0 series, with
  requirement-scoped RED/GREEN evidence in work.log and a green `just ci`
