acceptance_criteria:
  - text: "Checked components publish structural outputs"
    addressed: yes
    evidence: |
      component.bzl _checked_analysis_action produces <name>.report.json and
      <name>.surface.json by one ArccCheck action; ArccComponentInfo carries
      surface/report and provenance = "checked" for regular producers.
      _checked_component_outputs_test passes.

  - text: "Violations are data, tool errors fail the action"
    addressed: partial
    evidence: |
      Conforming (checked_api_analysis_test, verdict pass) and violating
      (checked_violating_analysis_test, verdict fail) actions succeed; the CLI
      sh_test pins exit 2 with no report on a malformed manifest. The remaining
      half — observing a Bazel ArccCheck action fail on a tool error — is now
      enforced by the just bazel-test gate: requesting
      //bazel_rules/go/tests/testdata/malformed:broken_go_component
      --output_groups=+arcc fails with "failed to load package facts" while the
      wildcard default build stays green (broken source is manual-tagged).
      Marked partial only because the gate is a CI-level assertion rather than
      an in-sandbox test, which is the strongest available mechanism.

  - text: "Analysis outputs are lazy"
    addressed: yes
    evidence: |
      DefaultInfo unchanged; report/surface only in OutputGroupInfo(arcc);
      analysis test asserts default outputs exactly manifest+layout; work.log
      records default build without the artifacts, +arcc build with both, and a
      green full `bazel build //...`.

  - text: "Dependent checks establish producer order"
    addressed: yes
    evidence: |
      Dep report/surface are declared action inputs; .check and
      arcc_checked_analysis_test stage the component's arcc group;
      _checked_action_inputs_test asserts shared_component's report/surface
      among api_component's inputs; aquery (work.log) shows both ArccCheck
      actions in the dependent test's build graph.

  - text: "Inputs match the Step 5 transition"
    addressed: yes
    evidence: |
      _checked_action_inputs_impl now classifies every input against the
      layout's SDK repository prefix and compares the exact non-SDK set
      (closure sources, manifest, layout, map, dep manifests/layouts and
      producer artifacts), plus negatives: no ".export" files, no "cache"
      paths, no "go"/".a" toolchain binaries; the action declares an empty
      environment. Export-data/member-only semantics remain unclaimed (no
      export inputs exist at all).

  - text: "Target identity is coherent"
    addressed: partial
    evidence: |
      The layout pins toolchain_version/goexperiment; the new
      transitioned_surface_sdk_key_test analyzes api_component under a
      darwin/arm64, cgo-off, build-tagged configuration and verifies the
      surface's complete SDK key (toolchain, GOOS, GOARCH, cgo, tags) against
      its own configuration's map via `arcc stdlibmap inspect --expect-key`,
      and that the default configuration's map rejects the same key. Partial
      only in that GOEXPERIMENT variation would require transitioning the
      SDK itself: rules_go stamps GOEXPERIMENT from the SDK (go_target_mode
      reads sdk.experiments), so the field is coherent across the
      configurations these rules can distinguish; a non-default GOEXPERIMENT
      key is exercised at the stdlibmap layer (Step 4 key tests).

  - text: "Artifacts are deterministic"
    addressed: yes
    evidence: |
      arcc_checked_analysis_test re-executes the exact analysis command twice
      and requires byte-identity between runs and with the action's artifacts;
      CLI repeated-run determinism tests remain green.

