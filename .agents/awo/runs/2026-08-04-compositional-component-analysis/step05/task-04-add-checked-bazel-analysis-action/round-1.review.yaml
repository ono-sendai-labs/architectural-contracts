merge_request:
  title: "feat(bazel): checked component analysis action [Compositional Analysis: Step 05/Task 04]"
  body: |
    Reviews the complete five-change series from the task base. The initial
    implementation adds the checked ArccCheck action, provider/output-group
    wiring, shared command options, target pinning, dependency producer edges,
    and the layout-root fix. The following changes add rules_testing analysis
    coverage, execution coverage for verdicts/determinism/SDK identity and
    tool errors, documentation and layout goldens, then rework the argv
    construction, verdict validation, exactness/identity checks, malformed
    action gate, and wrapper failure handling.

summary: |
  The rework resolves the shared-argv drift, verdict interpolation validation,
  fail-closed wrapper setup, action-level tool-error gate, and adds transitioned
  target coverage; the full `just ci` gate passes. The prior critical manual
  component finding remains escalated: task 4 covers checked regular producers,
  while task 5 explicitly owns the manual-to-asserted branch, tag audit, and
  fixture migration, leaving no unambiguous in-scope remediation for this task.
  AC5's exact-input assertion is still tautological, AC6 still lacks a
  non-default GOEXPERIMENT and explicit cgo-off assertion, and the work log
  still has no actual RED/GREEN entries. No tests were deleted, the layout
  golden additions remain correct, and LSP diagnostics were unavailable.

acceptance_criteria:
  - text: |
      1. **Checked components publish structural outputs**
         - Given a regular `go_component`
         - When analyzed
         - Then its provider carries `<name>.surface.json`, `<name>.report.json`, and `provenance = "checked"`, produced together by one ordinary analysis action.
    status: pass
    evidence: |
      The regular checked path remains at
      `bazel_rules/go/private/component.bzl:260-302` and
      `:492-552`: one `ArccCheck` action produces the two declared artifacts,
      the provider carries them with `provenance = "checked"`, and the output
      group excludes them from `DefaultInfo`. The analysis assertions at
      `bazel_rules/go/tests/component_tests.bzl:391-416` still pass. The
      unresolved manual-tag behavior is a separate transitional producer scope
      issue documented in the escalation and does not change this regular-
      producer criterion.

  - text: |
      2. **Violations are data, tool errors fail the action**
         - Given conforming, violating, and malformed fixtures
         - When their analysis outputs are requested
         - Then conforming and violating actions succeed with pass/fail reports, while the malformed/tool-error action fails.
    status: pass
    evidence: |
      The prior round's partial action-level coverage is addressed by the
      malformed Go fixture at
      `bazel_rules/go/tests/testdata/malformed/BUILD.bazel:17-28` and the
      expected-failure Bazel gate at `justfile:81-85`, which requests
      `--output_groups=+arcc` and verifies the package-load failure. The pass
      and violation action tests remain registered at
      `bazel_rules/go/tests/BUILD.bazel:21-32`, while the malformed-manifest
      CLI test remains at `malformed_manifest_tool_error_test.sh:17-31`.
      The re-review's full `just ci` run passed these paths.

  - text: |
      3. **Analysis outputs are lazy**
         - Given wildcard/default builds and an explicit `--output_groups=+arcc` build
         - When action execution is observed
         - Then the default build runs no component analysis, while the output-group build produces both artifacts.
    status: pass
    evidence: |
      `bazel_rules/go/private/component.bzl:521-525` keeps default files to
      manifest/layout and `:547-552` places report/surface only in
      `OutputGroupInfo(arcc)`. The analysis test at
      `bazel_rules/go/tests/component_tests.bzl:406-416` checks the distinction;
      the default and explicit output-group builds are also part of the full
      CI gate and the recorded evidence in `work.log:74-96`.

  - text: |
      4. **Dependent checks establish producer order**
         - Given checked component B depends directly on checked component A
         - When B's report or `.check` is requested
         - Then A's analysis action is in the build graph and builds first, even though B does not semantically read A's artifacts until Step 7.
    status: pass
    evidence: |
      Direct dependency reports/surfaces are collected at
      `bazel_rules/go/private/component.bzl:476-490` and passed as action
      inputs at `:288-294`. `.check` stages the arcc group at
      `bazel_rules/go/private/check.bzl:68-78` and `:274-277`. The analysis
      test still asserts the shared producer artifacts at
      `bazel_rules/go/tests/component_tests.bzl:477-483`, and the aquery
      evidence in `work.log:56-65` shows both producer actions. No dependency
      surface parsing was introduced before Step 7.

  - text: |
      5. **Inputs match the Step 5 transition**
         - Given a checked component action
         - When its action graph is inspected
         - Then it contains the manifest, layout, today's source/runfile closure, required SDK source inputs, Step 4 stdlib map, arcc tool, and direct dependency artifacts; it contains no undeclared host cache/network input and does not yet claim export-data/member-only semantics.
    status: partial
    evidence: |
      The prior round's input-test finding remains only partly addressed. The
      implementation still declares the transition inputs and hermetic action
      settings at `bazel_rules/go/private/component.bzl:275-301`, and the test
      adds SDK-prefix and negative checks at
      `bazel_rules/go/tests/component_tests.bzl:491-527`. However, the supposed
      exact comparison seeds `expected_basenames` from the actual
      `non_sdk_inputs` at `component_tests.bzl:502-504`, making the
      `unexpected` assertion at `:516-521` tautological. Thus the test still
      cannot detect an extra or missing ordinary input; no implementation
      regression was found in the action graph itself.

  - text: |
      6. **Target identity is coherent**
         - Given a target configuration with toolchain version, GOOS/GOARCH, tags, cgo-off, and GOEXPERIMENT
         - When the action emits its surface
         - Then the surface SDK key matches the attached stdlib map exactly and the generated layout carries the target platform fields required to reproduce it.
    status: partial
    evidence: |
      The prior round's partial criterion remains partial. The new transition
      test at `bazel_rules/go/tests/transitioned_surface_sdk_key_test.sh:25-76`
      covers a darwin/arm64 tagged surface and checks it against the transitioned
      map while rejecting the default map. The layout implementation and correct
      golden updates remain at `bazel_rules/go/private/component.bzl:147-163`
      and `bazel_rules/go/tests/goldens/api_component.package-layout.json:69-75`.
      But the shell test does not assert `GOEXPERIMENT`, does not require the
      cgo field to be explicitly false, and derives most expected values from
      the surface rather than independently asserting the configured target.
      Full key validation in `go/cmd/arcc/app/check.go:522-548` is therefore
      not matched by complete checked-action regression coverage.

  - text: |
      7. **Artifacts are deterministic**
         - Given two unchanged executions for the same component inputs
         - When their output files are compared
         - Then report and surface bytes are identical.
    status: pass
    evidence: |
      `bazel_rules/go/private/check.bzl:109-155` still executes the factored
      command twice and compares both outputs with each other and the action's
      artifacts. The pass/violation execution tests remain registered at
      `bazel_rules/go/tests/BUILD.bazel:21-32`; the full re-review CI run and
      the existing native repeated-run tests passed.

findings:
  - severity: critical
    category: architecture
    file: bazel_rules/go/private/component.bzl
    line: 494
    title: Manual transition ownership is unresolved for this task
    details: |
      The prior critical finding remains behaviorally true: the checked action
      is still created for every component with a layout at
      `bazel_rules/go/private/component.bzl:492-512`, and the provider labels
      that output `provenance = "checked"` at `:542-544`, including current
      `manual`-tagged components. The rework deliberately did not change that
      path. Step 5's plan says manual tags should instead produce an asserted
      surface with no action, but the separately planned task
      `.agents/tasks/2026-08-04-compositional-component-analysis/step05/task-05-add-asserted-manual-surface-producer.code-task.md`
      explicitly owns that branch, its audit of all manual tags, migration of
      fixture-only tags, and asserted `.check` behavior. Task 4's own malformed
      checked-action fixture is also manual-tagged solely to keep its failing
      check out of wildcard tests. Applying the branch here would require
      choosing task 5's migration and scope decisions, not implementing task 4
      alone; the unverified manual boundary remains represented as checked.
    suggested_action: |
      Resolve the task sequencing/specification before another implementation
      round: either explicitly accept the task-4 transitional state until task
      5, or amend the task boundary and migrate the manual fixtures as part of
      this task. Do not silently choose task 5's audit and migration arrangement
      inside task 4, because that changes which fixtures are checked versus
      asserted and changes task 4's required AC2 coverage.
    source: built-in

  - severity: important
    category: tests
    file: .agents/scratchpad/2026-08-04-compositional-component-analysis/step05/task-04-add-checked-bazel-analysis-action/work.log
    line: null
    title: Requirement-level RED/GREEN evidence remains absent
    details: |
      The prior important finding is not resolved by the rework claim in
      `progress.md:78-80`. The current `work.log:1-158` contains command lines,
      test output, and strings such as `PASS`, but no requirement-scoped RED
      entry followed by a GREEN entry. This leaves the TDD evidence for the
      provider, input, laziness, producer-edge, and rework requirements
      unauditable even though the full CI gate passes.
    suggested_action: |
      Add honest requirement-scoped RED/GREEN records to the task work log for
      the analysis-action and rework requirements, preserving the actual command
      failures and fixes rather than treating test output containing `PASS` as
      a TDD cycle.
    source: built-in

  - severity: important
    category: acceptance_criteria
    file: bazel_rules/go/tests/component_tests.bzl
    line: 502
    title: Exact input-set test is still tautological
    details: |
      The rework adds the requested negative filters, but its principal exactness
      test initializes `expected_basenames` from every basename in the actual
      action input list at `bazel_rules/go/tests/component_tests.bzl:502-504`.
      Consequently every actual ordinary input is expected by construction and
      `unexpected` can never expose an extra input. This is the same AC5 gap
      identified in the prior review, not a resolved exact-input contract.
    suggested_action: |
      Construct the expected set only from the independently enumerated manifest,
      layout, closure, map, dependency artifacts, arcc tool/runfiles, and SDK
      categories; then compare the normalized path set exactly and retain the
      explicit forbidden-input and execution-requirement assertions.
    source: built-in

  - severity: important
    category: acceptance_criteria
    file: bazel_rules/go/tests/transitioned_surface_sdk_key_test.sh
    line: 25
    title: Transition test still omits GOEXPERIMENT and cgo-off assertion
    details: |
      The new test improves the prior identity coverage but `surface_key_specs`
      at `bazel_rules/go/tests/transitioned_surface_sdk_key_test.sh:25-47`
      never extracts `goexperiment`, and it adds `cgo_enabled` only when the
      surface happens to serialize the field. The darwin case therefore does not
      independently prove cgo is false or that the surface's GOEXPERIMENT agrees
      with its target; its expected key is mostly derived from the output being
      tested. The task's AC6 explicitly includes both fields.
    suggested_action: |
      Add independent expected target values for cgo-off and GOEXPERIMENT (or a
      configuration where the SDK exposes a non-default experiment), include
      them in the complete `--expect-key` comparison, and assert the expected
      GOOS/GOARCH/toolchain rather than only checking that the surface differs
      from the default.
    source: built-in

  - severity: suggestion
    category: tests
    file: justfile
    line: 84
    title: Tool-error gate uses a shared fixed temporary path
    details: |
      The new expected-failure gate writes to `${TMPDIR:-/tmp}/broken_go_component.out`
      without cleanup. Concurrent `just ci` runs can overwrite or read one
      another's output, making the gate nondeterministic; the path is also not
      quoted for unusual temporary-directory names.
    suggested_action: |
      Allocate a unique temporary output with `mktemp`, quote the path, and clean
      it up after checking the expected Bazel failure.
    source: built-in

