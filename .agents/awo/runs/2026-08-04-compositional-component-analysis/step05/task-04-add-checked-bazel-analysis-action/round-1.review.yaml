escalation:
  reason: spec_defect
  details: |
    The prior critical manual-component finding remains present, but the
    implementer cannot safely fix it within task 4 without selecting task 5's
    manual-to-asserted branch, full manual-tag audit, fixture migration, and
    asserted-check behavior. Task 4's acceptance/technical requirements are
    scoped to checked regular producers, while the shared Step 5 plan also
    describes the manual asserted transition and task 5 separately declares
    ownership of it. The malformed checked-action fixture in task 4 is itself
    manual-tagged to preserve the task's negative-action coverage, so changing
    the tag semantics here would alter the task's fixture contract. This is an
    unresolved specification/scope conflict rather than a safe code-only
    rework; the orchestrator must decide whether task 4 is allowed to leave this
    transitional state or must absorb task 5's migration before implementation
    can be approved.
