notes: |
  Implemented the checked-component analysis action owned by go_component: one
  ordinary ArccCheck action running the shared command.bzl construction in
  report-verdict-only mode, publishing report/surface via OutputGroupInfo(arcc)
  with provenance="checked" on ArccComponentInfo, the default stdlib-map seam
  attached, layout platform pinning fields added, and dep report/surface
  artifacts declared as producer-chain inputs. The action recreates the
  runfiles path frame in the sandbox (workspace + external-repo symlinks
  derived from declared inputs) to keep the layout-driver working-directory
  contract hermetic; surfaceinputs.go now resolves declared interface files
  against the active layout workspace dir in layout mode (the frame Bazel
  manifests use). Analysis (rules_testing) and execution (verdict, determinism,
  SDK-key coherence, tool-error) coverage added; layout goldens regenerated;
  README/macro/schema docs updated. Full `just ci` green across four
  incremental jj commits (pwqpnyst, xooqnlnx, ytsmxsxl, ttrpqutq). The RED
  phase for the wiring ran intertwined with exploration because the action's
  enabling constraints (sandbox frame, map-key match) had to be proven
  constructively; the execution tests were driven RED→GREEN after the wiring.
