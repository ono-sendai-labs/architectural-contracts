notes: |
  Migrated all three check assertion rules to consume the provider's canonical report: arcc_check_test runs
  `arcc verdict`, grep asserts the verdict then fixed-string-greps the report, and the golden rule diffs the
  persisted report.json (text/display goldens regenerated into persisted JSON goldens). Runfiles were reduced to
  report + arcc/golden, task-05's output-group staging assertions were repurposed, and a new analysis-test suite
  pins the launcher argv, minimal runfiles, exactly-once producer chain, default-build laziness, and
  asserted-provider rejection. Two incremental commits were produced (wuzvtynw implementation, ttynupvl docs);
  the last one, at @-, is reported as the task change.
