merge_request:
  title: "feat(bazel): add runtime injection adapter hooks [Compositional Analysis: Step 12/Task 02]"
  body: |
    Reviews the complete three-change task series: the initial upstream-empty
    adapter contracts, the package-view/infra-attachment implementation and
    synthetic runtime fixtures, and the final injected-versus-ordinary export
    conflict coverage. Focused runtime-injection tests and `just ci` pass.

summary: |
  The change series implements inert adapter hooks, deterministic injected-package
  merging, infra auto-attachment, export-backed action inputs, and fail-closed
  cgo/export conflict handling; the focused suite and `just ci` both pass. AC2
  and AC4 remain only partially verified because the synthetic member code never
  imports or type-checks against the injected runtime, and the test inspects an
  intermediate layout rather than proving the final type-loading path. The new
  Go fixture also has an extra blank line at EOF detected by `gofmt`.

acceptance_criteria:
  - text: |
      1. **Empty upstream hooks are inert**
        - Given the default rules_go adapter returns no runtime attributes or extra packages
        - When every existing component is analyzed and checked
        - Then its rule shape, declared actions/inputs, canonical artifacts, and verdict are unchanged.
    status: pass
    evidence: |
      `bazel_rules/go/private/go_adapter.bzl:94-132` defines the upstream `{}`
      and `[]` defaults, and `bazel_rules/go/tests/runtime_injection_tests.bzl:47-73`
      asserts them. The focused suite and `just ci` passed with all 175 Bazel
      tests green.
  - text: |
      2. **Injected runtime packages enter the effective layout**
        - Given a fake host adapter exposing a synthetic runtime package that is absent from the ordinary root package records
        - When a component is analyzed
        - Then the package is present once in the merged layout/closure with deterministic metadata and the export material needed for non-member type loading.
    status: partial
    evidence: |
      `bazel_rules/go/private/component.bzl:840-849` merges injected records
      before the later stages, and `bazel_rules/go/tests/runtime_injection_tests.bzl:106-115`
      finds one injected package and its export file in the generated
      `package-layout.base.json`. The final layout is generated by the existing
      merge action, but no test exercises that package through actual member
      type loading; see the important test-coverage finding.
  - text: |
      3. **The existing infra boundary claims the runtime**
        - Given the fake injected package matches a registered infra package-surface component
        - When attachment and component membership are classified
        - Then that component is auto-attached, the runtime package is covered by its surface, and it is neither made a member nor reported as an undeclared dependency.
    status: pass
    evidence: |
      `bazel_rules/go/private/component.bzl:859-919` supplies the canonical
      merged view to attachment before classification, while
      `bazel_rules/go/tests/runtime_injection_tests.bzl:94-123` verifies the
      auto-attached manifest/layout binding and that the runtime is not a member.
      `injected_runtime_analysis_test` passed with no report violations.
  - text: |
      4. **No author declaration is required for hidden runtime wiring**
        - Given member code that type-checks only when the synthetic injected runtime is available
        - When the component is checked without naming that runtime in `component_deps`, members, or declared authority
        - Then the check passes, the manifest/layout record an auto-attached dependency edge, and the report records the infra boundary with its actual checked/asserted authority and provenance axes.
    status: partial
    evidence: |
      `bazel_rules/go/tests/testdata/injected_runtime/BUILD.bazel:28-41`
      supplies the runtime through the test-only seam and does not declare it
      as a member or component dependency. The manifest/layout binding is
      checked at `runtime_injection_tests.bzl:94-123`, and the end-to-end check
      passes. However the fixture's member sources do not import the runtime,
      so the required type-check-only-when-injected scenario and its report
      dependency-axis assertion are not exercised.
  - text: |
      5. **Injected inputs obey the analysis-action allowlist**
        - Given the synthetic runtime check action
        - When its declared inputs are inspected
        - Then it contains member sources, the final manifest/layout, required export data, dependency surfaces/reports, and the stdlib map, but no runtime/dependency Go source or host toolchain binary.
    status: pass
    evidence: |
      `bazel_rules/go/private/component.bzl:1017-1022` puts merged non-member
      records on the export-file path, and `component.bzl:690-767` constructs
      the single allowlisted `ArccCheck` action. The injected action assertions
      at `bazel_rules/go/tests/runtime_injection_tests.bzl:125-132` find the
      runtime export and infra surface, reject `runtime.go`, and require one
      `ArccCheck`; `just ci` passed the repository hermeticity checks.
  - text: |
      6. **Invalid injected metadata fails closed**
        - Given an injected cgo package or injected/ordinary records that conflict for one import path
        - When the component is analyzed
        - Then analysis fails with an actionable component/package diagnostic instead of selecting data by iteration order.
    status: pass
    evidence: |
      `bazel_rules/go/private/component.bzl:848-857` retains merge-before-cgo
      validation, and `bazel_rules/go/private/aspect.bzl:53-113` rejects missing
      or conflicting export artifacts deterministically. The injected cgo,
      injected-injected conflict, and injected-ordinary conflict tests at
      `bazel_rules/go/tests/runtime_injection_tests.bzl:134-183` all pass with
      component/package diagnostics.
  - text: |
      7. **Determinism and integration remain green**
        - Given reordered injected package and registry inputs
        - When artifacts are produced repeatedly and `just ci` runs
        - Then attachment, layout records, report/surface bytes, and verdicts are identical and all existing self-checks pass.
    status: pass
    evidence: |
      `bazel_rules/go/tests/runtime_injection_tests.bzl:185-203` compares the
      layouts for reversed injected-package order, while
      `injected_runtime_analysis_test` re-executes the checked action and
      compares report/surface bytes and the passing verdict. The independently
      rerun `just ci` passed all 175 Bazel tests and self-check stages.

findings:
  - severity: important
    category: tests
    file: bazel_rules/go/tests/runtime_injection_tests.bzl
    line: 83
    title: Synthetic fixture never type-loads the injected runtime
    details: |
      The task requires a member scenario that type-checks only when the hidden
      runtime is available. The fixture at
      `bazel_rules/go/tests/testdata/injected_runtime/BUILD.bazel:28-41`
      uses ordinary `api`, `core`, `extradep`, and `lowlevel` members; none of
      their sources imports or references `example.com/injected/runtime`, and
      `runtime.go` only declares an unused marker type. The analysis test reads
      the intermediate `package-layout.base.json` at lines 106-115, while the
      checked execution test only proves byte reproduction and a pass. Thus a
      broken export-backed type-loading path could still satisfy the new tests,
      leaving the type-loading portion of AC2 and the prerequisite behavior in
      AC4 unverified.
    suggested_action: |
      Add a member fixture whose source imports or references the synthetic
      runtime while the runtime record remains supplied only through the
      test-only injection seam. Assert successful checked analysis, the runtime
      package in the final `package-layout.json`, and the expected dependency
      authority/provenance fields in the report while asserting that the
      `ArccCheck` inputs still contain the export artifact but not runtime Go
      source. Keep the runtime out of ordinary root projection so the test
      continues to prove hidden wiring.
    source: built-in
  - severity: nit
    category: style
    file: bazel_rules/go/tests/testdata/injected_runtime/runtime.go
    line: 6
    title: Remove the extra blank line at EOF
    details: |
      `gofmt -l bazel_rules/go/tests/testdata/injected_runtime/runtime.go`
      reports the newly added fixture, and `gofmt -d` shows an extra blank line
      after the final declaration. The repository's `just lint` only scans the
      `go/` module, so `just ci` does not catch this Bazel testdata file.
    suggested_action: |
      Run `gofmt` on the new fixture so it has the repository-standard single
      newline at EOF.
    source: built-in

