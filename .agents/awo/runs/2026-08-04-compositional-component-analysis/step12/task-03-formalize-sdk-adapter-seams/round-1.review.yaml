merge_request:
  title: "feat(bazel): formalize SDK adapter seams [Compositional Analysis: Step 12/Task 03]"
  body: |
    Reviews the complete ordered series: the initial implementation change
    tyrvsuvyoqrlponsmrtmprtmsoxlvyur formalized the source, export-data, and
    target-identity seams and added fake-descriptor coverage; the follow-up
    pntmwtromuykvxkqpxkkmtvyzkylxpnp made a documentation-only README
    clarification; and the rework okmqmruvtnzqmyyuypvmnqxkvlplwrnv added
    component/map identity validation plus transitioned positive and negative
    analysis coverage.

summary: |
  Both prior important findings are resolved in the fresh rework change: the
  component now rejects actual-target versus selected-map identity drift before
  emitting any layout, export-data action, or asserted surface, and the test
  suite covers the opposite-map diagnostic plus transitioned export/layout
  identity. The full CI gate, the new seven-target adapter suite, and the
  existing transitioned checked-surface key test pass, with no test deletions,
  style regressions, or security issues found.

acceptance_criteria:
  - text: |
      **SDK sources are scoped to map generation**
      - Given the default upstream adapter
      - When `ArccStdlibMap` and `ArccCheck` actions are inspected
      - Then only the map action receives SDK source/oracle material, and no component check action directly or transitively receives SDK `.go` files.
    status: pass
    evidence: |
      `bazel_rules/go/private/stdlib_map.bzl:77-138` obtains only the source
      contract and declares its sources, while
      `bazel_rules/go/private/component.bzl:746-778` declares the check
      allowlist from the export descriptor. Existing allowlist coverage in
      `bazel_rules/go/tests/component_tests.bzl:740-807` and the fake-source
      rejection in `bazel_rules/go/tests/sdk_adapter_tests.bzl:123-138` pass.
  - text: |
      **Alternative export data is honored**
      - Given a fake adapter descriptor containing sentinel stdlib metadata and compiled export artifacts
      - When a checked component is analyzed
      - Then its layout names the alternative descriptor, its `ArccCheck` inputs contain the sentinel set, and replaced upstream export artifacts are not selected merely through hard-coded rules_go access in `component.bzl`.
    status: pass
    evidence: |
      The test-only descriptor is defined in
      `bazel_rules/go/tests/testing.bzl:51-69` and injected through
      `bazel_rules/go/tests/testing.bzl:215-230`. The production component
      callback boundary and validation are at
      `bazel_rules/go/private/component.bzl:785-793` and `:940-946`; sentinel
      layout/input assertions and absence of the upstream export roots are in
      `bazel_rules/go/tests/sdk_adapter_tests.bzl:37-65`. The positive
      transitioned layout test also verifies sentinel material at
      `bazel_rules/go/tests/transitioned_sdk_export_layout_test.sh:6-15`.
  - text: |
      **Target and SDK-key identity have one source**
      - Given default and transitioned target configurations
      - When map providers, layouts, export descriptors, checked surfaces, and asserted surfaces are inspected
      - Then toolchain version, GOOS, GOARCH, cgo, sorted tags, and GOEXPERIMENT agree exactly for each target and differ where the transition changes them.
    status: pass
    evidence: |
      The prior round's partial criterion is addressed by the rework's shared
      comparison at `bazel_rules/go/private/go_adapter.bzl:480-491` and its
      call before any component artifact emission at
      `bazel_rules/go/private/component.bzl:927-946`. Transitioned map
      providers are checked at `bazel_rules/go/tests/stdlib_map_tests.bzl:246-269`;
      the transitioned fake-export layout and all target identity fields are
      checked at `bazel_rules/go/tests/transitioned_sdk_export_layout_test.sh:6-15`;
      transitioned checked-surface/map key equality is covered by
      `bazel_rules/go/tests/transitioned_surface_sdk_key_test.sh:56-97`; and
      asserted/checked key equality remains pinned by
      `bazel_rules/go/tests/asserted_surface_sdk_key_test.sh:71-89`.
  - text: |
      **Incomplete or mismatched adapter data fails early**
      - Given a source descriptor without an oracle/root, an export descriptor without graph metadata/artifacts, or target identity that disagrees with the selected map
      - When the relevant rule is analyzed
      - Then analysis fails before action execution with an actionable diagnostic naming the target and fields/material at fault.
    status: pass
    evidence: |
      The prior round's partial criterion is addressed by
      `validate_target_identity_match` at
      `bazel_rules/go/private/go_adapter.bzl:480-491`, called before descriptor,
      layout, or surface emission at
      `bazel_rules/go/private/component.bzl:931-939`. The opposite-map fixture
      asserts the target-named diagnostic and mismatched `goos, goarch` fields
      in `bazel_rules/go/tests/sdk_adapter_tests.bzl:140-155`. Source/export
      completeness and forbidden material remain covered by
      `bazel_rules/go/private/go_adapter.bzl:590-668` and
      `bazel_rules/go/tests/sdk_adapter_tests.bzl:67-138`.
  - text: |
      **Ruleset-specific knowledge stays in the adapter**
      - Given the finalized Bazel implementation
      - When loads and provider accesses are audited
      - Then only `go_adapter.bzl` names rules_go's `GoStdLib`, `GoConfigInfo`, SDK/provider internals, or export-stdlib transition; generic component/map rules consume host-neutral contracts.
    status: pass
    evidence: |
      The rules_go loads and provider/private-field accesses remain confined to
      `bazel_rules/go/private/go_adapter.bzl:28-31` and `:693-730`; generic
      consumers import adapter contracts at
      `bazel_rules/go/private/component.bzl:45-62` and
      `bazel_rules/go/private/stdlib_map.bzl:34-42`. The audit recorded in
      `work.log:1-3` remains valid across the rework.
  - text: |
      **Hermetic action boundaries remain intact**
      - Given both SDK-backed actions
      - When their inputs, tools, environment, and execution requirements are inspected
      - Then they use declared files only, run only the arcc executable appropriate to the action, block network, use no inherited shell environment, and receive no Go/compiler tool or host cache.
    status: pass
    evidence: |
      `bazel_rules/go/private/stdlib_map.bzl:118-138` and
      `bazel_rules/go/private/component.bzl:747-782` use declared inputs,
      `use_default_shell_env = False`, the arcc executable, and
      `block-network`. The action-input assertions in
      `bazel_rules/go/tests/stdlib_map_tests.bzl:59-163` and
      `bazel_rules/go/tests/component_tests.bzl:735-807` pass; the rework
      continues to route the selected map through `stdlib_map_info.map` at
      `bazel_rules/go/private/component.bzl:699-742`.
  - text: |
      **Upstream behavior is unchanged**
      - Given the default rules_go adapter and all repository components
      - When canonical layouts/maps/surfaces/reports are rebuilt and `just ci` runs
      - Then existing bytes and verdicts remain stable apart from deliberate test fixtures, and all self-check, determinism, and target-transition coverage passes.
    status: pass
    evidence: |
      The rework's validation log at
      `.agents/scratchpad/2026-08-04-compositional-component-analysis/step12/task-03-formalize-sdk-adapter-seams/work.log:45-73`
      records RED/GREEN coverage for the repaired invariant and a passing
      `just ci` with 184 Bazel tests. The review reran `just ci` successfully,
      the seven new adapter/transition tests passed, and the existing
      transitioned surface-key test passed under its required
      `--define=stdlibmap_full=true` configuration.

