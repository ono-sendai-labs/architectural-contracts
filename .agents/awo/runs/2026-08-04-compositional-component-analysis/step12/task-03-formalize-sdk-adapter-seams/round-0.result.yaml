acceptance_criteria:
  - text: |
      1. **SDK sources are scoped to map generation**
        - Given the default upstream adapter
        - When `ArccStdlibMap` and `ArccCheck` actions are inspected
        - Then only the map action receives SDK source/oracle material, and no component check action directly or transitively receives SDK `.go` files.
    addressed: yes
    evidence: |
      `bazel_rules/go/private/stdlib_map.bzl:77-135` consumes the source/oracle
      descriptor and declares its source depset, while
      `bazel_rules/go/private/component.bzl:698-774` declares only member,
      ordinary-export, dependency-artifact, map, and validated stdlib export
      inputs. `bazel_rules/go/tests/stdlib_map_tests.bzl:63-89` and
      `bazel_rules/go/tests/sdk_adapter_tests.bzl:28-64` assert the role split.
  - text: |
      2. **Alternative export data is honored**
        - Given a fake adapter descriptor containing sentinel stdlib metadata and compiled export artifacts
        - When a checked component is analyzed
        - Then its layout names the alternative descriptor, its `ArccCheck` inputs contain the sentinel set, and replaced upstream export artifacts are not selected merely through hard-coded rules_go access in `component.bzl`.
    addressed: yes
    evidence: |
      `bazel_rules/go/private/component.bzl:784-936` accepts and validates the
      injected `stdlib_export_data_fn`; `bazel_rules/go/tests/testing.bzl:27-99`
      defines the fake descriptor and `:215-228` routes it through the test-only
      seam. `bazel_rules/go/tests/sdk_adapter_tests.bzl:28-64` verifies sentinel
      metadata/export files in the layout and ArccCheck inputs, with
      `stdlib.pkg.json`, `gocache`, and `pkg` absent.
  - text: |
      3. **Target and SDK-key identity have one source**
        - Given default and transitioned target configurations
        - When map providers, layouts, export descriptors, checked surfaces, and asserted surfaces are inspected
        - Then toolchain version, GOOS, GOARCH, cgo, sorted tags, and GOEXPERIMENT agree exactly for each target and differ where the transition changes them.
    addressed: yes
    evidence: |
      `bazel_rules/go/private/go_adapter.bzl:523-548` defines the complete
      target identity and `:566-609` uses it for source material;
      `bazel_rules/go/private/stdlib_map.bzl:77-149` and
      `bazel_rules/go/private/component.bzl:927-961` consume that identity for
      map/layout/export validation. Existing transition coverage in
      `bazel_rules/go/tests/stdlib_map_tests.bzl` and
      `bazel_rules/go/tests/transitioned_surface_sdk_key_test.sh` remains green;
      the fake-descriptor layout test additionally checks GOOS/GOARCH/tags/cgo.
  - text: |
      4. **Incomplete or mismatched adapter data fails early**
        - Given a source descriptor without an oracle/root, an export descriptor without graph metadata/artifacts, or target identity that disagrees with the selected map
        - When the relevant rule is analyzed
        - Then analysis fails before action execution with an actionable diagnostic naming the target and fields/material at fault.
    addressed: yes
    evidence: |
      `go_adapter.bzl:480-503`, `:590-609`, and `:616-664` fail closed on
      incomplete identity/source/export material and mismatched fields.
      `bazel_rules/go/tests/sdk_adapter_tests.bzl:66-138` covers missing
      artifacts, mismatched `goos`, missing source oracle/root/identity, and
      forbidden source material as analysis failures.
  - text: |
      5. **Ruleset-specific knowledge stays in the adapter**
        - Given the finalized Bazel implementation
        - When loads and provider accesses are audited
        - Then only `go_adapter.bzl` names rules_go's `GoStdLib`, `GoConfigInfo`, SDK/provider internals, or export-stdlib transition; generic component/map rules consume host-neutral contracts.
    addressed: yes
    evidence: |
      `bazel_rules/go/private/go_adapter.bzl:28-30,397-417` is the sole
      production load/access boundary for those ruleset-specific providers and
      transition. The audit command and result are recorded in
      `work.log` under `Explore: repository and reference inventory`; generic
      `component.bzl`, `stdlib_map.bzl`, and `aspect.bzl` load only adapter APIs.
  - text: |
      6. **Hermetic action boundaries remain intact**
