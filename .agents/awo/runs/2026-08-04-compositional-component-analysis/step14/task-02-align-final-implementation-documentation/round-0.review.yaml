acceptance_criteria:
  - text: |
      1. **Checked and asserted digest semantics are unambiguous**
         - Given the canonical surface proto and generated Go field comment
         - When a reader examines `SurfaceManifest.digest`
         - Then checked surfaces are described as source-derived and asserted `UNKNOWN` surfaces are explicitly described as carrying an empty non-content claim consistent with I6.
    status: pass
    evidence: |
      `proto/archcontracts/v1/surface.proto:78-84` describes the checked
      source-derived SHA-256 digest and the asserted UNKNOWN empty digest,
      including that no component content was loaded, type-checked, or hashed.
      The generated comment at `go/internal/schema/gen/surface.pb.go:85-91`
      matches it, and the work log records `just gen-is-clean` passing at
      `.../work.log:144-146`.
  - text: |
      2. **The design reads as a completed implementation record**
         - Given the detailed design header and overview
         - When they are read after Step 13
         - Then the status is complete, current behavior is not described as a future proposal, and historical baseline reasoning remains identifiable as historical.
    status: pass
    evidence: |
      `detailed-design.md:10-12` marks the status complete and labels the
      baseline historical. The overview at `detailed-design.md:25-44`, the
      topology labels at `:240` and `:248`, and the Bazel description at
      `:267-269` distinguish historical behavior from the implemented topology;
      the stale proposal/current-baseline phrases identified by the task are
      absent.
  - text: |
      3. **Stale source comments match current behavior**
         - Given hostpolicy namespace hooks, the default stdlib-map attribute, and stdlib package entries
         - When their comments are compared with current call sites and generation behavior
         - Then they contain no removed membership-pattern/future-emitter/unused-Step-5 claims and correctly include build-constraint-based non-importability.
    status: pass
    evidence: |
      `go/internal/hostpolicy/hostpolicy.go:23-47` documents the current path
      hook and implemented namespace emission/consumption. The default map
      consumer is described at `bazel_rules/go/private/stdlib_map.bzl:47-55`.
      `go/internal/stdlibmap/stdlibmap.go:84-89` covers internal paths,
      target-excluded sources, and no-Go-source directories, matching the
      reconciliation behavior at `go/internal/stdlibmap/explicit.go:143-173`.
  - text: |
