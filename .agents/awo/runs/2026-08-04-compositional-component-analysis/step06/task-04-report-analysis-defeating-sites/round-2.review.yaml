summary: |
  All four prior important findings and the prior partial bypass criterion are
  resolved: contracts are current, the cgo fixture is hermetic, ignored
  assembly is covered, and parser errors are preserved. The malformed-source
  fail-closed test survived its move to t.TempDir and still verifies an error
  naming ignored_bad.go; the checked-in tree is now gofmt-clean. All acceptance
  criteria pass, with clean-cache unit/targeted integration tests, vet,
  formatting, and gopls checks passing; the work log records just ci green,
  while a local full-ci rerun remains unavailable because protoc is absent.

acceptance_criteria:
  - text: |
      1. **All bypass constructs fail closed by default**
         - Given member fixtures containing `//go:linkname`, an assembly file, and cgo use
         - When each is checked with strict/default policy
         - Then each yields an `AnalysisDefeating` violation with an actionable source/file site, and none silently conforms
    status: pass
    evidence: |
      The prior partial status is addressed by krppqlwzlwvu. The hermetic
      fixture pins CGO_ENABLED=0 and asserts cgo.go is in IgnoredFiles at
      go/internal/goanalysis/defeat_test.go:23-70; the expected observations
      cover linkname, selected assembly, and ignored assembly at :75-80. The
      strict policy path is covered by TestApplyAuthorityPolicyStrictViolates
      at go/internal/checker/aggregate_test.go:127-178. Fresh targeted
      integration execution passes.
  - text: |
      2. **Policy can explicitly downgrade analysis defeat**
         - Given the same fixture and an explicit policy classifying its analysis-defeating capability as warn
         - When the checker runs
         - Then the result is one `ANALYSIS_LIMITATION` warning and no corresponding authority violation
    status: pass
    evidence: |
      TestApplyAuthorityPolicyExplicitWarn at
      go/internal/checker/aggregate_test.go:180-204 supplies the explicit
      warn policy for the empty analysis-defeating capability and asserts one
      ANALYSIS_LIMITATION warning with all three sites and no violation.
  - text: |
      3. **UNANALYZED map entries use the same policy path**
         - Given a typed reference whose exact stdlib-map record is `UNANALYZED`
         - When classification and checking run
         - Then the observation retains `AnalysisDefeating`, its reference site and symbol, and is a violation by default
    status: pass
    evidence: |
      checker/classify.go:195-214 converts an UNANALYZED terminal record to an
      AnalysisDefeating observation with its Referent, Site, and SDKKey, and
      does not invoke Capslock. The typed classification test at
      go/internal/checker/classify_test.go:105-172 and the aggregation test at
      go/internal/checker/aggregate_test.go:80-114 cover the observation and
      strict-path behavior.
  - text: |
      4. **Authority sites aggregate deterministically**
         - Given three member references that produce the same `(capability, class)` in shuffled observation order
         - When a report is built
         - Then it contains one finding, its sites are sorted and all three appear in canonical JSON, and text prints the first site plus a count of three
    status: pass
    evidence: |
      TestAggregateAuthorityOnePerCapabilityClass at
      go/internal/checker/aggregate_test.go:35-77 supplies three FILES
      references in shuffled order, includes an exact duplicate, and asserts
      one finding with three sorted sites. report/report_test.go:282-304
      asserts the single text entry with the first site and count three, while
      artifactio/report.go:197-294 performs the persisted site sort and
      comparison.
  - text: |
      5. **Evidence follows the first canonical site**
         - Given multiple symbols contributing the same capability with different map evidence
         - When aggregation sorts their sites
         - Then persisted evidence is the map evidence for the first sorted site's symbol, and the map SDK key and class are present
    status: pass
    evidence: |
      The FILES aggregation test at go/internal/checker/aggregate_test.go:21-77
      asserts evidence from os.ReadFile, the first sorted site, rather than a
      later symbol. report.Finding carries Class, SDKKey, Sites, and Evidence
      at go/internal/report/report.go:54-69, and the artifact round-trip test
      at go/internal/artifactio/report_test.go:405-447 verifies the persisted
      class, SDK key, sorted sites, and evidence.
  - text: |
      6. **Boundary findings remain site-specific**
         - Given repeated undeclared dependency or interface references at distinct sites
         - When findings are produced
         - Then each distinct `(referent, site)` remains its own finding and is not merged by capability aggregation
    status: pass
    evidence: |
      TestClassify_BoundaryFindingsRemainSiteSpecific at
      go/internal/checker/classify_test.go:428-446 feeds the same undeclared
      referent at two distinct source lines and asserts two boundary
      observations. Boundary observations remain a separate classifier result
      from AggregateAuthority at checker/aggregate.go:61-119.
  - text: |
      7. **Canonical artifacts remain stable**
         - Given logically equal reports with authority sites, SDK-key fields, and evidence frames supplied in different order
         - When `artifactio.MarshalReport` is called
         - Then bytes are identical, decode round-trips all fields, and `just ci` passes
    status: pass
    evidence: |
      artifactio/report.go:197-294 sorts finding sites and extends the finding
      tie-break with class, SDK key, sites, and evidence. The round-trip and
      reordered-site test at go/internal/artifactio/report_test.go:391-449
      asserts byte identity and recovery of class, SDK key, sites, and
      first-site evidence. krppqlwzlwvu removes the unparseable checked-in
      fixture; direct gofmt -l go/ exits 0, fresh unit and targeted integration
      suites pass, and work.log records a green just ci run.

