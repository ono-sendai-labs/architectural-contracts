findings:
  - severity: important
    category: acceptance_criteria
    file: go/internal/facts/refs.go
    line: 54
    title: Source-site validation misses Windows-style path forms
    details: |
      The rework correctly fixed the prior POSIX absolute/traversal gap with
      `SourceSite.Validate` and corresponding tests. However, the implementation claims
      to require a canonical relative slash path (`refs.go:44-46`) while only rejecting a
      leading backslash and checking path elements split on `/` (`refs.go:54-60`). A
      drive-letter path such as `C:\outside.go`, or a path containing embedded backslashes,
      passes validation. On a Windows scanner or any consumer that interprets those forms
      as native paths, such a site is not component-relative. This leaves AC1 partial.
    suggested_action: |
      Enforce the chosen canonical separator policy consistently: reject backslashes
      anywhere in a slash-canonical site and reject drive-letter prefixes (or normalize
      only at the shell boundary and validate that the stored value is the normalized
      slash form). Add regression cases for `C:\outside.go`, `C:/outside.go`, and an
      embedded-backslash relative spelling.
    source: built-in

