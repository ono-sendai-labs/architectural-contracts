findings:
  - severity: important
    category: tests
    file: go/internal/goanalysis/testdata/classify/member/rows/rows.go
    line: 15
    title: "Fixture 6 still lacks required blank import rows"
    details: |
      This is the remaining portion of the prior important fixture finding. The
      rework adds the typed infra package, go/ast UNANALYZED init, and the os
      nil-entry missing-data test, and those cases now pass through the real
      scanner. However, rows.go:15-17 import infra, member/globals, and the
      top-level declared dep as ordinary named imports, while rows.go:27-31 uses
      those packages. Only dep/sub, go/ast, image/png, os, and strconv are blank
      imports. The source comments at rows.go:4-7 and
      go/internal/goanalysis/testdata/classify/infra/infra/infra.go:1-3 claim
      the infra row is blank even though the import is named. Therefore the
      seven-row fixture is still not the specified import-only blank-import table;
      the unit classifier rows cannot compensate for that missing scanner fixture
      shape. No test deletion or weakening was introduced in the rework.
    suggested_action: |
      Add separate real typed fixture files/packages (or otherwise avoid duplicate
      import-path declarations within one file) so the member, top-level declared
      dependency, and auto-attached infra cases each have a genuine blank import
      with no corresponding object use. Keep the existing named imports in a
      separate reference fixture if needed for AC6, and correct the misleading
      comments. Assert each blank import's ImportEdge site and classification in
      TestFixture6_ImportTable.
    source: built-in

