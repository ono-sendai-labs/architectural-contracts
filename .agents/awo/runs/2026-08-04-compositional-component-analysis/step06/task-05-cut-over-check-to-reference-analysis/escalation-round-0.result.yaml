escalation:
  reason: spec_defect
  details: |
    The cutover itself is implemented and committed (produced changes
    mmsqnoytkxrzouwmwnnwyzsvqklltqtz "feat(goanalysis): cut the check over to
    the typed reference analysis", 16ceb83f… "fix(bazel): mirror the bumped
    classifier hash…", mwwrmyywymqvvtnnvslpkwltsulwuvtx "docs(go): drop the
    last Step 6 transitional notes…"). The blocker is AC 8 ("Native, Bazel,
    and self-hosting integrations pass") which is unsatisfiable as written
    once the map honestly preserves UNANALYZED (I4) and the implements-closure
    laundering is gone:

    Under DR-11, an UNANALYZED map record referenced by member source is an
    AnalysisDefeating finding and a violation by default; declared_authority
    can absorb capabilities but there is no manifest- (or CLI-) expressible
    way to accept an unanalyzable construct. Four checked components now
    fail their `verdict: pass` assertions with exactly that class of
    findings inside their member closures:
      - csvtool/internal/parsecsv: `csv.Reader.ReadAll` is UNANALYZED
        (interface-parameter indirection) — 1 site.
      - internal/manifest and internal/artifactio: the transitional
        protobuf-runtime members (retained until Step 7 by design) reference
        sync.Once.Do / sync.Pool.Get / io.WriteString / unsafe.Pointer /
        sort.Slice — 90 findings.
      - internal/goanalysis: the retained x/tools members reference
        sort.Slice / unsafe.Pointer — 2 aggregated findings.
    `just selfcheck` fails on the same four components; `bazel test //...`
    fails exactly their .check tests (plus parity/hash items I fixed).

    Two principled resolutions exist and both are design decisions outside
    this task's scope:
      1. Extend the generation classifier with a recorded I2-consistent
         "capability-use indirection" curation (interface-method and
         func-parameter invocation wrappers such as (sync.Once).Do,
         (sync.Pool).Get, csv.(Reader).ReadAll are capability use; the
         indirect target's own edges are visible as member references). This
         fixes parsecsv and shrinks, but does not eliminate, the
         manifest/goanalysis findings (unsafe.Pointer and sort.Slice inside
         x/tools/protobuf member sources remain honestly UNANALYZED).
      2. Provide the sanctioned "explicit policy downgrade" DR-11 names (a
         manifest or CLI policy input) so self-hosting components can
         consciously accept the residual unanalyzable stdlib usage — likely
         the intended long-term carrier, which does not exist yet.
    Additionally the Step 7 protobuf-runtime component split (already planned)
    resolves the manifest/artifactio leg. Please decide which mechanism lands
    now; the checker's AnalysisDefeating aggregation is already
    policy-ready (Warn[""] downgrades to ANALYSIS_LIMITATION, pinned in
    aggregate_test.go).

    Also fixed while here (spec-consistent, no escalation needed): stdlib map
    generation had two soundness bugs exposed by the cutover —
    (a) a whole-stdlib single Capslock batch conflated unrelated packages'
    call graphs (go/types.init was classified NETWORK via net/http frames;
    generation now batches per importable package, RuleVersion bumped to v2,
    arcc_metadata CLASSIFIER_HASH mirrored); (b) the inventory omitted
    unexported stdlib members reachable via promotion/exports
    ((go/types.object).Name, (encoding/binary.littleEndian).*) which the
    declaring-object rule legitimately keys — they are now inventoried
    fail-closed.

