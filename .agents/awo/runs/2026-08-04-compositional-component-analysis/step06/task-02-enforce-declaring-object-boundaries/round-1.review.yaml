findings:
  - severity: important
    category: acceptance_criteria
    file: go/internal/goanalysis/refscan.go
    line: 66
    title: Nil types.Info maps still yield partial facts
    details: |
      The rework correctly rejects a nil TypesInfo pointer, Fset, or Syntax,
      but it accepts a non-nil types.Info whose Uses or Selections map is nil.
      The scanner then ranges those nil maps at go/internal/goanalysis/refscan.go:111-139
      and returns success without observing references. Likewise, a nil Imports
      map makes every written import fall through to ImportUnresolved at
      :164-174, even though the loader did not provide enough metadata to make
      that distinction. The new tests cover only the nil package-entry case
      (go/internal/goanalysis/refscan_test.go:267-289), leaving this incomplete-
      info path capable of producing a false boundary pass.
    suggested_action: |
      Treat the reference maps required by this scanner (Uses and Selections),
      and the import metadata needed for syntax imports, as required input for
      a member package. Return a deterministic incomplete-data error, or use an
      explicit missing-type-data state where the caller can classify it, rather
      than silently ranging nil maps or labeling all imports unresolved. Add
      tests with a non-nil types.Info whose Uses/Selections maps are nil and
      with missing import metadata.
    source: built-in
  - severity: important
    category: architecture
    file: go/internal/goanalysis/refscan.go
    line: 165
    title: Import resolution bypasses path canonicalization
    details: |
      The scanner looks up p.Imports using the raw source literal `path` at
      go/internal/goanalysis/refscan.go:165, but stores the emitted ImportPath
      after hostpolicy.CanonicalizePath at :175-180. The repository's coding
      convention requires every goanalysis import path to be canonicalized
      before comparison (.agents/summary/coding_style.md:197-198), and a
      non-identity host policy can therefore mark a
      loaded import ImportUnresolved when the loader map is keyed by its
      canonical spelling. This creates a wrong import fact at the host boundary
      even though the ordinary identity-policy fixture passes.
    suggested_action: |
      Canonicalize the written path once and resolve p.Imports by canonicalized
      key (or iterate the map comparing canonicalized keys), while preserving
      the nil-entry ImportMissingTypeData behavior. Add a host-policy test where
      the source spelling and loader spelling differ but canonicalize to the
      same package.
    source: built-in

