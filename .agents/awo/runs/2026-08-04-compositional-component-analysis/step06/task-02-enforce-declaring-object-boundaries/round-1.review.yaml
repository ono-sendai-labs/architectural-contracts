merge_request:
  title: "feat: enforce declaring-object boundaries [Compositional Analysis: Step 06/Task 02]"
  body: |
    Reviews the complete four-change series: the initial typed reference scanner,
    exact SymbolID dependency extraction, and atomic implements-closure deletion;
    the pure boundary classifier; the design fixtures; and the round-1 rework.
    The rework makes overlap diagnostics order-independent and adds fail-closed
    handling for nil member type/syntax data and nil import-package entries.

summary: |
  The round-1 rework resolves both prior important findings: multi-collision
  overlap errors are now deterministic, and nil member package data no longer
  yields a successful partial scan. Focused checker, scanner, and fixture tests
  pass, but two remaining scanner issues keep the review at changes_requested:
  nil maps inside a non-nil types.Info still silently suppress facts, and import
  resolution compares an uncanonicalized source path against the loader map.
  The full integration suite remains cache-limited in this environment by
  read-only/missing Go build-cache entries; the recorded work log reports green
  full validation.

