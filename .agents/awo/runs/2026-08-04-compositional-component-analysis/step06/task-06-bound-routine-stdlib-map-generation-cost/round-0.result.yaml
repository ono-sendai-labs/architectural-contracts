      The design Appendix B and routine topology, implementation plan Step 6 guidance, and research note section 8 document per-package isolation, the 10,399-versus-8,182 whole-batch unsoundness, measured costs, routine/full split, and deferred architecture matrix. Evidence is in .agents/planning/2026-08-04-compositional-component-analysis/design/detailed-design.md:917-923, implementation/plan.md:166-180, and research/2026-09-08-stdlib-map-generation-cost.md:374-393.
