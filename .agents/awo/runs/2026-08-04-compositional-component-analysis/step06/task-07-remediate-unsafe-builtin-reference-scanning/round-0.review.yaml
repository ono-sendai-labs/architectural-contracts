      pinned-map checks report 102 AnalysisDefeating sites for artifactio and
      manifest, while justfile:84-95 and the matching BUILD comments at
      go/internal/artifactio/BUILD.bazel:66 and
      go/internal/manifest/BUILD.bazel:65 still say 89. The current goanalysis
      check reports 88 while justfile:101 and
      go/internal/goanalysis/BUILD.bazel:39 still say 86; capslockadapter reports
      1077 while justfile:109 still says 1042. The five exemption markers and
      TODO owners did not grow or loosen, but the stale evidence means this
      non-behavioral acceptance criterion is only partial.
    suggested_action: |
      Re-run the current pinned-map checks for each existing exempted component,
      enumerate the exact current sites, and update the justfile and matching
      BUILD evidence comments/counts only. Preserve exactly the existing five
      exemption markers, their Step 7 owners, and their manual check tags; do not
      add or broaden an exemption.
