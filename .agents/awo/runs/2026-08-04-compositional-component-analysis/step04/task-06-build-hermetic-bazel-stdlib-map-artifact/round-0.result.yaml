acceptance_criteria:
  - text: "The Bazel artifact is hermetic (generation succeeds using only the declared SDK sources, package list, configuration file and generator)"
    addressed: yes
    evidence: |
      The action declares exactly those inputs (bazel_rules/go/private/stdlib_map.bzl:117-137)
      with an empty environment, no toolchain binary and block-network. The execution test
      (bazel_rules/go/tests/stdlib_map_keys_test.sh) inspects maps generated by real
      linux-sandbox actions (default, replica, tagged, darwin/arm64: 383 packages, 190
      importable each); `arcc stdlibmap inspect` validates every artifact. work.log records
      the generation logs.
  - text: "Action inputs are complete and minimal (SDK sources, package list, config file and generator declared; no toolchain go or tool binary, cache path, home path, dependency-component source or unrelated workspace file; action blocks network access)"
    addressed: yes
    evidence: |
      Analysis tests //bazel_rules/go/tests:action_inputs_are_complete_and_minimal_test and
      :action_executes_no_toolchain_binary_test (bazel_rules/go/tests/stdlib_map_tests.bzl:44-100)
      assert completeness (fmt/format.go, packages.txt, config file) and the absence of
      bin/go, pkg/tool/, caches, homes, go/ dependency sources, examples/ and bazel_rules/
      paths. block-network is set in stdlib_map.bzl:132 and verified by inspection — Bazel
      9's Starlark Action API exposes only `env`, so execution_requirements are not readable
      in analysis; the empty-env assertion (stdlib_map_tests.bzl:134-146) pins the
      no-environment contract.
  - text: "Target configurations produce distinct keyed artifacts, and cgo is rejected"
    addressed: yes
    evidence: |
      Analysis tests: cross_compile_propagates_to_the_key_test (darwin/arm64),
      build_tag_propagates_to_the_key_test (arcc_probe_tag),
      cgo_enabled_configuration_fails_analysis_test (expect_failure via allow_analysis_failures;
      message contains "stdlib map arcc_stdlib_map" and "--@rules_go//go/config:pure").
      Execution test: each map accepts its own key and rejects the others' (platform, tag,
      cgo); three configurations yield three distinct digests.
  - text: "The map remains total and semantically pinned"
    addressed: yes
    evidence: |
      The execution test drives the task 01 reader through `arcc stdlibmap inspect`
      (DecodeMapArtifact validates the artifact); representative classifications match the
      design: os.ReadFile FILES, strings.TrimSpace SAFE, sort.Slice UNANALYZED, os.Stdin
      FILES/OPERATING_SYSTEM/MODIFY_SYSTEM_STATE, io.EOF SAFE, net/http.DefaultClient
      NETWORK, unsafe.Pointer UNANALYZED; net/http carries an init record; darwin map
      populated. Totality at generation is task 05's reconciled oracle, validated by its
      own tests and by generation succeeding here.
  - text: "The public rule and future analysis seam are stable"
    addressed: yes
    evidence: |
      defs.bzl:56-95 exports arcc_stdlib_map as a macro with an empty attrs dict
      (non-configurable); provider/default availability and the private default seam are
      pinned by provider_and_default_availability_test and default_seam_is_available_test
      via the default_seam_probe rule (stdlib_map_probe.bzl), which consumes
      stdlib_map_default_attr() exactly as Step 5 will attach _stdlib_map. No analysis
      action exists; check execution is unchanged (just ci green).
  - text: "Repeated Bazel builds are deterministic"
    addressed: yes
    evidence: |
      The execution test compares //:arcc_stdlib_map and //:arcc_stdlib_map_replica
      (identical inputs): byte-identical digests. The test's comment explains why the
      comparison cannot be satisfied by action-cache reuse: the two targets declare
      different output paths, which enter Bazel's action key, so both actions executed.
  - text: "Integration remains green (just ci: Go and Bazel tests, generation cleanness, self-check and existing component checks all pass; wildcard builds attempt no cgo-enabled map)"
    addressed: yes
    evidence: |
      `just ci` exit 0 (Go tests, Bazel test //... with 96 tests passing, generation
      cleanness, self-check). No cgo-enabled map target exists (the analysis-time
      rejection removes the need for a manual-tagged one), so wildcard build //... and
      test //... attempt no cgo map; both verified green in work.log.

