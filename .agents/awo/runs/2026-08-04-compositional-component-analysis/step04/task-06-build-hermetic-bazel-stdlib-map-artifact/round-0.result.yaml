  Implemented the superseded-approach replacement: arcc_stdlib_map now runs task 05's
  explicit-input generation as one ordinary hermetic action with no launcher, no
  toolchain binary and an empty environment (the generator loads the SDK through the
  layout driver), per design Appendix C. The adapter seam exposes only toolchain
  material (no go/tools binaries); the cgo-enabled configuration is rejected at
  analysis time via config_settings on the rules_testing test. Work landed as three
  incremental commits (rule+analysis tests; execution test; BUILD-restore fix); final
  produced change at @- is zkpsstlvssvqtrtqrvxkkxsyrmqwptmo. One deviation from the
  task's letter: Bazel 9's Starlark Action API does not expose
  execution_requirements/use_default_shell_env, so the block-network requirement is
  verified by rule-source inspection plus the observable empty-env assertion rather
  than a direct analysis assertion.
