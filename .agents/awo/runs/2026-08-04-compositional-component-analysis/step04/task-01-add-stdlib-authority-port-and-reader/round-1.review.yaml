acceptance_criteria:
  - text: |
      1. **Package membership comes only from the map**
         - Given importable and non-importable package inventory entries
         - When `IsStdlibPackage` is queried
         - Then it returns true for both enumerated packages and false for an absent path without applying a path heuristic.
    status: pass
    evidence: |
      `go/internal/artifactio/stdlibmapreader_test.go:29-48` checks true for
      importable `os` and non-importable `internal/secret`, and false for
      absent paths. The implementation is the direct package-map lookup at
      `go/internal/artifactio/stdlibmapreader.go:137-141`.
  - text: |
      2. **Symbol and init lookup are total and fail closed**
         - Given an enumerated importable package with validated symbol and init records
         - When known keys are queried
         - Then their exact terminal classifications are returned; querying an absent symbol or init returns an actionable inventory-gap error and never `SAFE`.
    status: pass
    evidence: |
      Known SAFE, CAPABILITIES, and UNANALYZED symbols plus SAFE and
      CAPABILITIES inits are exercised at
      `go/internal/artifactio/stdlibmapreader_test.go:50-97`; absent symbols
      and an absent init check typed inventory-gap errors and invalid (never
      SAFE) classifications at `:98-133` and `:321-334`. The implementation
      returns `Classification{}` with `InventoryGapError` at
      `go/internal/artifactio/stdlibmapreader.go:146-162`. The prior partial
      criterion is addressed by the new classification assertions in
      `vpvlvzusowqrqvmzutpuvzqtnwnxxxxw`.
  - text: |
      3. **Terminal states cannot be ambiguous**
         - Given `SAFE`, capability-bearing, and `UNANALYZED` records plus malformed in-memory combinations
         - When the adapter is constructed
         - Then each valid record maps to exactly one core state and every empty, overlapping, unknown, or otherwise invalid state is rejected.
    status: pass
    evidence: |
      `Classification.Validate` rejects empty/overlapping states and now also
      rejects unsorted or duplicate capability slices at
      `go/internal/stdlibauthority/stdlibauthority.go:67-97`. The adapter
      canonicalizes cloned capability lists at
      `go/internal/artifactio/stdlibmapreader.go:107-124`, while its constructor
      validation rejects invalid enum values, duplicate records, empty lists,
      and unknown capabilities. These cases are covered at
      `go/internal/stdlibauthority/stdlibauthority_test.go:14-44` and
      `go/internal/artifactio/stdlibmapreader_test.go:136-158` and `:212-269`.
      This explicitly resolves the prior partial AC3 in the round-1 change.
  - text: |
      4. **Evidence and SDK identity are stable**
         - Given capability evidence and a complete persisted SDK key
         - When they are read through the port
         - Then frame order and every target-configuration field are preserved, returned collections cannot mutate adapter state, and a required-key mismatch fails closed.
    status: pass
    evidence: |
      Evidence order and capability/evidence defensive copies are tested at
      `go/internal/artifactio/stdlibmapreader_test.go:177-210`. SDK-key field
      conversion and sorted build tags are implemented at
      `go/internal/artifactio/stdlibmapreader.go:82-99`; mismatched fields and
      matching keys are checked at `:271-318`, and the new key-slice defensive
      copy test is at `:160-175`. `Key` clones `BuildTags` at `:175-182`,
      resolving the prior partial AC4.
  - text: |
      5. **Architectural boundaries remain clean**
         - Given the new port and adapter packages
         - When dependency and self-component checks run
         - Then the core port has no protobuf/Capslock dependency, the shell adapter owns decoding, and each new package carries the FR10 Component Contract including Ambient Authority.
    status: pass
    evidence: |
      The core package imports only standard library packages plus the pure
      `symbol` vocabulary at `go/internal/stdlibauthority/stdlibauthority.go:27-34`
      and carries its FR10/Ambient Authority block at `:8-25`. The adapter's
      `OpenStdlibMap` delegates decoding to `DecodeMap` at
      `go/internal/artifactio/stdlibmapreader.go:72-79`, with a compile-time
      port assertion at `:16-18`. Component dependency declarations are in
      `go/internal/stdlibauthority/component.textproto:1-7` and
      `go/internal/artifactio/component.textproto:8-20`; the recorded self-check
      passed in `work.log:538-602`.
  - text: |
      6. **Integration remains green**
         - Given the additive lookup implementation
         - When `just ci` runs
         - Then all generation, lint, unit, Bazel, and self-check gates pass and the existing check path is unchanged.
    status: pass
    evidence: |
      The round-1 change adds `stdlibmapreader.go` to the artifactio library
      and `stdlibmapreader_test.go` to its test at
      `go/internal/artifactio/BUILD.bazel:6-13` and `:34-41`. The final
      `just ci` evidence records native generation/lint/build/tests at
