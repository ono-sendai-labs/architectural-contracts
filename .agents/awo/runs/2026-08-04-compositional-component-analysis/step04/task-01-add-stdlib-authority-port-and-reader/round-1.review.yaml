    title: Self-check comment calls artifactio pure
    details: |
      The round-1 edit correctly adds `stdlibauthority` and `artifactio` to
      the self-check list at `justfile:39-40`, but the preceding description
      still says the list contains "pure components." `artifactio` is the
      shell-side component and declares FILES, MODIFY_SYSTEM_STATE,
      READ_SYSTEM_STATE, REFLECT, RUNTIME, SYSTEM_CALLS, and UNSAFE_POINTER in
      `go/internal/artifactio/component.textproto:51-57`. The list is complete,
      but the classification is inaccurate and could mislead future boundary
      changes.
    suggested_action: |
      Change the wording to "components checked here" or separate the pure
      stdlibauthority entry from the shell-side artifactio entry while retaining
      the native-only explanation for capslockadapter and cli.
