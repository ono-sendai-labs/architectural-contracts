summary: |
  All four prior important findings and all four prior non-pass acceptance
  criteria are resolved in the round-1 remediation: Bazel now includes the
  reader and tests, capability sets are validated/canonicalized, Key returns a
  defensive tag copy, and gap tests inspect returned classifications. The
