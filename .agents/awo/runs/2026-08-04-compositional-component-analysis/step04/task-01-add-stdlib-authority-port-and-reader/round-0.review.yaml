merge_request:
  title: "feat(stdlib): add authority port and artifact reader [Compositional Analysis: Step 04/Task 01]"
  body: |
    Reviews the complete ordered series: the inherited empty change
    yxwmlwuzvzswwmlsusssvpuppnyrnuwr, the core stdlibauthority port in
    mxonzqspulksvvystzpxxutrwlqsmpnl, the artifactio reader and wiring in
    nzopxkpytqxxnmqmkzvvzsszvozpzrnu, and the reader-header documentation change
    vupmvxwkrpuwxouzkwtsztoyzmsqsqop. The series adds the port, immutable native
    reader, component wiring, and table-driven tests; review findings cover
    Bazel source coverage, terminal-set validation, key immutability, and a
    missing fail-closed assertion.

summary: |
  The core port and native artifact reader cover membership, terminal lookups,
  evidence ordering, SDK-key comparison, and the required component boundaries,
  with RED-to-GREEN evidence and a recorded green `just ci` run. Four important
  issues remain: Bazel omits both new artifactio source/test files, capability
  sets are not enforced or canonicalized as sorted duplicate-free sets, Key
  exposes mutable build-tag storage, and gap tests discard the returned
  classification. LSP diagnostics were unavailable in this harness.

acceptance_criteria:
  - text: |
      1. **Package membership comes only from the map**
         - Given importable and non-importable package inventory entries
         - When `IsStdlibPackage` is queried
         - Then it returns true for both enumerated packages and false for an absent path without applying a path heuristic.
    status: pass
    evidence: |
      `go/internal/artifactio/stdlibmapreader_test.go:29-48` checks true for
      `os` and non-importable `internal/secret`, and false for absent paths.
      The implementation is the direct map lookup at
      `go/internal/artifactio/stdlibmapreader.go:132-135`.
  - text: |
      2. **Symbol and init lookup are total and fail closed**
         - Given an enumerated importable package with validated symbol and init records
         - When known keys are queried
         - Then their exact terminal classifications are returned; querying an absent symbol or init returns an actionable inventory-gap error and never `SAFE`.
    status: partial
    evidence: |
      Known SAFE, CAPABILITIES, and UNANALYZED symbols plus SAFE and
      CAPABILITIES inits are exercised at
      `go/internal/artifactio/stdlibmapreader_test.go:53-97`; typed gap errors
      for absent symbols and an absent init are checked at `:98-130`. The
      implementation returns a zero classification with the typed error at
      `go/internal/artifactio/stdlibmapreader.go:141-156`, but
      `mustSymErr` at `go/internal/artifactio/stdlibmapreader_test.go:277-281`
      discards the classification, so the criterion's explicit never-SAFE
      property is not asserted.
  - text: |
      3. **Terminal states cannot be ambiguous**
         - Given `SAFE`, capability-bearing, and `UNANALYZED` records plus malformed in-memory combinations
         - When the adapter is constructed
         - Then each valid record maps to exactly one core state and every empty, overlapping, unknown, or otherwise invalid state is rejected.
    status: partial
    evidence: |
      `Classification.Validate` rejects empty and overlapping flag states at
      `go/internal/stdlibauthority/stdlibauthority.go:67-88`, and the adapter
      tests reject malformed protobuf states and duplicate records at
      `go/internal/artifactio/stdlibmapreader_test.go:168-224`. However,
      `Validate` accepts unsorted or duplicate capability slices, while
      `classificationFromProto` preserves their order at
      `go/internal/artifactio/stdlibmapreader.go:102-119`; the reader's
      validation path does not enforce the required sorted capability set.
  - text: |
      4. **Evidence and SDK identity are stable**
         - Given capability evidence and a complete persisted SDK key
         - When they are read through the port
         - Then frame order and every target-configuration field are preserved, returned collections cannot mutate adapter state, and a required-key mismatch fails closed.
    status: partial
    evidence: |
      Evidence order and defensive copies are tested at
      `go/internal/artifactio/stdlibmapreader_test.go:133-166`; SDK-key field
      mapping and sorted tags are implemented at
      `go/internal/artifactio/stdlibmapreader.go:82-99`, and mismatch fields
      are checked at `:227-274`. The `Key` method returns `r.key` directly at
      `go/internal/artifactio/stdlibmapreader.go:170-173`, exposing its
      `BuildTags` backing slice to mutation, which violates the adapter's
      immutable-state contract.
  - text: |
      5. **Architectural boundaries remain clean**
         - Given the new port and adapter packages
         - When dependency and self-component checks run
         - Then the core port has no protobuf/Capslock dependency, the shell adapter owns decoding, and each new package carries the FR10 Component Contract including Ambient Authority.
    status: pass
    evidence: |
      The core package imports only standard library packages plus the pure
      `symbol` vocabulary at `go/internal/stdlibauthority/stdlibauthority.go:27-34`
      and carries its FR10/Ambient Authority block at `:8-25`. The adapter's
      `OpenStdlibMap` delegates decoding to `DecodeMap` at
      `go/internal/artifactio/stdlibmapreader.go:72-79`, with a compile-time
      port assertion at `:16-18`. Component dependency declarations are in
      `go/internal/stdlibauthority/component.textproto:1-7` and
      `go/internal/artifactio/component.textproto:8-20`; the recorded self-check
      passed in `work.log:27-31` and `:327-344`.
  - text: |
      6. **Integration remains green**
         - Given the additive lookup implementation
         - When `just ci` runs
         - Then all generation, lint, unit, Bazel, and self-check gates pass and the existing check path is unchanged.
    status: partial
    evidence: |
      `work.log:369-392` records the final native validation and
      `work.log:327-352` records the Bazel and auxiliary checks as passing.
      Nevertheless, `go/internal/artifactio/BUILD.bazel:6-12` omits the new
      `stdlibmapreader.go` from the library and `:33-39` omits
      `stdlibmapreader_test.go` from the test, so the Bazel gates do not build
      or exercise the new artifact-backed reader.

findings:
  - severity: important
    category: tests
    file: go/internal/artifactio/BUILD.bazel
    line: 6
    title: Bazel omits the new reader and its test
    details: |
      The complete change adds `stdlibmapreader.go` and
      `stdlibmapreader_test.go`, but the explicit `go_library.srcs` list at
      `go/internal/artifactio/BUILD.bazel:6-12` contains neither the production
      file nor the `go_test.srcs` list at `:33-39` contains the test. The native
      Go run therefore does not demonstrate that the Bazel artifactio target
      builds the adapter, and the recorded Bazel `artifactio_test` pass cannot
      exercise the new reader tests.
    suggested_action: |
      Add `stdlibmapreader.go` to the artifactio library `srcs` and
      `stdlibmapreader_test.go` to the artifactio test `srcs`, then rerun the
      artifactio Bazel targets and the full CI gate.
    source: built-in
  - severity: important
    category: acceptance_criteria
    file: go/internal/artifactio/stdlibmapreader.go
    line: 112
    title: Reader does not enforce sorted capability sets
    details: |
      The task requires a capability-bearing terminal state to be a sorted,
      non-empty set. `classificationFromProto` only clones the persisted slice
      at `go/internal/artifactio/stdlibmapreader.go:107-113`; it neither sorts
      nor rejects an unsorted list. `NewStdlibMapReader` calls `validateMap`,
      whose capability validation rejects empties, duplicates, and unknown
      names but does not enforce ordering (`go/internal/artifactio/stdlibmap.go:283-305`).
      Likewise, the core `Classification.Validate` at
      `go/internal/stdlibauthority/stdlibauthority.go:71-88` accepts both
      duplicate and unsorted capability slices. A valid in-memory map with
      `READ_SYSTEM_STATE, FILES` is therefore indexed and returned in
      non-canonical order.
    suggested_action: |
      Enforce the core terminal invariant for strictly sorted, duplicate-free
      capability slices and make the reader either reject malformed ordering or
      index a canonical clone. Add tests for unsorted and duplicate capability
      lists through both `Classification.Validate` and `NewStdlibMapReader`.
    source: built-in
  - severity: important
    category: acceptance_criteria
    file: go/internal/artifactio/stdlibmapreader.go
    line: 171
    title: Key exposes mutable build-tag storage
    details: |
      `Key()` returns the reader's `SDKKey` struct by value, but its
      `BuildTags` slice is still backed by `r.key.BuildTags` at
      `go/internal/artifactio/stdlibmapreader.go:170-173`. A caller can mutate
      `reader.Key().BuildTags[0]` and change subsequent key observations,
      contradicting the constructor's documented immutable indexes and the
      acceptance criterion that returned collections cannot mutate adapter
      state. The current defensive-copy tests cover capability and evidence
      slices but not this key slice.
    suggested_action: |
      Clone `r.key.BuildTags` before returning the key (or provide an equivalent
      immutable key value) and add a test that mutates a returned key's tags and
      verifies a subsequent `Key()` call is unchanged.
    source: built-in
  - severity: important
    category: tests
    file: go/internal/artifactio/stdlibmapreader_test.go
    line: 277
    title: Gap tests discard the returned classification
    details: |
      The `mustSymErr` helper at `go/internal/artifactio/stdlibmapreader_test.go:277-281`
      returns only the error, and the absent-init case at `:121-130` similarly
      ignores the classification. Thus an implementation that returned
      `Classification{Safe: true}` alongside `ErrInventoryGap` would pass these
      tests even though AC2 explicitly requires that an absent record never be
      `SAFE`. The current implementation happens to return the zero
      classification at `go/internal/artifactio/stdlibmapreader.go:146`.
    suggested_action: |
      Capture both return values for each missing symbol and init, assert the
      typed/sentinel error, and assert the returned classification is not SAFE
      (preferably the invalid zero value documented for an inventory gap).
    source: built-in
  - severity: suggestion
    category: style
    file: go/internal/stdlibauthority/stdlibauthority_test.go
    line: 1
    title: Core API test uses an unnecessary white-box package
    details: |
      `stdlibauthority_test.go` declares `package stdlibauthority` even though
      its tests use only exported API. The repository's convention in
      `coding_style.md` is black-box tests by default, reserving same-package
      tests for unexported seams.
    suggested_action: |
      Change the test package to `stdlibauthority_test` and import the core
      package explicitly; retain same-package tests only if an unexported seam
      is intentionally required.
    source: built-in
  - severity: suggestion
    category: style
    file: justfile
    line: 36
    title: Self-check comment omits newly checked components
    details: |
      The self-check recipe now includes `stdlibauthority` and `artifactio` at
      `justfile:62-63`, but the explanatory component list at `:36-47` still
      names only the older seven pure components and describes only
      capslockadapter and cli as the other components. The comment is now
      misleading about the scope of the two self-check legs.
    suggested_action: |
      Update the self-check relationship comment to include the new
      stdlibauthority and artifactio checks and keep the native-only explanation
      aligned with the actual recipe.
    source: built-in

