    details: |
      The entries labeled GREEN at work.log:35-46 show only `cd go` failures,
      and the new fingerprint/cache tests have no successful command output in
      the TDD portion of the log. The later full test and CI evidence is useful,
      but the progress record currently overstates the RED-to-GREEN evidence.
    suggested_action: |
      Record the successful commands and their relevant output under the GREEN
      entries, or correct the working directory and rerun the focused tests so
      the TDD record distinguishes failed setup from passing tests.
    source: built-in

