notes: >
  Implemented the stdlibmap generation shell in seven incremental jj changes:
  the package oracle (native `go list std` and explicit Bazel list behind an
  injectable seam with deterministic normalization), the go/types inventory
  oracle (declaring-object rule, alias expansion, generic origins, aggregate
  inits, unsafe builtins, collision detection, fail-closed on load/type
  errors), SDK-key derivation over a hashable classifier descriptor, and a
  full-SDK integration test. Two `just ci` failures were fixed by making the
  fixture hermetic (no stdlib imports; importer.Default cannot resolve them in
  a Bazel sandbox) and by gating native toolchain seams behind the
  integration tag. symbol's declared interface files were widened to include
  the FromObject/FromSelection/ExtractSurface constructors its FR10 contract
  already documents. Capslock normalization-context error handling is consumed
  (not reimplemented) here and is exercised by Task 3's reconciliation.
