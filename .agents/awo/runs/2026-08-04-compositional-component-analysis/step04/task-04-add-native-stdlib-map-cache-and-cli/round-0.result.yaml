notes: >
  Implemented the native SDK-keyed cache (CacheKeyDigest over the complete SDKKey,
  arcc-subtree layout, injectable CacheSeams, validate-on-read via
  artifactio.OpenStdlibMap, regenerate-on-corruption, atomic replacement) and the
  two CLI subcommands with the exit-code contract. Two mid-flight corrections:
  the derive-generation-key cross-check was replaced by post-generation key
  validation, and the cli→artifactio dependency hit the design's documented
  native-resolution limitation for foreign-member PACKAGE_SURFACE components, so
  stdlibmap switched to declared-interface style and re-exports the artifact
  write/decode seam. Full just ci gate is green across two described jj changes.
