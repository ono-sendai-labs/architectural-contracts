  title: "feat(stdlibmap): add native cache and CLI [Stdlib Map: Step 04/Task 04]"
  body: |
    Reviews the complete ordered series: the initial SDK-keyed cache in
    skyvmpyupztlypwurymlropppktwlzrr, the generate/inspect CLI and wiring in
    zmkvtsmxmopnsqwznlmqpuytrvktpwut, and the round-1 remediation in
