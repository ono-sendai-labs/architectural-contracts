notes: >
  Rework round 3. The remaining important security finding is closed: both the
  inspect path (streams *os.File directly into the bounded
  stdlibmap.DecodeMapArtifact) and the cache's default read seam (io.LimitReader
  capped at artifactio.MaxMapBytes+1) now enforce the decoder's 64 MiB bound
  before validation, so a user-supplied path or a locally writable cache entry
  can no longer cause unbounded allocation; oversized content fails the bound
  and is treated as a corrupt miss that regenerates. Pinned by
  TestOversizedCacheEntryIsAMissAndRegenerated and an oversized-artifact usage
  test. Fresh child jj change ddae418f; prior changes untouched; full just ci
  gate green.
