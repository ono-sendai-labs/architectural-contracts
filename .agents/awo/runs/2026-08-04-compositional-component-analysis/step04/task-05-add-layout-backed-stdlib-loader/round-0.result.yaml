acceptance_criteria:
  - text: "The layout describes the pinned target, not the running binary"
    addressed: yes
    evidence: |
      Platform gained toolchain_version/goexperiment (packagelayout.go);
      BuildContextForLayout derives ReleaseTags from the version and
      ToolTags from the baseline+override experiments and target-arch
      defaults; HandleDriverRequest reports the platform GOARCH. Tests:
      TestPlatformToolchainVersionDerivesReleaseTags,
      TestPlatformGoexperimentDerivesToolTags, TestDriverArchReportsPlatformGOARCH,
      TestPlatformFidelityThroughFixtureFiles (go1.27 file excluded,
      experiment file included, amd64-suffix file excluded on arm64,
      packagelayout_test.go:2660+); layout-without-platform unchanged
      (TestBuildContextForLayout, existing suite green).
  - text: "The whole-stdlib layout matches the native oracle"
    addressed: yes
    evidence: |
      TestStdlibLayoutMatchesGoListStd (packagelayout_integration_test.go,
      -tags=integration) compares StdlibLayout against `go list -json std`:
      identical package sets (360 packages) and per-package GoFiles equality;
      passes.
  - text: "Explicit-input generation executes no toolchain binary"
    addressed: yes
    evidence: |
      TestExplicitGenerateHermeticAndByteIdentical
      (stdlibmap_explicit_integration_test.go): arcc stdlibmap generate in
      explicit mode with PATH=empty, GOROOT/GOCACHE/GOPACKAGESDRIVER unset
      succeeds; the map's key matches the config file (inspect
      --expect-key) and classifications are terminal. Unit-level:
      TestLayoutLoaderLoadsThroughDriver and
      TestGenerateViaLayoutRunsUnderDriver run the same way (empty PATH).
  - text: "Explicit and native generation agree"
    addressed: yes
    evidence: |
      Same integration test asserts the explicit map is byte-identical to
      the native map generated from `go list std` over the same SDK root and
      configuration; passes.
  - text: "The oracle cross-check is total"
    addressed: yes
    evidence: |
      TestReconcilePackageList (explicit_test.go): listed-and-discovered
      enumeration under the internal rule, build-excluded directory →
      importable:false, listed package with no directory → error naming it,
      omitted discovered package → error naming it.
  - text: "Explicit mode fails closed on its inputs"
    addressed: yes
    evidence: |
      TestStdlibmapGenerateExplicitUsage (stdlibmap_test.go): partial flag
      set, duplicate --sdk-root, each native flag alongside the explicit
      trio, malformed cgo_enabled, and cgo_enabled=true (error names the
      design's out-of-scope decision) all exit 2 with the expected
      diagnostics, under an emptied PATH so no host discovery can occur.
  - text: "`--expect-key tag=<v>` verifies the build tags"
    addressed: yes
    evidence: |
      TestInspectExpectKeyTag (stdlibmap_test.go) uses a map keyed with build
      tag probe: --expect-key=tag=other exits 2 naming build_tags, tag=probe
      exits 0; the test failed on the pre-fix code (tag=other exited 0).
  - text: "Integration remains green"
    addressed: yes
    evidence: |
      `just ci` run after the final commit: Go lint/build/test/
      test-integration, self-check, bazel build //..., bazel test //...
      (84 tests pass), and the two Bazel shell validation scripts all green.

