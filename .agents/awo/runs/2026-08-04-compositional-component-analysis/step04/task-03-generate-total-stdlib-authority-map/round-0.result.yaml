    evidence: |
      TestGenerationClassifierPreservesUnanalyzed (capslockadapter/generation_integration_test.go):
      NewGenerationClassifier returns UNANALYZED for io.ReadAll while the
      check-time buildClassifier returns "" (excluded). End-to-end:
      TestGenerateFullStdlibMap pins sort.Slice → UNANALYZED (the spike's
      laundering case); normalizeCapability (stdlibmap/generate.go) treats the
      UNANALYZED control name as terminal.
  - text: |
      3. **Aggregate init is classified once**
      - Given a fixture package with multiple source-level init functions reaching different capabilities
      - When generation runs
      - Then one `pkg.init` record contains their terminal union and evidence, while no `init#N` record is emitted.
    addressed: yes
    evidence: |
      TestBuildAuthorityMapClassifiesAggregateInit (stdlibmap/generate_test.go):
      aggregate root findings produce one CAPABILITIES init record,
      init#1 findings are dropped, zero-finding inits are explicit SAFE, and
      no .init#/.init ID leaks into the symbol inventory; init totality
      re-verified over the full stdlib in TestGenerateFullStdlibMap.
  - text: |
      4. **Variable and minting rules are explicit**
      - Given pre-minted handle, network client, interface-typed, and methodless variables
      - When they are classified
      - Then method authority and moved minting authority are combined as designed, without treating every handle use as ambient authority.
    addressed: yes
    evidence: |
      classifyVar (stdlibmap/generate.go) unions the dereferenced static
      type's exported method classifications plus MintingAuthority
