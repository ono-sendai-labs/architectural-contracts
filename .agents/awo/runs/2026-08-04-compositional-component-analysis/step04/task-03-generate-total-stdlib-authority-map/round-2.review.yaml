findings:
  - severity: important
    category: acceptance_criteria
    file: go/internal/stdlibmap/generate.go
    line: 325
    title: Generic analyzer roots are normalized instead of discarded
    details: |
      normalizeRoot invokes symbol.ParseCapslockFunction at
      go/internal/stdlibmap/generate.go:325-327 before checking the bracketed
      instantiation drop rule at :335-336. The structured Capslock parser
      intentionally strips a valid trailing type-argument group and returns the
      generic origin (go/internal/symbol/capslock.go:179-220), so a finding such
      as `example.com/genpkg.Load[int]` is merged into `Load` instead of being
      discarded as required by technical requirement 3. This can attach an
      instantiation's evidence/capability to the persisted origin and the
      current tests do not exercise the required drop behavior.
    suggested_action: |
      Detect and validate a bracketed instantiation before the successful
      structured normalization path, returning dropInstantiation for valid
      generic roots. Malformed bracketed exported roots should fail closed
      rather than being silently dropped. Add a regression showing that a
      capability-bearing generic root does not classify its uninstantiated
      inventory symbol.
    source: built-in

