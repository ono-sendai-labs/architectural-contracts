merge_request:
  title: "review(stdlibmap): review total authority map generation [Compositional Analysis: Step 04/Task 03]"
  body: |
    Reviews the complete ordered series: the generation classifier and batched
    Capslock runner; receiver-spelling correction; total map generation;
    fail-closed root and promoted-wrapper handling; real-SDK integration;
    Bazel wiring; evidence-frame normalization; round-1 target, provenance,
    method-set, init-evidence, and evidence-frame rework; and round-2 fixes
    for value-receiver spellings, persisted init provenance, import grouping,
    and promoted-variable coverage.

summary: |
  Round 2 resolves both prior important findings: value-receiver curated spellings now use the canonical receiver form, and curated aggregate-init provenance is persisted and validated; the prior test-quality suggestions are also addressed. Go unit/integration tests, go vet, and gofmt pass, and the recorded CI gate remains green, with no tests deleted or weakened. One new important gap remains: generic-instantiated analyzer roots are normalized to their origin before the generator's instantiation-drop rule, contrary to the task's required root normalization.

