      classifier hash is unchanged at
      `go/internal/teststdlibmap/testdata/linux_amd64.stdlib-map.json:7`, and
      the green strict report contains neither AnalysisDefeating nor
      UNDECLARED_DEPENDENCY findings.
  - text: |
      **Native and Bazel declarations remain coherent**
        - Given every changed component boundary
        - When manifest parity, ownership tests, native checks, and applicable Bazel checks run
        - Then they agree on members, interface, dependencies, and singular ownership
    status: pass
    evidence: |
      The mirrored package-surface declaration is present in
