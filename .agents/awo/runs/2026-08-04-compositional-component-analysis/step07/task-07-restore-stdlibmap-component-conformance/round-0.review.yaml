  title: "fix(components): restore stdlibmap conformance [Compositional Analysis: Step 07/Task 07]"
  body: |
    Reviews the ordered task series from wolppxuuspkopzkznvklmzxlmnnlvwss
    through lznwqlzzokrtorltxzylskrntupxwvlq. The initial change replaces the
    analysis-defeating cache references with bounded/manual helpers and adds
    focused behavioral coverage; the follow-up establishes the singular
    packagelayout package-surface boundary, updates native/Bazel declarations and
    selfcheck staging, and adds ownership/acyclicity regression coverage.

summary: |
  All four acceptance criteria are satisfied across the two ordered jj changes.
  The strict native stdlibmap report is passing with no WARN policy, the cache
  sites no longer produce AnalysisDefeating findings, and packagelayout has one
  explicit package-surface owner consumed by both shell components. Focused tests,
  the selfcheck gate, gofmt/vet, and just ci all pass; no test weakening or
  security issue was found. LSP diagnostics were unavailable in this harness.

acceptance_criteria:
  - text: |
      **stdlibmap passes under strict policy**
        - Given `go/internal/stdlibmap/component.textproto` and the pinned Linux/amd64 stdlib map
        - When the real native `arcc check` command runs without `--report-verdict-only`
        - Then it exits zero with no violations and without adding an AnalysisDefeating WARN policy
    status: pass
    evidence: |
      The real native command and passing output are recorded in the work log at
      `.agents/scratchpad/2026-08-04-compositional-component-analysis/step07/task-07-restore-stdlibmap-component-conformance/work.log:219-232`.
      The retained green report has `verdict: "pass"` and null violations at
      `/tmp/arcc-stdlibmap-f2-green.qtQ0ke/stdlibmap.component.report.json:1-75`.
      `go/internal/stdlibmap/component.textproto:1-64` contains no
      `analysis_defeating_policy: WARN`, and `justfile:102-103,128` makes the
      staged stdlibmap verdict part of the native gate.
  - text: |
      **packagelayout has one explicit owner**
        - Given every production component manifest and `go_component` declaration
        - When project-package ownership and dependency edges are indexed
        - Then `go/internal/packagelayout` has exactly one owner, both `goanalysis` and `stdlibmap` reach it through valid component semantics, and the component graph is acyclic
    status: pass
    evidence: |
      `go/internal/manifestparity/ownership_test.go:399-475` asserts the sole
      owner, package-surface shape, exact consumer edges, production imports, and
      an acyclic checked-in dependency graph. The owner is declared in
      `go/internal/packagelayout/component.textproto:1-18` and mirrored by
      `go/internal/packagelayout/BUILD.bazel:28-47`; the consumers declare the
      boundary at `go/internal/goanalysis/component.textproto:47-50` and
      `go/internal/stdlibmap/component.textproto:51-54`. The focused test passed
      as recorded in work.log:213-218.
  - text: |
      **AnalysisDefeating sites are removed without classifier changes**
        - Given the cache read and missing-file behaviors previously implemented with `io.ReadAll` and `errors.Is`
        - When focused tests exercise EOF, reader failure, oversize/no-progress where applicable, direct not-found, and wrapped not-found cases
