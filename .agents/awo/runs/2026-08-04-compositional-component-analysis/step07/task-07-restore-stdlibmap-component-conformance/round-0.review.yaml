    status: pass
    evidence: |
      `go/internal/stdlibmap/cache.go:123-168` implements the bounded reader and
      `cache.go:275-320` implements bounded direct/wrapped not-found matching;
      `go/internal/stdlibmap/cache_test.go:114-181` covers EOF, reader errors,
