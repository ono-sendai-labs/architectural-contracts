findings:
  - severity: important
    category: other
    file: go/internal/goanalysis/surface_resolver.go
    line: 615
    title: Missing-report detection no longer unwraps errors
    details: |
      `isNotExist` changed from `errors.Is(err, fs.ErrNotExist) ||
      os.IsNotExist(err)` to `os.IsNotExist(err) || err == fs.ErrNotExist`.
      `os.IsNotExist` only recognizes its historical OS wrappers/syscall errors,
      not arbitrary `Unwrap` chains. A `ReadFile` implementation returning
      `fmt.Errorf("read report: %w", fs.ErrNotExist)` is therefore no longer
      treated as an absent optional report by `readDependencyReport` at
      `go/internal/goanalysis/surface_resolver.go:590-603`, changing a valid
      missing-report path into an error. Existing tests return `fs.ErrNotExist`
      directly and do not cover this regression.
    suggested_action: |
      Restore recursive `fs.ErrNotExist` matching (for example with
      `errors.Is` alongside the OS-specific check) or implement an equivalent
      unwrapping helper, and add a resolver test whose reader returns a wrapped
      `fs.ErrNotExist` for an optional report.
    source: built-in
  - severity: important
    category: security
    file: go/internal/packagelayout/packagelayout.go
    line: 702
    title: Lexical scan accepts malformed Go source
    details: |
      The replacement for `parser.ParseFile(..., parser.ImportsOnly)` at
      `go/internal/packagelayout/packagelayout.go:702-780` only checks scanner
      errors and whether some package identifier was seen. It does not validate
      Go declaration grammar; malformed input such as `package p import "dep"`
      or a source containing multiple package clauses can still produce a
      package/import result. `ValidateAndResolve` now uses this routine for
      non-stdlib files at `go/internal/packagelayout/packagelayout.go:1287-1295`,
      so malformed layout source can pass graph validation where the previous
      parser rejected it. Current tests cover valid fixtures and do not pin this
      fail-closed behavior.
    suggested_action: |
      Preserve syntax validation separately from import extraction, either by
      retaining a parser-based validation path compatible with the selfcheck
      boundary or by making the replacement scanner grammar-aware. Add malformed
      package/import and duplicate-package fixtures asserting that
      `ValidateAndResolve` rejects them.
    source: built-in

