    addressed: yes
    evidence: |
      `TestExportDataLayoutJSONIsDeterministicAndPreservesBindings` at `go/internal/packagelayout/export_data_test.go:213-272` compares reversed collection order, verifies caller-owned order is unchanged, and round-trips ExportFile. Existing `MarshalJSON` canonical sorting is at `packagelayout.go:1111-1181`.
