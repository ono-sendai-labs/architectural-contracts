escalation:
  reason: spec_defect
  details: |
    The pinned rules_go provider supplies declared archive dependencies through
    `GoArchive.direct` but omits implicit standard-library imports. The task
    simultaneously requires exact ordinary-to-stdlib edges in the emitted
    member-only graph, forbids recovering non-member imports from source at load
    time, and forbids introducing an extra analysis action. The rework can meet
    the graph requirement only by adding the `ArccImportGraph` source-scanning
    and `ArccLayout` assembly actions. Removing those actions makes the existing
    lowlevel -> strings graph incomplete; retaining them violates the explicit
    action-topology requirement. This requires a specification/design decision
    or a new permitted upstream graph contract, so another automatic rework round
    would not be useful.
