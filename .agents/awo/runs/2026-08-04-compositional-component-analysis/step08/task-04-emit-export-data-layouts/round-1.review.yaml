findings:
  - severity: critical
    category: architecture
    file: bazel_rules/go/private/component.bzl
    line: 296
    title: Exact graph requires actions forbidden by the task
    details: |
      The prior critical graph finding is behaviorally fixed, but the selected
      remedy introduces a source-scanning `ArccImportGraph` action at
      `bazel_rules/go/private/component.bzl:247-310` and a separate `ArccLayout`
      assembly action at `:313-330,867-870`. `ArccImportGraph` parses every
      non-member source file to recover implicit standard-library edges, and
      `bazel aquery` confirms that building the ordinary member component now
      registers two actions (`ArccImportGraph` and `ArccLayout`). This conflicts
      with Technical Requirement 6's explicit prohibition on an extra analysis
      action and with the one-analysis-action topology. The pinned rules_go
      `GoArchive.direct` projection does not expose implicit SDK imports, so
      removing these actions restores the topology only by reintroducing the
      incomplete graph that the prior review found.
    suggested_action: |
      Resolve the specification/design conflict before another implementation
      round: either explicitly permit a declared metadata projection/assembly
      action, or provide a permitted upstream complete ordinary-import graph
      artifact/provider. Once that contract is decided, re-review the resulting
      implementation against the updated task constraints.
    source: built-in
  - severity: important
    category: tests
    file: bazel_rules/go/tests/component_tests.bzl
    line: 404
    title: Determinism test no longer checks final layouts
    details: |
      The pre-rework determinism test compared the final generated
      `multi_infra_a.package-layout.json` and `multi_infra_b.package-layout.json`.
      The current change redirects both lookups to
      `multi_infra_*.package-layout.base.json` at
      `bazel_rules/go/tests/component_tests.bzl:404-408`, so it no longer covers
      the `ArccLayout` output or the exact ordinary import maps. The API/member
      goldens cover two fixed final layouts, but no equivalent final-layout
      comparison remains for the reordered multi-infra pair. This is a coverage
      regression introduced while splitting layout generation into actions.
    suggested_action: |
      Restore the final-layout comparison for the reordered pair, or add an
      equivalent assertion over both final assembled outputs while retaining the
      base-layout assertions needed for analysis-time inspection.
    source: built-in

