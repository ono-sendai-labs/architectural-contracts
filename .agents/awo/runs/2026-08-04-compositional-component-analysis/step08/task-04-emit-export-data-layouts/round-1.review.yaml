merge_request:
  title: "feat(packagelayout): emit export-backed component layouts [Compositional Analysis: Step 08/Task 04]"
  body: |
    Reviews the initial implementation qnnlrttvzuyvktzxqlokxmvpmukpnwrp,
    export-frame rework nyonozuptvrtlskkwztoxptxvuqporyv, complete ordinary
    graph rework tqmqzunoszqvrvzlsuruktnosppxnnzx, and final emitted-layout
    assembly uqzmkoslqtlozpyzkosykkwvtznrpsmw. The series adds ordinary and
    stdlib export metadata, graph projection, runtime validation, action/frame
