notes: |
  Rework round 4 addressed the remaining important security finding in one
  fresh child change (xnmomvwk) of the round-3 tip vquzympz. The scanner-
  based validator had initialized go/scanner with a nil error handler and
  never enforced the error count, so the scanner's best-effort recovery let
  malformed Go literals — an invalid tag escape (struct{A int "json:\q"})
  and a malformed numeric literal ([1_]byte) — validate as type arguments.
  typeParser now records the first scanner error and the error count through
  the error handler, and checkSingleType rejects any lexically dirty scan
  with the actionable first-error description; because the main scan is
  sequential over the whole argument (which must be fully consumed), the
  throwaway lookahead scanner cannot hide a lexical error. New rejection
  rows cover both cases; the full `just ci` gate is green and no prior
  change was rewritten.
