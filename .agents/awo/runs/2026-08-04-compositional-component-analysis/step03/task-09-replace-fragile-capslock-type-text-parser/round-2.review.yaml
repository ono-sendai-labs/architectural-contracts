findings:
  - severity: important
    category: acceptance_criteria
    file: go/internal/symbol/capslock.go
    line: 326
    title: Type-argument splitting is not quote-aware
    details: |
      `splitTypeArgumentList` counts delimiters byte-by-byte at
      `go/internal/symbol/capslock.go:326-350`, without recognizing Go string
      literals or escapes. A valid formatter output such as
      `struct{A int "json:\"}\""}` therefore treats the `}` inside the tag
      as the end of the struct and rejects the real closing brace as
      unbalanced. `stripTrailingBrackets` also scans bracket characters inside
      tags at `capslock.go:253-282`. The new tag test at
      `go/internal/symbol/capslock_test.go:53` contains no delimiter in its
      string, so it does not catch this valid Go/SSA spelling.
    suggested_action: |
      Make the outer bracket/delimiter scan token-aware, at minimum skipping
      quoted strings and escaped bytes, and add a parsed/type-checked tagged
      struct fixture whose tag contains a bracket or brace. Keep the existing
      tuple and nested-type balance checks.
    source: built-in

  - severity: important
    category: tests
    file: go/internal/symbol/capslock_corpus_test.go
    line: 267
    title: Typed corpus omits accepted type forms
    details: |
      The rework now sources its six deferred examples from checked declarations,
      but the corpus table at `go/internal/symbol/capslock_corpus_test.go:272-287`
      still covers only those generated forms plus bare embedded and the
      method cases. Other forms accepted by the normalizer — slices, arrays,
      maps, channels, nested generic types, multi-result functions, pointer
      embedded fields, and tagged fields — remain only hand-authored strings in
      `go/internal/symbol/capslock_test.go:27-56`. The task's technical
      requirement 7 says the corpus must cover every accepted type form, so
      this is an incomplete resolution of the prior corpus-coverage concern
      even though the included rows are now genuinely type-checked.
    suggested_action: |
      Add real parsed/type-checked fixture declarations for every accepted
      type constructor and render each through the formatter path used by the
      normalizer. Use the resulting rows in the differential corpus, while
      retaining the explicit deferred-string equality checks and negative cases.
    source: built-in

