merge_request:
  title: "fix(symbol): complete Capslock normalization [Compositional Analysis: Step 03/Task 09]"
  body: |
    Reviews the complete ordered nine-change series. The initial changes
    replace the private type grammar, add structured inventory-backed
    normalization, add and register the typed corpus, document the API, and
    remove the parser's ambient FILES reachability. The successive rework
    changes confirm method identity and namespaces, resolve declaring-object
    ownership, source corpus rows from checked declarations, make delimiter
    scanning quote-aware, and expand the corpus to the remaining accepted type
    forms.

summary: |
  Both round-2 findings are resolved: the bracket and delimiter scanners now skip quoted literals and escapes, and the corpus exercises the previously omitted constructors from parsed/type-checked fixtures while checking inventory membership. The focused and full Go test suites, vet, gofmt, gopls checks, and the recorded final `just ci` gate pass; the live SSA/VTA path is outside the range and no tests were removed. Changes are still requested because the scanner-based validator ignores lexical errors, allowing malformed literals and numeric tokens through the fail-closed normalizer.

