findings:
  - severity: important
    category: security
    file: go/internal/symbol/capslock.go
    line: 548
    title: Scanner lexical errors are ignored
    details: |
      The scanner-based validator initializes `go/scanner` with a nil error
      handler at `go/internal/symbol/capslock.go:548`, and `checkSingleType`
      never checks `p.scan.ErrorCount`. The standard scanner deliberately
      returns a best-effort token stream after lexical errors. As a result,
      `struct{A int "json:\q"}` can be consumed as a tagged struct because
      `structBody` accepts the resulting `STRING` token, and `[1_]byte` can be
      consumed because `expr` accepts the resulting `INT` token, even though
      both contain invalid Go syntax. These malformed classifier inputs are
      not rejected by the current tables (`capslock_test.go:133-142` and
      `capslock_corpus_test.go:355-363`), violating the fail-closed normalizer
      boundary and the documented syntax-validation contract.
    suggested_action: |
      Capture scanner errors (including their source positions) and reject the
      type argument whenever the completed scan has a nonzero error count,
      while preserving an actionable wrapped error. Add negative table rows for
      an invalid string escape and malformed numeric literal, and ensure the
      lookahead scanner cannot hide lexical errors from the main validation.
    source: built-in

