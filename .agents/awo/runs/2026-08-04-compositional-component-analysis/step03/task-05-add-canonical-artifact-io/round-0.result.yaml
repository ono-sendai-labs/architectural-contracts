  Implemented the shell-side artifact I/O package go/internal/artifactio with
  canonical protojson+encoding/json encoding, sorted/validated normalization
  (duplicates and contradictory states rejected, not repaired), bounded
  fail-closed decoders (16 MiB / 64 MiB caps), lowercase SHA-256 digests over
  re-canonicalized bytes, and atomic sibling-temp writes with five-stage
  failure-injection seams. Committed as three coherent jj changes
  (osyvqoun, plzvnlto, tomnpmyw); the reported change_id is the wiring commit
  at @-, with just ci green on top of all three. One deliberate reading: task
  req 2 lists evidence frames among collections to sort, so frames are
  canonically ordered by (function, file, line), which AC1's byte-equality
  requirement needs; the design's "ordered frames" is thereby realized as a
  deterministic canonical order.
