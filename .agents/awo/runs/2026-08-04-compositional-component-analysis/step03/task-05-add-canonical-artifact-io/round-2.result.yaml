acceptance_criteria:
  - text: |
      1. Canonical bytes ignore caller ordering — Given two semantically identical
      surface or map messages whose repeated entries and nested capabilities/frames are
      ordered differently, when each is marshaled, then the resulting bytes are
      identical, format_version is first, formatting is stable, and neither input message
      was mutated.
    addressed: yes
    evidence: |
      Behavioral. artifactio_test.go TestMarshalSurfaceCanonicalBytes /
      TestMarshalSurfaceInputImmutable / TestMarshalMapCanonicalBytes; rework_test.go
      TestMapCanonicalizesEveryRepeatedField (reordered build tags, symbols, packages,
      inits, evidence, frames; map input unmutated) and TestSurfaceCanonicalizesSDKBuildTags.
      Reviewer marked pass; unchanged this round.
  - text: |
      2. Digest follows canonical semantics — Given equivalent artifacts encoded with
      different source whitespace or entry order, when decoded and hashed, then they
      produce the same lowercase SHA-256 digest; a semantic field change produces a
      different digest.
    addressed: yes
    evidence: |
      Behavioral. decode_test.go TestDigestCanonicalEquivalence /
      TestDigestOnDecodedArtifact / TestMapDigestEquivalence; rework_test.go
      TestSurfaceCanonicalizesSDKBuildTags asserts equal digests for tag-reordered
      equivalents. Reviewer marked pass; unchanged this round.
  - text: |
      3. Readers are forward-compatible but fail closed — Given an artifact with an
      unknown JSON field, an unsupported major version, malformed content, a duplicate
      key, an invalid symbol ID, contradictory authority, or a non-terminal map
      classification, when decoded, then the unknown field alone is ignored, while every
      unsupported or semantically unsafe condition returns a specific error.
    addressed: yes
    evidence: |
      Behavioral. decode_test.go tables plus rework_test.go TestMapRejectsNonImportableAndMismatchedRecords,
      TestMapEvidenceValidation, TestSurfaceRejectsNonCanonicalShape,
      TestMarshalRejectsNilRepeatedEntries. Reviewer marked pass; unchanged this round.
  - text: |
      4. Size caps are enforced before runaway reads — Given surface inputs around 16 MiB
      and map inputs around 64 MiB, when decoded from a reader, then inputs at or below
      the documented limit are processed normally and inputs above it fail with an
      actionable size error without reading or allocating the unbounded remainder.
    addressed: yes
    evidence: |
      Behavioral. decode_test.go TestDecodeSizeCaps (exact-limit passes, limit+1 fails
      with an actionable size error) via boundedRead's io.LimitReader(max+1). Reviewer
      marked pass; unchanged this round.
  - text: |
      5. Atomic writes preserve the previous file — Given an existing valid target and a
      simulated failure while creating, writing, syncing, closing, or renaming its
      replacement, when atomic write returns, then the previous target bytes remain
      intact and temporary residue is cleaned up; only a successful rename makes the new
      bytes visible.
    addressed: yes
    evidence: |
      Behavioral. write_test.go TestAtomicWriteFailuresPreserveTarget /
      TestAtomicWriteSuccess; rework_test.go TestAtomicWriteSurfacesCleanupFailure and
      TestWriteFileAtomicAppliesRequestedMode. Reviewer marked pass; unchanged this round.
  - text: |
      6. Layering and integration remain green — Given the new protobuf/filesystem
      package, when component self-checks, Bazel tests, and just ci run, then pure core
      packages have gained no protobuf or filesystem dependency and all checks pass
      without cache/CLI/action behavior from later steps.
    addressed: yes
    evidence: |
      Non-behavioral. This round's fresh change xkzwovtq repairs the integration gaps the
      round-1 review reopened (the round-1 BUILD edits had been lost from that commit):
      rework_test.go is now in the Bazel go_test srcs, and the go_component member list
      mirrors component.textproto exactly — //go/internal/artifactio, //go/internal/hostpolicy,
      //go/internal/manifest, //go/internal/manifest/gen, //go/internal/symbol, plus the
      protobuf closure — with the artifactio and manifest go_libraries extended to
      //bazel_rules subpackage visibility so the rule can resolve them as members. Verified
      by executing bazel test //go/internal/artifactio:all --cache_test_results=no
      (artifactio_test PASSED including all rework scenarios; artifactio_component.check
      PASSED with the full membership), then just ci (go build/vet/fmt, native self-check,
      bazel build/test //..., bazel_rules membership/shape scripts). No pure-core package
      imports artifactio or protojson; no cache/CLI/action code added.

