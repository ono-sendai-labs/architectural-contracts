findings:
  - severity: important
    category: security
    file: go/internal/symbol/capslock.go
    line: 299
    title: Parenthesized parsing accepts an invalid tuple type argument
    details: |
      `typ` sends every parenthesized form through `paramList(')', false)` at
      `go/internal/symbol/capslock.go:299-303`. Consequently,
      `validTypeArgument("(int, string)")` succeeds and
      `ParseCapslock("store.Load[(int, string)]")` strips the brackets and
      returns `store.Load`, even though a comma-separated parenthesized list is
      only valid as a function result list, not as one Go type argument. This
      violates AC2's requirement that invalid classifier text cannot enter an
      artifact and is not covered by `capslock_test.go:92-120`.
    suggested_action: |
      Track parsing context explicitly: allow a parenthesized parameter/result
      list only after a function or interface method, and require a single type
      for a parenthesized type expression used as a generic argument. Add a
      negative regression for `(int, string)` and related named-list forms.
    source: built-in
  - severity: important
    category: acceptance_criteria
    file: go/internal/symbol/capslock.go
    line: 632
    title: Capslock type grammar still rejects valid Go spellings
    details: |
      The round-4 parser still has valid-type false negatives beyond the cases
      it added. `validatePathTail` requires every package-path segment to start
      with `isIdentStart` at `capslock.go:632-638`, so the new negative case
      `example.com/2x.T` at `capslock_test.go:119` is rejected even though ASCII
      digits are valid in Go import-path elements and the shared
      `validPackagePath` accepts them at `symbol.go:132-150`. In the signature
      grammar, `paramList` treats a leading identifier as a possible parameter
      name at `capslock.go:512-531`, so valid formatter output such as
      `func(example.com/x.T)` and `func(x ...int)` is rejected (the latter is
      the standard named-variadic form). The same ambiguity affects qualified
      embedded struct fields and interface-method parameters, while `expr`
      still omits valid constant operators such as `&^`. These gaps leave
      generic Capslock instantiations unable to converge with the same declared
      symbol, so the prior important type-grammar finding is only partially
      resolved.
    suggested_action: |
      Implement the type grammar from the actual Go/SSA formatter with
      context-aware signature parsing. Permit all valid import-path element
      characters and starts consistently with the canonical package-path grammar;
      distinguish unnamed qualified types from named parameters; support named
      variadics, qualified embedded fields and method parameters, and the
      remaining emitted constant-expression operators. Add positive table rows
      for these forms, especially `example.com/2x.T`,
      `func(example.com/x.T)`, and `func(x ...int)`, before marking AC2 pass.
    source: built-in

