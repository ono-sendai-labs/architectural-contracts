merge_request:
  title: "fix(symbol): harden Capslock type grammar [Compositional Symbols: Step 03/Task 04]"
  body: |
    Reviews the complete ten-change series from the supplied base through the
    supplied current change. The initial five changes add SymbolID parsing,
    Capslock normalization, go/types conversion, exact-surface extraction, and
    component registration; nukpzvow preserves the interrupted first rework;
    xqvosyps verifies it; wntkwnln replaces heuristic admission and the type
    whitelist; rznrnvmp adds resolver-gated dotful paths and more type forms; and
    rqmylkmz hardens bracket admission, signatures, literals, expressions, and
    nil-object handling. The supplied tip is unchanged from the previously
    reviewed round-4 tip, and the live call-graph path remains untouched.

summary: |
  The supplied tip resolves the prior review's explicit malformed-input cases
  and both non-blocking suggestions: the focused RED-to-GREEN run is recorded,
  FromObject(nil) returns an error, and dotful package paths are resolver-gated.
  The newly added variadic, named-parameter, literal, shift, and bracket cases
  pass, but the type grammar still accepts an invalid parenthesized tuple and
  rejects valid Go type spellings such as digit-leading package paths, qualified
  signature parameters, and named variadic parameters. Those AC2 gaps are
  blocking for this task; no findings are safely deferrable to a follow-up while
  this parser is intended to be the canonical normalizer. The other criteria and
  the saved 79/79 just ci gate pass; the local Bazel reattempt remains blocked by
  read-only shared cache state.

