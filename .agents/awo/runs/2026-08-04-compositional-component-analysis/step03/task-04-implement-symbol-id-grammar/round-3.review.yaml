findings:
  - severity: important
    category: security
    file: go/internal/symbol/capslock.go
    line: 207
    title: Capslock type parser remains incomplete and non-fail-closed
    details: |
      The round-3 additions make the exact prior examples pass, but
      `validTypeArgument` is still not a complete or consistently rejecting
      grammar. `isIdentCont` includes `-` at `capslock.go:268-270`, and
      `unit` uses it for every name at `capslock.go:414-425`, so a malformed
      bare type argument such as `foo-bar` is accepted and stripped into a
      canonical ID. `typeList` permits another parameter after `...T` at
      `capslock.go:366-383`, accepting invalid `func(...int, string)`. The
      opposite direction also remains incomplete: `typ` explicitly rejects
      valid struct/interface literal type arguments at `capslock.go:348-350`,
      named function parameters such as `func(x int) string` cannot be parsed
      by the same list grammar, and `expr` recognizes only `+`, `-`, `*`, `/`,
      and `%` at `capslock.go:428-445`, rejecting valid constant expressions
      such as `[N<<1]byte`. `stripTrailingBrackets` also strips bracket groups
      from its prefix at `capslock.go:143-147`, allowing malformed repeated
      groups such as `Load[T][U]`. Accepted malformed text violates AC2's
      fail-closed requirement, while the rejected forms leave generic
      instantiations under-covered.
    suggested_action: |
      Parse type arguments using Go's type syntax/typed representation, or
      complete the formatter grammar that Capslock/SSA can emit. Distinguish
      package-path hyphens from type identifiers, require variadic parameters
      to be final, support named parameters and literal types, recognize all
      emitted constant-expression forms, and reject multiple top-level bracket
      groups. Add table-driven positive and negative regressions for these
      cases before marking AC2 pass.
    source: built-in
