merge_request:
  title: "fix(symbol): complete Capslock grammar and type validation [Compositional Symbols: Step 03/Task 04]"
  body: |
    Reviews the complete nine-change series from the supplied base through the
    current change. The initial five changes add SymbolID parsing, Capslock
    normalization, go/types conversion, exact-surface extraction, and component
    registration; nukpzvow preserves the interrupted first rework; xqvosyps
    verifies it; wntkwnln replaces the heuristic Capslock admission and type
    whitelist; and rznrnvmp adds resolver-gated dotful paths and more type forms.
    The live call-graph path remains untouched.

summary: |
  The latest change resolves the specific round-2 ambiguity by rejecting dotful
  unparenthesized spellings without context and retaining known package paths
  through ParseCapslockWithPackages; it also makes the previously reported
  variadic, multi-result, parenthesized, nested-generic, and division examples
  pass. However, the type-argument validator remains incomplete and non-fail-closed:
  it accepts malformed type text while rejecting additional valid Go type forms,
  so AC2 remains partial and another fix round is required. The remaining core,
  extraction, component, and live-path checks pass; the saved final just ci run is
  green, while this review's Bazel reattempt was blocked by read-only shared cache
  state.

