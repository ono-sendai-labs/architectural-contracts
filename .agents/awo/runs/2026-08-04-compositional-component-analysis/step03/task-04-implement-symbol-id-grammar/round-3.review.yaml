  - severity: suggestion
    category: other
    file: go/internal/symbol/typesconv.go
    line: 34
    title: FromObject can panic for a nil object
    details: |
      `FromObject` falls through to `obj.Name()` at `typesconv.go:34` without
      checking a nil interface or a typed nil `go/types` pointer. The public
      conversion API promises actionable rejection for non-symbol objects, but
      this malformed caller input panics instead of returning an error. Current
      extractor callers guard nil entries, so this does not affect the covered
      fixtures.
    suggested_action: |
      Return an explicit error before the type switch for nil objects and guard
      typed nil pointers if the API is intended to be defensive.
    source: built-in

