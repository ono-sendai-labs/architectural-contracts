notes: |
  Implemented the SymbolID grammar additively in a new pure core package
  go/internal/symbol over four incremental commits: the v1 grammar with strict
  Parse/Format/Compare, the Capslock normalizer, the go/types declaring-object
  conversion (FromObject/FromSelection), and the exact declared-surface extractor,
  followed by component registration (BUILD, textproto, justfile selfcheck). TDD was
  followed per requirement with RED evidence in work.log. One interpretation is
  recorded: "versioned encoding" is implemented as a pinned v1 grammar with strict
  rejection of out-of-grammar spellings, with artifact versioning in each artifact's
  format_version, because the design table fixes the persisted keys as bare spellings
  (no prefix) and DR-15 puts format_version on artifacts. Declaring an unused cli
  dependency on symbol would raise UNUSED_DEPENDENCY, so that wiring is deferred to
  the Step 5 surface producer. `just ci` is green end to end; the live check path is
  untouched.
