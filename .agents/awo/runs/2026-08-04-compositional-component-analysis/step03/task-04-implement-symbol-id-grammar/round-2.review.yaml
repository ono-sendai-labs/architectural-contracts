findings:
  - severity: important
    category: acceptance_criteria
    file: go/internal/symbol/capslock.go
    line: 60
    title: Slash-qualified dotted method spellings remain ambiguous
    details: |
      The round-2 `capslockTopLevelPackageUnambiguous` rule treats any package
      prefix containing a slash as unambiguous at
      `go/internal/symbol/capslock.go:66-80`. The exact spelling
      `example.com/p.private.Read`, which the prior review identified as a
      possible unparenthesized method on type `private` in package
      `example.com/p`, now appears as a positive top-level case at
      `go/internal/symbol/capslock_test.go:38-39` and is returned as a
      `SymbolID`. A package named `example.com/p.private` with top-level
      `Read` is also a valid interpretation, so slash presence does not make
      the text unambiguous. This leaves the prior AC2 requirement that unsafe
      classifier text be rejected unresolved; the new test reclassifies the
      ambiguous input instead of proving its safe mapping.
    suggested_action: |
      Preserve the classifier's structured object kind or resolve the package
      and receiver against typed declarations before accepting an
      unparenthesized spelling. Do not claim slash-qualified dotted text is
      unambiguous without that context; add a regression that rejects or
      otherwise disambiguates `example.com/p.private.Read` while retaining
      valid `example.com/p.private.Read` top-level paths when their package is
      actually known.
    source: built-in
  - severity: important
    category: security
    file: go/internal/symbol/capslock.go
    line: 174
    title: Capslock type parser misses valid Go type arguments
    details: |
      `validTypeArgument` is documented as handling functions, variadics,
      parenthesized groups, and array constant expressions at
      `go/internal/symbol/capslock.go:174-185`, but the parser does not implement
      all of those forms. `typeList`'s `kw("...")` word-boundary check at
      `capslock.go:328-341` rejects the normal `func(...int)` spelling, and
      `typ` has no `(` case, so `func() (int, string)` and parenthesized type
      groups fail. `expr` at `capslock.go:391-407` omits valid operators such as
      `/`, and `name` stops before nested generic arguments, so valid forms such
      as `[N/2]byte` and `Pair[int]` as an argument are rejected. The task's
      generic-instantiation requirement is therefore only partially covered by
      the simpler test cases at `capslock_test.go:31-35`.
    suggested_action: |
      Base validation on Go's type syntax/typed representation, or complete the
      parser to match every type form that Capslock can print, including
      variadic and multi-result function types, parenthesized/nested generic
      types, and the full constant-expression grammar. Add table-driven tests
      for those forms before treating the Capslock normalizer as complete.
    source: built-in

