summary: |
  The prior important ownership finding is resolved: the rework puts all three
  generated protobuf outputs in the existing manifest component's declared
  gen member and adds a Bazel target for the schema tests. All six acceptance
  criteria remain satisfied, current native Go tests/vet/formatting and the
  recorded full CI gate pass, and no security or behavioral regression was
