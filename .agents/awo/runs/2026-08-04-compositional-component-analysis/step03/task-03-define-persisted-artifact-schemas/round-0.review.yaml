acceptance_criteria:
  - text: |
      1. **Surface contract is complete**
         - Given `surface.proto`
         - When its top-level message is inspected
         - Then field 1 is `format_version`, all design-specified surface data is representable, packages and symbols are repeated sortable entries, authority distinguishes unknown from known-empty, and no provenance claim is stored in the file.
    status: pass
    evidence: |
      `proto/archcontracts/v1/surface.proto:33-80` defines SurfaceManifest with
      format_version at field 1, component/interface style/authority, concrete
      packages and symbols, namespace, SDK key, producer version, and digest;
      the no-provenance rule is documented at :21-26. The authority wrapper and
      shared enum are defined at :83-98. Descriptor and round-trip coverage is
      present at `go/internal/archcontracts/schema_test.go:41-104` and
      `:253-273`.
  - text: |
      2. **SDK identity is target-complete**
         - Given the shared SDK key schema
         - When its fields are inspected
         - Then toolchain version, target OS/architecture, cgo setting, build tags, GOEXPERIMENT, classifier hash, and map format version are all represented without conflating host and target configuration.
    status: pass
    evidence: |
      `proto/archcontracts/v1/stdlibmap.proto:67-100` defines all eight SDKKey
      fields and explicitly states that every field describes the target rather
      than the host. `go/internal/archcontracts/schema_test.go:146-162` checks
      their field numbers and kinds, including the repeated build_tags field.
  - text: |
      3. **Map totality and classifications are representable**
         - Given `stdlibmap.proto`
         - When representative safe, capability-bearing, unanalyzed, non-importable, init, and evidence records are constructed
         - Then each state is explicit and unambiguous, capability classification cannot rely on an absent symbol meaning safe, and package inventory records importability.
    status: pass
    evidence: |
      `proto/archcontracts/v1/stdlibmap.proto:19-64` defines total package,
      symbol, init, and (symbol, capability) evidence collections;
      :103-133 defines importability and the explicit UNSPECIFIED/SAFE/
      CAPABILITIES/UNANALYZED terminal enum; :136-199 defines capabilities and
      function/file/line frames. Descriptor checks are at
      `go/internal/archcontracts/schema_test.go:164-238`, and representative
      records for all requested states are round-tripped at `:274-293`.
  - text: |
      4. **Schema supports canonical ordering**
         - Given every collection in both artifact schemas
         - When descriptors and comments are inspected
         - Then no proto map field exists and every repeated keyed entry has a defined deterministic sort key for Task 5.
    status: pass
    evidence: |
      The schema comments document sort keys for the keyed repeated fields at
      `proto/archcontracts/v1/surface.proto:51-61,96-98` and
      `proto/archcontracts/v1/stdlibmap.proto:43-64,86-88,150-186` (ordered
      evidence frames are not keyed). `TestNoMapFields_AnySchema` recursively
      checks all messages in the three schema files at
      `go/internal/archcontracts/schema_test.go:122-143`.
  - text: |
      5. **Generation is comprehensive and repeatable**
         - Given all component, surface, and map schemas
         - When `just gen` is run twice and `just gen-is-clean` is evaluated
         - Then all checked-in `.pb.go` files are reproduced identically and cleanliness covers every protoc output.
    status: pass
    evidence: |
      `justfile:25-31` invokes protoc for component.proto, surface.proto, and
      stdlibmap.proto and scopes gen-is-clean to the checked-in generated
      `*.pb.go` outputs while excluding BUILD files. The RED then GREEN
      generation evidence, including the initial dirty-output failure and the
      subsequent CLEAN_OK result, is recorded at
      `.agents/scratchpad/2026-08-04-compositional-component-analysis/step03/task-03-define-persisted-artifact-schemas/work.log:90-111`.
  - text: |
      6. **Native and Bazel builds remain green**
         - Given the new generated packages and metadata
         - When `just ci` runs
         - Then all checks pass without an artifact producer, consumer, or analysis-path change.
    status: pass
    evidence: |
      The recorded full gate at
      `.agents/scratchpad/2026-08-04-compositional-component-analysis/step03/task-03-define-persisted-artifact-schemas/work.log:112-119`
      reports `just ci` completing through the native and Bazel legs, with the
      final validation scripts passing. The implementation range contains only
      schemas, generated bindings, generation wiring, BUILD metadata, and tests;
      no producer, reader, cache, CLI, or analysis action was added.

findings:
  - severity: important
    category: architecture
    file: go/internal/archcontracts/gen/BUILD.bazel
    line: 3
    title: Generated schema package has no component ownership
    details: |
      The new BUILD file declares only a `go_library` for the generated package
      (`go/internal/archcontracts/gen/BUILD.bazel:3-16`). There is no
      `go_component` or checked-in component metadata owning that package, and
      `go/internal/archcontracts/` has no BUILD target for
      `schema_test.go`. This differs from the established generated-package
      pattern, where `go/internal/manifest/BUILD.bazel:56-95` explicitly lists
      `manifest/gen` as a component member. Consequently the new generated
      package is absent from the architectural ownership graph and the schema
      tests run only through native `go test`; a green `bazel build //...` does
      not exercise the un-BUILDed test package. This leaves Technical
      Requirement 9 incomplete.
    suggested_action: |
      Add BUILD metadata that makes the schema tests a Bazel go_test target and
      add an owning `go_component` (or attach the generated package as a member
      of the explicitly intended existing component). If it is a separate
      component, declare the manifest component as its component dependency for
      the generated surface import, while keeping later artifact producers and
      consumers out of this task.
    source: built-in

