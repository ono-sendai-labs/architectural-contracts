      field 1 (int32), component, interface_style (shared component enum),
      AuthorityDeclaration, concrete package paths and symbol IDs as repeated
      sortable string entries, namespace, sdk_key, producer_version, digest.
      No provenance field exists. Verified by go/internal/archcontracts/schema_test.go
