notes: |
  Rework round 1 addressed the reviewer's single important finding (generated
  schema package lacked component ownership; schema tests lacked a Bazel
  target). Rather than inventing a new component — which would have required
  component dependencies on manifest for the generated enum imports, creating
  either member-overlap or undeclared-interface exposure of the protobuf
  runtime — both schemas now generate into go/internal/manifest/gen, the
  package already owned by the checked manifest component, keeping the Go
  import graph trivially acyclic per task requirement 4. A Bazel go_test
  (//go/internal/archcontracts:archcontracts_schema_test) now enforces the
  descriptor and round-trip tests under bazel test //.... Full `just ci` is
  green with 77 Bazel tests. Round-1 changes were mvzpmomu (schemas) and
  pvysxzts (tests); this round's fresh child change is bc6c358c.
