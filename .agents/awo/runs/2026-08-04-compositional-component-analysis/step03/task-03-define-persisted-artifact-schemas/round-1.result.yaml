      stdlibmap.proto: total PackageInventory (importable flag for internal/
      packages), SymbolRecord with Classification SAFE=1/CAPABILITIES=2/
      UNANALYZED=3 plus CLASSIFICATION_UNSPECIFIED=0 guarding the zero value,
      non-empty capabilities list, InitRecord per package, Evidence keyed
      (symbol, capability) with Frame function/file/line. Verified by
      TestStdlibMap_ClassificationEnumValues, TestStdlibMap_RecordsCarryRequiredData,
      TestStdlibMapAndSurface_RoundTrip — all pass.
  - text: "Schema supports canonical ordering"
    addressed: yes
    evidence: |
      TestNoMapFields_AnySchema walks every message in component, stdlibmap and
      surface schemas and asserts zero proto map fields — passes. Every keyed
      repeated field carries a documented canonical sort key ("Sort key:" comments
      across surface.proto and stdlibmap.proto, e.g. StdlibMap.symbols:
      "(package, id), lexicographic byte order").
  - text: "Generation is comprehensive and repeatable"
    addressed: yes
    evidence: |
      justfile gen compiles all three schemas in one protoc invocation, with
      surface/stdlibmap now emitted into go/internal/manifest/gen;
