      TestSurface_AuthorityDistinguishesUnknownFromEmpty,
      TestSurface_InterfaceStyleReusesComponentEnum) — all pass natively and
      under Bazel (//go/internal/archcontracts:archcontracts_schema_test).
  - text: "SDK identity is target-complete"
    addressed: yes
    evidence: |
      proto/archcontracts/v1/stdlibmap.proto: SDKKey carries toolchain_version,
      goos, goarch, cgo_enabled, sorted build_tags, goexperiment, classifier_hash,
      map_format_version (fields 1-8), with target-vs-host semantics documented on
      each field (DR-09). Verified by TestSDKKey_FieldsComplete in
      go/internal/archcontracts/schema_test.go — passes.
  - text: "Map totality and classifications are representable"
    addressed: yes
