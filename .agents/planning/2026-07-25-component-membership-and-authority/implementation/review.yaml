      old kind and PassesFuncValue removed.
    actual: |
      scanFuncValueEscapes (goanalysis.go:1886+), facts.FuncValueEscape, and
      report.AbsorbedFuncValueEscape. The old kind, the CallEdge field and the
      helper are absent tree-wide.
    status: aligned
    files:
      - go/internal/goanalysis/goanalysis.go
      - go/internal/facts/facts.go
      - go/internal/checker/checker.go
    notes: |
      The two end-to-end tests were converted to silence assertions rather than
      deleted, as required — but kept names that assert the opposite of what
      they now check. See F9.

  - element: "PACKAGE_SURFACE dependency resolution (A6, M8, §4.5)"
    expected: |
      ResolveDependencyInterface gains a PACKAGE_SURFACE branch returning the
      full exported member surface; a pattern-membership dependency resolves its
      surface from the depender's own layout; CALLS_UNDECLARED_INTERFACE becomes
      vacuous while UNUSED_DEPENDENCY stays meaningful.
    actual: |
      Both branches exist (goanalysis.go:1376-1378, 1783+) and the checker skips
      CALLS_UNDECLARED_INTERFACE for a package-surface dependency
      (checker.go:270-272). But the *subject-of-check* case is unguarded:
      LoadPackageFacts returns empty facts for an all-pattern membership
      (goanalysis.go:60-62), app.go skips capability analysis when no packages
      loaded (app.go:237), and the run reports conformance with exit 0.
    status: partial
    files:
      - go/internal/goanalysis/goanalysis.go
      - go/cmd/arcc/app/app.go
    notes: |
      The dependency direction — the one the design specifies in detail — is
      complete and correct. What is missing is a guard on the direction the
      design assumed would not happen (C.6: such a component "has no check of
      its own"). Nothing enforces that assumption, and the failure mode is a
      silent clean report rather than an error. See F1.

  - element: "Package-granularity pruning (A6, §4.6)"
    expected: |
      capanalyzer.AnalyzeRequest gains PruneAtPackages; buildClassifier emits
      `package <path> CAPABILITY_SAFE` for PACKAGE_SURFACE dependencies
      alongside per-function keys.
    actual: |
      As specified; app.go builds prunePkgSet only from package-surface
      dependencies (app.go:209-213).
    status: aligned
    files:
      - go/internal/capanalyzer/capanalyzer.go
      - go/internal/capslockadapter/capslockadapter.go
      - go/cmd/arcc/app/app.go
    notes: ""

  - element: "auto_attached edges exempt from UNUSED_DEPENDENCY (A7)"
    expected: |
      Read off the depender's own manifest, no dep-manifest lookup; the injected
      edge appears in the emitted manifest even when attachment is unconditional.
    actual: |
      checker.go:288-291 reads dep.AutoAttached directly; the Bazel emitter
      writes `auto_attached: true` on injected edges (component.bzl:89-95).
    status: aligned
    files:
      - go/internal/checker/checker.go
      - bazel_rules/go/private/component.bzl
    notes: ""

  - element: "Certified/asserted boundary annotation (A8)"
    expected: |
      The report's dependency listing marks each pruned boundary certified or
      asserted with the certification reference where recorded. Not a finding.
      The dependency's own emitter is the only party that can know.
    actual: |
      The report side is complete: DependencyBoundary, formatDependencyBoundary,
      and both render paths. The emitter side is absent — no .bzl file writes
      `own_check_runs`, so every generated manifest is silently `asserted`,
      including arcc's own six Bazel-checked components.
    status: partial
    files:
      - go/internal/report/report.go
      - go/internal/checker/checker.go
      - bazel_rules/go/private/component.bzl
    notes: |
      Observed in this review's `just ci` run: all eight self-check reports list
      every dependency as `asserted`. The half that was implemented cannot
      express its interesting state. See F2.

  - element: "Bodiless absorbed packages as ANALYSIS_LIMITATION (A9)"
    expected: |
      Reuse the existing kind rather than the UNANALYZED authority constant.
    actual: |
      collectBodilessAbsorbedPackages feeding facts.BodilessAbsorbedPackages and
      a checker warning (checker.go:240-245). UNANALYZED stays a suppressed
      Capslock capability.
    status: aligned
    files:
      - go/internal/goanalysis/goanalysis.go
      - go/internal/checker/checker.go
    notes: ""

  - element: "Adapter seam additions (§4.7: go_build_platform, go_attach_infra, INFRA_COMPONENTS)"
    expected: |
      Three host-swappable additions in the one seam file. go_build_platform
      reads GoInfo.mode, not GoSDK.goos, and may return a constant.
      go_attach_infra(target, infra) may return True unconditionally.
      INFRA_COMPONENTS accepts labels or patterns, with a worked example.
    actual: |
      go_build_platform and INFRA_COMPONENTS are as specified, with the worked
      examples. go_attach_infra's parameter is named `target` and documented as
      "the Go target being wrapped", but its only call site passes a *list* of
      root targets (component.bzl:206 -> go_adapter.bzl:200). The file also
      carries a test-only attachment harness (go_infra_components'
      test_infra_attach branch, with hardcoded fallback patterns) and the
      component rule declares two attributes documented as "Undocumented
      testing attribute".
    status: drifted
    files:
      - bazel_rules/go/private/go_adapter.bzl
      - bazel_rules/go/private/component.bzl
    notes: |
      Justified evolution on the substance — M9 requires attachment to see the
      union of interface and members, so a list is the right input. Unjustified
      on the contract: the design, the docstring and the parameter name all
      still say a single target, and a second host implementing the seam from
      the documentation gets it wrong. The test harness inside the seam is drift
      of a different kind: it puts code a host must delete into the file the
      design says a host replaces wholesale. See F3, F4.

  - element: "Component rule: FR2-frontier classification and emission (§3.1, §4.8, M4, M6)"
    expected: |
