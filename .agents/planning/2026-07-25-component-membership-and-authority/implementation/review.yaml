findings:
  - id: F1
    severity: important
    category: architecture
    file: go/internal/goanalysis/goanalysis.go
    line: 60
    title: A pattern-membership component checked directly reports conformance having analyzed nothing
    details: |
      `LoadPackageFacts` short-circuits on an all-pattern membership:

          if len(req.Members) > 0 && isAllPatternMembers(req.Members) {
              return facts.PackageFacts{}, nil
          }

      Nothing downstream notices. `app.go:237` guards capability analysis with
      `if len(pkgs) > 0`, so no analyzer runs; `checker.Check` over empty facts
      produces no violations and no warnings; `RenderText` takes the clean
      branch. Verified by running the shipped binary against a three-line
      manifest:

          name: "pattern_surface_comp"
          interface_style: INTERFACE_STYLE_PACKAGE_SURFACE
          members: "example.com/runtime/*"
          declared_authority: "FILES"

          $ ./bin/arcc check component.textproto
          Component "pattern_surface_comp" conforms; does not exceed declared authority
          $ echo $?
          0

      Design Appendix C.6 assumes such a component "has no check of its own",
      and A8 exists precisely to make that visible. But the assumption is
      nowhere enforced, and the result of violating it is the failure mode this
      whole batch was written to remove: a clean report where nothing was
      analyzed. Compare A9, which spends a report kind on exactly this hazard
      for a single absorbed package, while a whole component can vanish
      silently. Note the mixed case is also unhandled: a PACKAGE_SURFACE
      component with one literal and one pattern member does not take this
      branch, and its raw pattern is then handed to `packages.Load` as a
      pattern go/packages does not understand.
    suggested_action: |
      Fail closed. Either reject the load with an error naming the manifest and
      explaining that pattern membership is a dependency-side construct, or
      surface it as an ANALYSIS_LIMITATION so the report cannot read clean.
      Cover the mixed literal/pattern case explicitly rather than by omission.
    source: built-in
    addressed_by: step12/task-01-fail-closed-on-unanalyzable-pattern-membership.code-task.md

  - id: F2
    severity: important
    category: architecture
    file: bazel_rules/go/private/component.bzl
    line: 68
    title: No emitter writes own_check_runs, so A8's `certified` state is unreachable
    details: |
      `_manifest_content` emits name, interface_style, interface_files,
      component_dependencies, absorbed_dependencies, members and
      declared_authority. It never emits `own_check_runs` or
      `certification_reference`. A grep for either field across `*.bzl`,
      `*.textproto` and `BUILD.bazel` finds them only in goanalysis unit-test
      fixtures and one Bazel golden asserting the JSON default `false`.

      The consequence is that the certified/asserted annotation — the whole of
      A8, and the reason §5.3 argues against a report kind — can only ever say
      "asserted" for any component a build system generated. This review's
      `just ci` run shows it on arcc itself: all eight self-check reports list
      every dependency as `asserted`, including `capanalyzer`, `facts`,
      `manifest`, `report`, `checker` and `goanalysis`, whose `.check` targets
      demonstrably run under `bazel test //...`.

      The emitter has the information without needing to look anything up: the
      `go_component` macro unconditionally generates `name.check`
      (defs.bzl:135), so a component emitted by this rule always has a check
      that runs — except when it inherits `tags = ["manual"]`, which is the one
      case that needs a decision. Design §4.1 assigns this knowledge to the
      dependency's own emitter precisely because a depender cannot infer it.
    suggested_action: |
      Emit `own_check_runs: true` from `_manifest_content` for components whose
      generated `.check` participates in `bazel test`, and false (or a
      certification_reference) otherwise; decide and document the `manual`-tagged
      case. Update the affected goldens and the manifest parity test, and pin
      the behavior with a check that a generated manifest renders `certified` in
      a depender's report.
    source: built-in
    addressed_by: step12/task-02-emit-own-check-runs-from-the-component-rule.code-task.md

  - id: F3
    severity: important
    category: dependencies
    file: bazel_rules/go/private/go_adapter.bzl
    line: 120
    title: Test scaffolding lives inside the host seam and on the production rule
    details: |
      `go_adapter.bzl` opens by stating that a host "ports arcc by replacing
      just this file — the rules above it stay byte-identical". `go_infra_components`
      now begins with a 35-line branch that exists only for arcc's own analysis
      tests: it reads `ctx.attr.test_infra_attach`, dispatches on the string
      values ALWAYS / NEVER / CLOSURE, and falls back to hardcoded fixture
      patterns `["*runtime*", "*injected*", "*member*"]` when a test entry
      supplies none. `component.bzl:470-475` correspondingly declares
      `test_infra_patterns` and `test_infra_attach` on the production rule, both
      documented as "Undocumented testing attribute".

      Two costs. A porting host must read past a test harness to find the
      contract, and must decide whether deleting it breaks anything — the file
      is the swap unit, so the harness is not separable by construction. And
      arcc's own attachment predicate is exercised almost entirely through the
      test branch rather than through `go_attach_infra`, so the seam that ships
      is thinner-tested than the line count suggests.

      A dead branch sits alongside it: line 156 reads
      `ctx.attr.infra_components`, an attribute no rule in the tree declares, so
      the `hasattr` guard is always false.
    suggested_action: |
      Move the attachment-mode harness out of `go_adapter.bzl` — a test-only
      adapter or a fixture-local rule wrapper keeps the fixtures working without
      putting them in the swap unit — and drop the two test attributes from the
      production rule or move them behind a clearly test-scoped rule. Delete the
      unreachable `infra_components` branch.
    source: built-in
    addressed_by: step12/task-03-move-infra-test-scaffolding-out-of-the-host-seam.code-task.md

  - id: F4
    severity: important
    category: doc_divergence
    file: bazel_rules/go/private/go_adapter.bzl
    line: 70
    title: go_attach_infra's documented contract disagrees with its only call site
    details: |
      The seam is declared `def go_attach_infra(target, infra)` and its docstring
      says "`target` is the Go target being wrapped and `infra` is one entry from
      INFRA_COMPONENTS. A host may inspect either input when its analysis-phase
      graph exposes the relevant injected packages." Design §4.7 declares the
      same signature.

      The only call site passes a list:

          # component.bzl:204,206
          roots = ([ctx.attr.interface] if ctx.attr.interface else []) + ctx.attr.members
          attached_infra = go_attached_infra(ctx, roots, ctx.attr.infra_deps)
          # go_adapter.bzl:200
          should_attach = go_attach_infra(roots, entry)

      The list is the correct input — M9 requires attachment to be evaluated
      against the union of the interface and the members, not one distinguished
      target — so the code is right and three pieces of documentation are wrong.
      This matters more than an ordinary stale comment because the seam exists
      to be reimplemented by someone who has only the documentation: a host that
      writes `target[ArccPackageInfo]` per the docstring fails at analysis time,
      and a host that returns True unconditionally (which the docs bless) never
      finds out.
    suggested_action: |
      Rename the parameter to `targets` (or `roots`), rewrite the docstring to
      say it receives every root target of the component being wrapped, and
      correct design §4.7's declaration. Add an analysis test whose predicate
      actually inspects the argument, so the contract is pinned by something
      other than prose.
    source: built-in
    addressed_by: step12/task-04-correct-the-adapter-seam-and-macro-documentation.code-task.md

  - id: F5
    severity: suggestion
    category: dead_code
    file: bazel_rules/go/private/component.bzl
    line: 313
    title: Three dead surfaces left behind by the batch
    details: |
      - `component.bzl:313` binds `unclassified` from `_classify` and never uses
        it. Behaviorally correct — §3.1 says the error branch needs no emitter
        rule because `UNDECLARED_DEPENDENCY` covers it at check time — but the
        binding reads like an unfinished error path, and `_classify` computes and
        sorts a list nobody consumes.
      - `packagelayout.IsStdlib` (packagelayout.go:82) has no caller outside its
        own unit test, and the free function `IsStdlibPackage`
        (packagelayout.go:107) has none at all; every real call goes through the
        `*Layout` method. Design §4.6 still cites `packagelayout.IsStdlib` as one
        of the "other code paths" that justify the T4 agreement check.
      - `go_adapter.bzl:156` reads `ctx.attr.infra_components`, which no rule
        declares (also noted in F3).
    suggested_action: |
      Drop `unclassified` from `_classify`'s return (or consume it), delete the
      two unused packagelayout exports along with the test that only exists to
      call one of them, and correct the §4.6 sentence to name the consumers that
      actually exist.
    source: built-in
    addressed_by: step12/task-05-remove-dead-surfaces-and-unify-membership-matching.code-task.md

  - id: F6
    severity: suggestion
    category: consistency
    file: go/internal/goanalysis/goanalysis.go
    line: 458
    title: "Membership matching has two different semantics in the Go core"
    details: |
      "Is this package a member?" is answered three times with two meanings:

      - `checker.buildMembership` (checker.go:400-408) matches each declared
        member against each package path with `path.Match`, so a member entry is
        a *pattern*.
      - `goanalysis.packageIsDeclaredMember` (goanalysis.go:458-466) and
        `validateDeclaredPackages` (goanalysis.go:420-438) compare canonicalized
        strings for equality, so a member entry is a *literal*.
      - The Bazel emitter uses `match_path` for `member_patterns` and label
        identity for `members`.

      Today the divergence is masked by F1's short-circuit and by manifest
      validation forbidding patterns under the declared style, so no supported
      configuration reaches both paths with a pattern. That makes it a latent
      inconsistency rather than a live bug — but it is the kind that surfaces as
      an inexplicable difference between what the loader analyzed and what the
      checker swept, and F1's fix will have to pick one semantics anyway.
    suggested_action: |
      Give the two Go packages one membership-matching helper with one
      documented semantics, and state in the LoadRequest doc which form Members
      may take in each mode.
    source: built-in
    addressed_by: step12/task-05-remove-dead-surfaces-and-unify-membership-matching.code-task.md

  - id: F7
    severity: suggestion
    category: unresolved_review_findings
    file: bazel_rules/go/defs.bzl
    line: 186
    title: "Step 6 task 03's review finding on the macro doc is still open"
    details: |
      The `code-task-review` report for step06/task-03 raised a `suggestion`:
      the public macro doc "still says every component is 'around a Go interface
      library' and that its target forwards the interface library's Go providers
      ... PACKAGE_SURFACE targets intentionally have neither". Verified still
      present at defs.bzl:186-192, unchanged by any later step. The task was
      approved with the finding open, which is legitimate at suggestion level;
      it is carried here because the doc is the first thing an author reads when
      choosing between the two styles.
    suggested_action: |
      Distinguish declared-style from PACKAGE_SURFACE targets in the macro
      overview and state that only declared style forwards Go providers.
    source: code-task-review (step06/task-03)
    addressed_by: step12/task-04-correct-the-adapter-seam-and-macro-documentation.code-task.md

  - id: F8
    severity: suggestion
    category: unresolved_review_findings
    file: go/internal/goanalysis/canonicalization_test.go
    line: 730
    title: "Two open findings from the Step 9 task 05 orchestrator review"
    details: |
      That task's final review (orchestrator-review.yaml, `approved`) left four
      findings unaddressed by design. Two are worth closing:

      - `TestCollectBodilessAbsorbedPackages_DeduplicationAndSorting` cannot fail
        on either property in its name. The reviewer removed the `seen` guard and
        `sort.Strings` in a scratch copy and the test passed both times, because
        `packages.Visit` already dedupes by pointer and sorts import paths. The
        remaining claims of the criterion are pinned; the two named ones are not.
      - `TestCheck_ThreeAnalysisLimitationsAreDistinguishable`
        (checker_test.go:2057) asserts the rendered report contains "is an
        analysis limitation" to identify the *capability* limitation, but the
        unresolved-import message ends in the same words (checker.go:233), so the
        assertion passes even if the capability warning is missing.

      The other two — a duplicated comment in a commit whose description
      overstates it, and a per-package re-canonicalization of absorbed patterns —
      are cosmetic and are folded into F10 rather than tracked here.
    suggested_action: |
      Give the collector fixture a graph whose traversal order is the reverse of
      the sorted result and two distinct package values canonicalizing to one
      path, so both properties can fail; and assert on a substring unique to the
      capability producer.
    source: code-task-review (step09/task-05, orchestrator re-review)
    addressed_by: step12/task-06-test-and-comment-hygiene.code-task.md

  - id: F9
    severity: suggestion
    category: tests
    file: go/cmd/arcc/cli_integration_test.go
    line: 868
    title: "Converted higher-order tests keep names asserting the warning they now assert is absent"
    details: |
      Step 8 required the two end-to-end HIGHER_ORDER_BOUNDARY_CALL tests to be
      converted to silence assertions rather than deleted, so they become the
      pinning tests for the plugin-struct pattern. The conversion was done
      correctly and the names were not touched:
      `TestIntegration_HigherOrderBoundaryCall_Warning` now asserts exit 0 and
      the absence of the old string, and `TestCheck_FR5_HigherOrderBoundaryCall`
      asserts zero violations and zero warnings. A reader scanning test names
      concludes arcc still has the warning. The same staleness sits in
      `checker.go:41`, whose doc comment lists "FR5 (cross-component
      call-boundary rule and higher-order boundary-call warning)".
    suggested_action: |
      Rename both tests to say what they pin — that the plugin-struct pattern
      stays silent — and drop the removed warning from the Check doc comment.
    source: built-in
    addressed_by: step12/task-06-test-and-comment-hygiene.code-task.md

  - id: F10
    severity: nit
    category: style
    file: go/internal/manifest/manifest.go
    line: 207
    title: "Scaffolding comments and small redundancies left by the batch"
    details: |
      - `manifest.go:207`: "validate is a seam for task-03 to add syntactic
        validation rules" — the rules were added in that task; the comment now
        points at a task file rather than describing the function.
      - `defs.bzl:49-51`: the exported `validate_component_shape` test wrapper is
        wedged between the authority constants and `PACKAGE_SURFACE` with no
        blank line, and nothing marks it as existing for `tests/testing.bzl`.
      - `goanalysis.go:1731`: `isAllPatternMembers(m.Members) || (len(m.Members) > 0
        && isAnyPatternMember(m.Members))` — the first disjunct is subsumed by
        the second.
      - `component.bzl:307`: `getattr(ctx.attr, "member_patterns", [])` defends
        against the absence of an attribute the same rule declares.
      - `app.go:277,289`: a second "// 7." and "// 8." after the first pair.
      - `component.bzl` module docstring and `_classify`'s docstring both cite
        design §5.3, the section Step 7 superseded.
      - `component.bzl:134` hardcodes `"is_stdlib": False` with no comment, at
        exactly the spot where docs/package-layout-schema.md §4 says a reader
        will wonder whether a heuristic was used. It is structurally correct here
        (the aspect closure enumerates targets only) and deserves to say so.
    suggested_action: |
      Sweep these while touching the surrounding files in the other remediation
      tasks; none justifies a commit of its own.
    source: built-in
    addressed_by: step12/task-06-test-and-comment-hygiene.code-task.md

