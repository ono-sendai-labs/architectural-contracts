  - element: "_check_component_roots removal (§8)"
    expected: |
      Deleted, unblocking a wrapper co-located with the library it wraps.
    actual: |
      Absent — no .bzl file in the tree mentions it.
    status: aligned
    files:
      - bazel_rules/go/private/component.bzl
    notes: ""

  - element: "Interface/members shape rule (§4.8, Q17a)"
    expected: |
      Declared style requires interface and permits members; PACKAGE_SURFACE
