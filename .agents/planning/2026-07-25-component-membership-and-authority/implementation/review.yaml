    actual: |
      InterfaceFileExclusion returned and rendered in app.go:260-269;
      report.go:80 emits the T7 wording byte-for-byte.
    status: aligned
    files:
      - go/internal/goanalysis/goanalysis.go
      - go/internal/report/report.go
      - go/cmd/arcc/app/app.go
    notes: ""

  - element: "Absorbed func-value escape (A5) and HIGHER_ORDER_BOUNDARY_CALL removal"
    expected: |
      SSA operand scan for absorbed *ssa.Function values, excluding the static
