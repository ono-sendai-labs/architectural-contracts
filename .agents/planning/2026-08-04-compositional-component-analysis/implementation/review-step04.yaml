findings:
  - id: F1
    severity: critical
    category: architecture
    file: go/internal/stdlibmap/generate.go
    line: 208
    title: Classifier hash does not fingerprint the classifier actually executed
    details: |
      sdkKeyProto hashes CanonicalClassifierText(GenerationClassifierRules()),
      but the `capslock.builtins` rule at generate.go:216-220 is only a prose
      statement that builtins are included. The minting rule similarly lists
      method names rather than hashing capslockadapter.GenerationClassifierText,
      even though NewGenerationClassifier loads that text together with
      Capslock's embedded builtin classifier at
      go/internal/capslockadapter/generation.go:21-41. Therefore changing a
      Capslock builtin classification (for example through a dependency update)
      can leave classifier_hash, SDKKey, and CacheKeyDigest unchanged. Native
      OpenCachedMap may then accept and reuse a map generated under different
      authority semantics, violating I2, N3, and Step 4's fail-closed objective.
      Existing tests only prove that arbitrary descriptor text or RuleVersion
      changes alter the hash and that listed minting methods appear in both
      representations; they do not tie the hash to the executed classifier.
    suggested_action: |
      Derive classifier_hash from a canonical fingerprint of every semantic
      classifier input actually executed: the exact project overlay text, the
      variable/unsafe rules, and either the Capslock builtin classifier content
      itself or a cryptographically stable pin to that exact content. Add a
      regression that changes each semantic input and observes a distinct
      classifier hash, SDK key, and native cache path/key mismatch.
    source: built-in
    addressed_by: step04/task-07-remediate-classifier-fingerprint.code-task.md

  - id: F2
    severity: suggestion
    category: doc_divergence
    file: go/internal/stdlibmap/stdlibmap.go
    line: 82
    title: PackageEntry comment omits public build-excluded packages
    details: |
      normalizeEntries at inventory.go:142-167 correctly retains a public
      package as importable:false when the explicit oracle reports that all of
      its files are excluded. PackageEntry still says non-importable occurs
      exactly for internal paths. This is the open suggestion from Task 05's
      final review and does not affect generation behavior.
    suggested_action: |
      Document both internal and target-build-excluded non-importable cases when
      this API comment is next touched.
    source: built-in

  - id: F3
    severity: suggestion
    category: doc_divergence
    file: justfile
    line: 38
    title: Self-check comment labels shell components pure
    details: |
      The self-check list includes goanalysis and artifactio, both of which are
      shell components with ambient-authority declarations, while its heading
      calls the full list pure. This is unchanged residue from Task 01's final
      review; it does not affect the self-check or Step 4 behavior.
    suggested_action: |
      Replace "pure components checked here" with "components checked here" or
      otherwise distinguish pure core components from shell components.
    source: built-in

