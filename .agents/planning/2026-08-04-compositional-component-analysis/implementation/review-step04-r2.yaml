findings:
  - id: F2
    severity: suggestion
    category: doc_divergence
    file: go/internal/stdlibmap/stdlibmap.go
    line: 82
    title: PackageEntry comment omits public build-excluded packages
    details: |
      PackageEntry still says non-importable means exactly an import path with
      an internal segment, while explicit-oracle reconciliation also retains a
      public package with all files excluded by target constraints as
      Importable:false. Current generation and tests implement the design
      correctly, so this remains deferrable documentation cleanup and does not
      warrant a remediation task.
    suggested_action: |
      Document both internal and target-build-excluded non-importable cases when
      this API comment is next touched.
    source: built-in

  - id: F3
    severity: suggestion
    category: doc_divergence
    file: justfile
    line: 38
    title: Self-check comment labels shell components pure
    details: |
      The self-check relationship comment calls the entire listed set pure even
      though goanalysis and artifactio are shell components with declared
      authority. The recipes and component checks are correct, so the wording
      remains harmless and deferrable rather than remediation-worthy.
    suggested_action: |
      Replace "pure components checked here" with "components checked here" or
      explicitly distinguish the pure core from checked shell components.
    source: built-in

