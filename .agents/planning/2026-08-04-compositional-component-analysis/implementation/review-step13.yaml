summary: |
  Step 13 adds substantial end-to-end evidence for member-only loading, the
  complete Bazel producer chain, restricted-sandbox execution, and canonical
  artifact bytes. Two load-bearing claims are not yet pinned by the tests they
  cite: the scan counter observes loaded-package shape rather than actual scan
  visitation, and the hermeticity audit explicitly exempts tool binaries found
  inside the stdlib export tree supplied to ArccCheck. The latter contradicts
  design invariant I5 and the N2 input allowlist, so remediation is required
  before the final step can close. All four task-level reviews are approved and
  have no unresolved findings; two remediation tasks were generated.

architecture:
  - element: Member-analysis scaling acceptance
    expected: |
      Fixed member source across depth and width 1/4/16 must produce exact
      evidence that typed reference scanning visits member work only, while
      export volume and loader cost remain visible residuals.
    actual: |
      The integration suite builds the required graph family, removes
      non-member source, checks export-backed package roles and stable member
      AST/type-info/output counts, and records separated phase timings. Its
      exact counters are snapshots of the loaded graph, not counters emitted
      by the reference scan itself; scan flatness therefore falls back to a
      factor-20-plus-20ms timing ceiling.
    status: partial
    files:
      - go/internal/goanalysis/member_analysis_scaling_integration_test.go
      - go/internal/goanalysis/member_analysis_scaling_fixture_test.go
      - go/internal/goanalysis/producer_chain_scaling_integration_test.go
    notes: |
      The current implementation is member-only, but the regression test does
      not directly fail if future scan code starts performing closure-shaped
      work that leaves the loaded graph and emitted edges unchanged.

  - element: Complete Bazel producer-chain scaling acceptance
    expected: |
      Measure ArccImportGraph, ArccLayout and ArccCheck for matching depth,
      width and direct-type-surface variants; keep action roles explicit and
      require conforming checked reports.
    actual: |
      Thirteen variants exercise the real producer topology. Action counts,
      source/export volumes, root and dependency loader observations, input
      roles, and pass verdicts are checked and recorded separately.
    status: aligned
    files:
      - bazel_rules/go/tests/testdata/producerchain/producer_chain.bzl
      - bazel_rules/go/tests/producer_chain_tests.bzl
      - go/internal/goanalysis/producer_chain_scaling_integration_test.go
    notes: |
      Task 02's final rework decodes both checked reports, requires PASS, and
      rejects CHECKED_FAIL dependency provenance, closing the earlier critical
      snapshot-without-verdict defect.

  - element: Restricted-sandbox hermeticity acceptance
    expected: |
      The real ArccImportGraph, ArccLayout, ArccCheck and ArccStdlibMap actions
      run with no network, no native cache, no host Go tool, and no Go
      toolchain binary among their declared inputs, as required by I5 and N2.
    actual: |
      The suite uses linux-sandbox, network denial, empty action environments,
      poison cache paths, isolated Bazel roots, execution-log/aquery audits,
      pass-verdict checks and one real map generation. ArccCheck nevertheless
      receives rules_go stdlib tree inputs whose expanded contents include
      pkg/tool entries, and the audit deliberately returns false for every
      forbidden-tool check beneath /stdlib_/.
    status: partial
    files:
      - bazel_rules/go/private/go_adapter.bzl
      - bazel_rules/go/private/component.bzl
      - go/internal/goanalysis/hermeticity_integration_test.go
    notes: |
      This may reflect an upstream provider granularity constraint, but it is
      not the contract the design records. Either the action input must be
      narrowed to export-only material or an explicit design decision must
      revise I5/N2; silently exempting the tree is not alignment.

  - element: Full-build artifact determinism acceptance
    expected: |
      Independent component-producer builds with identical complete inputs
      emit byte-identical reports and checked/asserted surfaces, while full
      lanes compare two real stdlib-map generations.
    actual: |
      Two isolated, reverse-order component graph builds compare raw bytes and
      SHA-256 digests for nontrivial reports and surfaces using the same pinned
      map input. Separate native and Bazel full lanes retain two independent
      real map generations and exact-byte comparisons.
    status: aligned
    files:
      - bazel_rules/go/tests/testdata/determinism/BUILD.bazel
      - go/internal/goanalysis/full_build_determinism_integration_test.go
      - go/internal/stdlibmap/generate_integration_test.go
      - justfile
    notes: |
      The lane split preserves the one-generation routine budget while still
      testing real map generation determinism outside routine CI.

  - element: Final acceptance evidence and host-import checklist
    expected: |
      Record baseline/final performance, scaling, hermeticity, determinism,
      routine-CI and full-lane evidence, then walk every next-import item with
      deferred work stated honestly.
    actual: |
      The research notes contain the requested tables, environment, commands,
      action counts, digests, limitations and item-by-item host-import
      disposition.
    status: aligned
    files:
      - .agents/planning/2026-08-04-compositional-component-analysis/research/current-analysis-pipeline.md
      - .agents/planning/2026-08-04-compositional-component-analysis/research/host-import-friction.md
    notes: ""

