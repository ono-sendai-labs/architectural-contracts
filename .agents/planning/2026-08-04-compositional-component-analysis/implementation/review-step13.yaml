findings:
  - id: F1
    severity: critical
    category: architecture
    file: go/internal/goanalysis/hermeticity_integration_test.go
    line: 1115
    title: Hermeticity audit exempts tool binaries in ArccCheck inputs
    details: |
      Design I5 states that Go/toolchain binaries are never Bazel action
      inputs, and N2 limits ArccCheck inputs to member source, manifests/layout,
      export data, dependency artifacts and the authority map. The upstream
      adapter passes rules_go's cache_dir/libs tree artifacts through
      go_stdlib_export_data (go_adapter.bzl:717-742) and the component action
      declares the whole descriptor input set (component.bzl:751-775). The
      execution-log audit acknowledges that the expanded /stdlib_/ tree
      contains pkg/tool entries at hermeticity_integration_test.go:1111-1114,
      then unconditionally exempts every path beneath /stdlib_/ at :1115-1116.
      Consequently the green hermeticity test proves that those binaries are
      not selected as Bazel tools or present in argv, but it does not prove the
      stronger no-toolchain-binary input property claimed by I5. This is the
      final acceptance step for a load-bearing hermeticity invariant, so the
      exemption cannot close the plan as written.
    suggested_action: |
      Supply ArccCheck with a stdlib descriptor whose declared/expanded inputs
      contain only package metadata and compiler export artifacts. Add an
      execution-log assertion that rejects /bin/go and /pkg/tool/ even beneath
      stdlib trees, and demonstrate that checks still pass with tool entries
      absent. If rules_go cannot expose such a set directly, add one shared,
      hermetic export-only projection producer rather than weakening I5.
    source: built-in
    addressed_by: .agents/tasks/2026-08-04-compositional-component-analysis/step13/task-05-remediate-stdlib-export-input-hermeticity.code-task.md

  - id: F2
    severity: important
    category: coverage
    file: go/internal/goanalysis/member_analysis_scaling_integration_test.go
    line: 187
    title: Scaling counters do not observe reference-scan visitation
    details: |
      The suite calls the production loader/scanner, but its exact workload is
      derived afterward from the packages.Load result
      (member_analysis_scaling_fixture_test.go:271-307). Those counters show
      that non-members have nil syntax/type-info and that emitted edges stay
      constant; they do not count which packages or nodes ScanReferences
      actually inspects. The only assertion on the scan phase itself is the
      factor-20-plus-20ms ceiling at
      member_analysis_scaling_integration_test.go:187-203, repeated for the
      Bazel observations at producer_chain_scaling_integration_test.go:1011-1019.
      With current medians in single-digit microseconds, closure-correlated
      bookkeeping across the bounded 65-package fixture can grow by orders of
      magnitude and still remain under 20ms. A regression that traverses the
      closure but leaves outputs unchanged would therefore pass the structural
      counters and likely pass the timing guard, so N1's no non-member typed
      scan property is inferred from adjacent state rather than asserted.
    suggested_action: |
      Add a package-private, nil-by-default scan observation seam that counts
      packages presented, member packages entered, syntax/type-info nodes
      walked, and any non-member scan attempt in ScanReferences (and the
      companion analysis-defeat scan if it shares the path). Assert exact,
      identical scan counters for every native and Bazel scaling row, including
      zero non-member entries. Keep timings observational/noise-tolerant, but
      make the member-only scaling guarantee depend on exact scan work rather
      than a permissive elapsed-time ceiling.
    source: built-in
    addressed_by: .agents/tasks/2026-08-04-compositional-component-analysis/step13/task-06-remediate-exact-scan-scaling-counters.code-task.md

  - id: F3
    severity: suggestion
    category: tests
    file: go/internal/goanalysis/full_build_determinism_integration_test.go
    line: 301
    title: Determinism fixture does not pin its intended failing verdict
    details: |
      The determinism fixture documents consumer_component as intentionally
      failing, and the semantic audit decodes its report, requires a multi-site
      finding, and checks dependency axes. Unlike dependency_component at
      lines 297-300, it never asserts consumerReport.Verdict == FAIL. A future
      policy or severity drift could turn the multi-site violation into a
      warning and let this deliberately nonconforming fixture pass unnoticed.
      This does not invalidate the byte-comparison result, but pinning the
      intended verdict would preserve the semantic strength motivated by Task
      02's earlier snapshot-without-verdict defect.
    suggested_action: |
      Require the consumer report verdict to be FAIL and require the expected
      multi-site finding to be a violation of the intended kind, rather than
      accepting a matching warning.
    source: built-in

