      - .agents/planning/2026-08-04-compositional-component-analysis/implementation/plan.md
      - .agents/tasks/2026-08-04-compositional-component-analysis/step06/task-06-bound-routine-stdlib-map-generation-cost.code-task.md
      - go/internal/teststdlibmap/pinned.go
