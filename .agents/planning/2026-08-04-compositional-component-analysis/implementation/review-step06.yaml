summary: |
  Step 6 successfully replaced the production SSA/VTA and check-time Capslock path,
  preserved the intentional source-backed loading boundary, and bounded routine
  stdlib-map generation; the complete `CGO_ENABLED=0 just ci` gate passes. One
  critical cross-task soundness gap remains: the map inventories unsafe's exported
  compiler builtins as UNANALYZED, but the reference scanner discards every
  `*types.Builtin`, so direct uses such as unsafe.Slice never reach classification.
  The residual five-component exemption set is unchanged and every TODO has an
  explicit owner in Step 7. Three remediation tasks cover the soundness defect, the
  remaining legacy stdlib predicate/documentation drift, and the deferred fail-closed
  artifact-publication matrix.

architecture:
  - element: Typed reference and import fact vocabulary
    expected: |
      Pure, canonical ReferenceEdge, ImportEdge, SourceSite, and MemberSet values
      shared between the member scanner and checker, with deterministic validation,
      ordering, and deduplication.
    actual: |
      The facts package provides the expected canonical DTOs and helpers without
      importing AST, go/packages, SSA, callgraph, or Capslock packages.
    status: aligned
    files:
      - go/internal/facts/refs.go
      - go/internal/facts/member.go
      - go/internal/facts/bypass.go
    notes: |
      Task 01's validation and ordering rework is present in the current code.

  - element: Member AST and types.Info reference scan with stdlib dispatch
    expected: |
      Every externally declared object named by member source, including unsafe's
      exported compiler builtins, becomes a canonical reference edge and is resolved
      through the total StdlibAuthority map.
    actual: |
      Ordinary funcs, methods, types, fields, vars, and consts are scanned and
      classified correctly, but externalObject unconditionally rejects
      `*types.Builtin`. The unsafe builtins have package `unsafe` and corresponding
      UNANALYZED records in the checked map, yet never become edges.
    status: partial
    files:
      - go/internal/goanalysis/refscan.go
      - go/internal/symbol/typesconv.go
      - go/internal/stdlibmap/inventory.go
      - go/internal/teststdlibmap/testdata/linux_amd64.stdlib-map.json
    notes: |
      This is implementation drift rather than justified evolution: the design
      explicitly calls out unsafe compiler builtins as fail-closed UNANALYZED roots.
      See F1.

  - element: Declaring-object dependency boundaries
    expected: |
      References are authorized against the object named by go/types; declared
      interfaces compare exact SymbolIDs, PACKAGE_SURFACE dependencies authorize
      owned packages, overlaps fail deterministically, and no implements closure is
      injected.
    actual: |
      ScanReferences, symbol.ExtractSurface, BoundaryIndex, and ClassifyEdges share
      the exact declaring-object model. Dependency overlap is rejected before lookup
      construction and the implements-closure workaround is absent.
    status: aligned
    files:
      - go/internal/goanalysis/refscan.go
      - go/internal/goanalysis/goanalysis.go
      - go/internal/checker/boundary.go
      - go/internal/checker/classify.go
      - go/internal/surface/derive.go
    notes: |
      The production Runner fixtures exercise interface dispatch, concrete access,
      and the reference-kind/import tables.

  - element: Map-exclusive standard-library classification
    expected: |
      Standard-library membership for production checking is defined by the authority
      map, and the legacy path predicates are deleted rather than consolidated.
    actual: |
      Checker classification uses only StdlibAuthority, but the production layout
      loader still exposes and calls hostpolicy.IsStdlibPath to classify and reject
      package provenance. This preserves a second, heuristic stdlib identity source
      in the check's loading path.
    status: drifted
    files:
      - go/internal/hostpolicy/hostpolicy.go
      - go/internal/packagelayout/packagelayout.go
      - go/internal/checker/classify.go
    notes: |
      The map-based checker is correct once facts exist, but the retained path
      predicate contradicts the Step 6 deletion inventory and can disagree before
      classification. See F2.

  - element: Analysis-defeating detection and aggregated reporting
    expected: |
      Member linkname, assembly, cgo, and map UNANALYZED observations fail closed by
      default; authority findings aggregate by capability/class with sorted sites,
      first-site evidence, class, and SDK key.
    actual: |
      ScanAnalysisDefeats, AggregateAuthority, report rendering, and canonical report
      encoding implement those rules and retain site-specific boundary findings.
    status: aligned
    files:
      - go/internal/goanalysis/defeatscan.go
      - go/internal/checker/aggregate.go
      - go/internal/report/report.go
      - go/internal/artifactio/report.go
    notes: |
      Focused tests cover linkname, selected and ignored assembly, cgo, strict/warn
      policy, deterministic aggregation, and artifact round trips.

  - element: Production cutover and legacy analyzer deletion
    expected: |
      Runner uses member facts, source-backed dependency interfaces, and a validated
      StdlibAuthority; no check constructs SSA/VTA or invokes Capslock, while
      Capslock remains generation-only.
    actual: |
      Runner.runCheck uses the typed scan/classifier and resolves the stdlib map before
      verdict formation. Check-time analyzer/prune DTOs and adapter entry points are
      gone; Capslock remains only behind stdlib-map generation.
    status: aligned
    files:
      - go/cmd/arcc/app/check.go
      - go/cmd/arcc/app/app.go
      - go/internal/checker/checker.go
      - go/internal/capslockadapter/generation.go
    notes: |
      Repository searches and the passing integration gate find no remaining
      check-time SSA, VTA, callgraph, or Capslock path.

  - element: Transitional Step 6 loading boundary
    expected: |
      NeedDeps and source-backed ResolveDependencyInterface remain until Steps 7 and
      8; Step 6 must not claim surface consumption or export-data-only loading.
    actual: |
      Both member and dependency loads retain NeedDeps and dependency interfaces are
      still resolved from source, with comments naming the Step 7/8 handoff.
    status: aligned
    files:
      - go/internal/goanalysis/goanalysis.go
    notes: |
      This intentional transition explains the measured approximately 53 percent CPU
      reduction rather than the Step 1 phase-sum projection.

  - element: Bounded routine stdlib-map validation topology
    expected: |
      Routine native tests and selfcheck use a fully key-validated pinned map; routine
      Bazel retains one default-configuration generation through a thin binary;
      replica and cross-configuration checks remain in an explicit full lane.
    actual: |
      The checked Linux/amd64 artifact, live classifier-key derivation, repository pin
      check, generation-only binary, default byte comparison, and explicit Go/Bazel
      full lanes are all present. Routine CI completes well inside N5.
    status: aligned
    files:
      - go/internal/teststdlibmap/pinned.go
      - go/cmd/arcc-stdlibmap/main.go
      - bazel_rules/go/private/stdlib_map.bzl
      - scripts/check-routine-stdlib-map-pin.sh
      - justfile
    notes: |
      The deferred architecture matrix, Bazel B2, and generator optimizations C1-C4
      are deliberately out of scope and are not findings.

  - element: Residual UNANALYZED exemptions and Step 7 ownership
    expected: |
      Exactly artifactio, manifest, goanalysis, capslockadapter, and csvtool parsecsv
      are exempted, each by a narrow TODO naming Step 7 work that removes it; Step 7
      must cover protobuf-runtime and x/tools wrappers plus the residual policy choice.
    actual: |
      The same five components remain exempted: four Bazel check tags and four native
      selfcheck comments cover the applicable gates, with capslockadapter native-only.
      Step 7 explicitly owns both foreign-member wrappers and the parsecsv/
      capslockadapter residual-UNANALYZED decision.
    status: aligned
    files:
      - justfile
      - go/internal/artifactio/BUILD.bazel
      - go/internal/manifest/BUILD.bazel
      - go/internal/goanalysis/BUILD.bazel
      - go/examples/csvtool/internal/parsecsv/BUILD.bazel
      - .agents/planning/2026-08-04-compositional-component-analysis/implementation/plan.md
    notes: |
      No additional Step 6 exemption marker was found. Existing unrelated manual
      fixture/check tags are not part of this adjudicated exemption set.

