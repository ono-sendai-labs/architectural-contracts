findings:
  - id: F1
    severity: critical
    category: architecture
    file: go/internal/goanalysis/refscan.go
    line: 207
    title: Unsafe compiler builtin references are silently discarded
    details: |
      externalObject returns false for every `*types.Builtin`. Universe builtins such
      as len should be ignored, but go/types assigns unsafe.Add, Alignof, Offsetof,
      Sizeof, Slice, SliceData, String, and StringData to package `unsafe`. The
      stdlib-map inventory deliberately persists each of those IDs as UNANALYZED
      (`go/internal/stdlibmap/inventory.go:245-258` and the checked artifact around
      its unsafe records), so dropping them prevents the fail-closed classification
      the design built those records to provide. symbol.FromObject and
      classifyingReference also reject/omit package-scoped Builtin objects, confirming
      that no later layer recovers the edge; a current artifactio selfcheck reports
      unsafe.Pointer sites but none of the unsafe.Slice/StringData calls present in
      generated member source.
    suggested_action: |
      Distinguish universe builtins from package-scoped unsafe builtins. Convert the
      latter to canonical top-level SymbolIDs, emit them as function references, and
      add typed-scan plus real-check regressions proving unsafe builtin calls reach
      the map's UNANALYZED policy path while len/cap remain ignored.
    source: built-in
    addressed_by: .agents/tasks/2026-08-04-compositional-component-analysis/step06/task-07-remediate-unsafe-builtin-reference-scanning.code-task.md

  - id: F2
    severity: important
    category: architecture
    file: go/internal/hostpolicy/hostpolicy.go
    line: 117
    title: Legacy stdlib path heuristic remains in the loading path
    details: |
      Step 6 requires the stdlib map to be the single membership definition and lists
      the old predicates for deletion. Checker classification complies, but
      hostpolicy.IsStdlibPath remains public and packagelayout calls it while parsing
      every production layout (`packagelayout.go:781-793` and :820-829). A heuristic
      or host override can therefore disagree with declared/map provenance and stop
      the check before the map-based dispatch, preserving the independently drifting
      identity source the cutover was intended to remove.
    suggested_action: |
      Remove IsStdlibPath and route layout loading/resource resolution through
      explicit layout/SDK provenance, reserving StdlibAuthority membership for the
      check decision. Update affected host-policy contracts, tests, BUILD metadata,
      and comments, with regressions for dotless non-stdlib paths and explicit stdlib
      layout entries.
    source: built-in
    addressed_by: .agents/tasks/2026-08-04-compositional-component-analysis/step06/task-08-remove-legacy-stdlib-heuristics-and-refresh-cutover-docs.code-task.md

  - id: F3
    severity: important
    category: coverage
    file: go/cmd/arcc/app/check_integration_test.go
    line: 201
    title: Fail-closed map matrix does not prove no artifact publication
    details: |
      The corrupt and missing-map legs reuse report and surface paths populated by a
      successful invocation, then assert only exit 2 and diagnostics. The fresh
      incomplete-key case proves absence for one failure mode and runCheck resolves
      the map before publication, so no bypass was observed; however AC2 covers
      missing, corrupt, target-key, classifier, format, and inventory faults and the
      end-to-end test does not independently guard publication ordering for that
      matrix. This is the highest-value unresolved item from task 05's six deferred
      findings.
    suggested_action: |
      Drive every fail-closed map fault through the production Runner with fresh
      output destinations and assert exit 2, actionable diagnostics, and absence of
      both report and surface artifacts, without invoking whole-SDK generation.
    source: built-in
    addressed_by: .agents/tasks/2026-08-04-compositional-component-analysis/step06/task-09-complete-fail-closed-artifact-publication-matrix.code-task.md

  - id: F4
    severity: suggestion
    category: doc_divergence
    file: go/examples/csvtool/app/app.go
    line: 9
    title: Cutover documentation still describes Capslock traversal pruning
    details: |
      Task 06 fixed the deferred per-package BuildAuthorityMap and full-generation
      comments, but three other task-05 deferrals remain at
      `go/internal/goanalysis/fixture_test.go:552`,
      `go/internal/goanalysis/goanalysis.go:72`, and
      `go/internal/stdlibmap/component.textproto:5`. A wider inspection also finds
      stale live-example text at `go/examples/csvtool/app/app.go:9-23`,
      `go/examples/csvtool/csvfile/csvfile.go:8-11`, and
      `go/examples/csvtool/app/BUILD.bazel:15-18`, plus README.md:482's claim that
      declarations come from Capslock's classified set. These comments describe the
      removed mechanism and one says the behavior is still pending a long-completed
      step.
    suggested_action: |
      Rewrite the affected contracts and example documentation in terms of typed
      reference/import edges, structural component boundaries, and stdlib-map
      classification. Remove the obsolete draft note and call-edge wording.
    source: built-in
    addressed_by: .agents/tasks/2026-08-04-compositional-component-analysis/step06/task-08-remove-legacy-stdlib-heuristics-and-refresh-cutover-docs.code-task.md

  - id: F5
    severity: nit
    category: consistency
    file: go/internal/goanalysis/fixture_test.go
    line: 621
    title: Fixture 6 repeats the same import-presence loop
    details: |
      TestFixture6_ImportTable checks every path in `scanned` at lines 612-616 and
      repeats the identical loop at lines 621-625. The following no-reference loop is
      the assertion that establishes the import-only fixture shape. This is the sole
      remaining suggestion from task 03 and has no effect on behavior or coverage.
    suggested_action: |
      Delete either duplicate loop during opportunistic cleanup; no remediation task
      is warranted for this nit.
    source: built-in

