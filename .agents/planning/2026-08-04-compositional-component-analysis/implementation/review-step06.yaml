summary: |
  The confirmation pass closes prior findings F1 through F4: unsafe package
  builtins now reach the total map, loading uses structural SDK provenance,
  every required map failure proves non-publication, and the cutover docs are
  current. The universe/package split is complete for Go's predeclared objects,
  not merely the tested examples: universe-scope objects have no package while
  every exported unsafe intrinsic is package-scoped and mapped UNANALYZED.
  The five AC8b exemptions, their Step 7 owners, manual seams, and refreshed
  evidence counts remain exact. Prior F5 is still present as a harmless duplicate
  test assertion and still does not warrant remediation; the full routine gate
  passes and the remediation introduced no blocking or important issue.

architecture:
  - element: Typed reference and import fact vocabulary
    expected: |
      Pure, canonical ReferenceEdge, ImportEdge, SourceSite, BypassObservation,
      and MemberSet values shared between member analysis and the checker, with
      deterministic validation, ordering, and deduplication.
    actual: |
      The facts package provides the expected canonical DTOs and helpers without
      importing AST, go/packages, SSA, callgraph, or Capslock packages.
    status: aligned
    files:
      - go/internal/facts/refs.go
      - go/internal/facts/member.go
      - go/internal/facts/bypass.go
    notes: |
      Task 01's validation and ordering repairs remain present and all final
      task-level reviews are approved.

  - element: Member AST and types.Info scan, including compiler builtins
    expected: |
      Every externally declared object named by member source becomes a canonical
      reference edge. Universe objects remain non-edges, while unsafe's exported
      compiler builtins are package-scoped RefFunc edges resolved through the map.
    actual: |
      externalObject excludes objects exactly when Pkg() is nil, FromObject
      converts package-scoped exported Builtin objects, and classifyingReference
      emits them as RefFunc. Typed tests cover all eight unsafe builtins and the
      production Runner proves unsafe.Sizeof and unsafe.Slice reach the normal
      AnalysisDefeating policy path.
    status: aligned
    files:
      - go/internal/goanalysis/refscan.go
      - go/internal/goanalysis/refscan_test.go
      - go/internal/symbol/typesconv.go
      - go/internal/symbol/typesconv_test.go
      - go/cmd/arcc/app/check_integration_test.go
    notes: |
      Go 1.26's go/types universe construction assigns nil packages to all
      predeclared universe types, constants, nil, builtins, error/comparable, and
      test-only assert/trace objects. Its exported unsafe intrinsics are instead
      inserted into types.Unsafe with package ownership; unsafe.Pointer follows
      the same package-owned path as a TypeName. Thus the Pkg() split covers the
      complete predeclared set rather than relying on a name allowlist.

  - element: Total unsafe classification in the pinned authority map
    expected: |
      Every exported unsafe compiler intrinsic and unsafe.Pointer has an explicit
      fail-closed terminal classification in the map.
    actual: |
      The checked artifact contains unsafe.Add, Alignof, Offsetof, Sizeof, Slice,
      SliceData, String, StringData, and Pointer, each classified UNANALYZED with
      project-override provenance. Scanner observations use ordinary
      SymbolAuthority lookup with no unsafe-specific checker shortcut.
    status: aligned
    files:
      - go/internal/stdlibmap/inventory.go
      - go/internal/stdlibmap/generate.go
      - go/internal/teststdlibmap/testdata/linux_amd64.stdlib-map.json
      - go/internal/checker/classify.go
    notes: |
      This closes prior critical finding F1 without weakening the map or policy.

  - element: Declaring-object dependency boundaries
    expected: |
      References are authorized against the object named by go/types; declared
      interfaces compare exact SymbolIDs, PACKAGE_SURFACE dependencies authorize
      owned packages, overlaps fail deterministically, and no implements closure
      is injected.
    actual: |
      ScanReferences, symbol.ExtractSurface, BoundaryIndex, and ClassifyEdges share
      the exact declaring-object model. Dependency overlap is rejected before
      lookup construction and the implements-closure workaround is absent.
    status: aligned
    files:
      - go/internal/goanalysis/refscan.go
      - go/internal/goanalysis/goanalysis.go
      - go/internal/checker/boundary.go
      - go/internal/checker/classify.go
      - go/internal/surface/derive.go
    notes: |
      The production Runner fixtures exercise interface dispatch, concrete access,
      the reference-kind table, and the import table.

  - element: Map-exclusive stdlib classification and structural layout provenance
    expected: |
      The authority map is the only check-time definition of standard-library
      membership. Layout file resolution may use emitter provenance and validated
      SDK discovery, but must not infer stdlib identity from import-path spelling.
    actual: |
      hostpolicy.IsStdlibPath is absent. Checker dispatch uses only
      StdlibAuthority, while Layout.IsStdlibPackage reads validation-owned
      is_stdlib/SDK-discovery indexes. Repository searches find no equivalent
      dot-in-first-segment or dotless-path heuristic in production Go or Starlark.
    status: aligned
    files:
      - go/internal/hostpolicy/hostpolicy.go
      - go/internal/packagelayout/packagelayout.go
      - go/internal/checker/classify.go
      - bazel_rules/go/private/component.bzl
    notes: |
      Dotless non-stdlib, explicit SDK, host-canonicalization, and missing-data
      regressions close prior important finding F2. SDK tree discovery and
      toolchain package-list reconciliation are structural generation/loading
      mechanisms, not import-path-shape classifiers.

  - element: Analysis-defeating detection and aggregated reporting
    expected: |
      Member linkname, assembly, cgo, and map UNANALYZED observations fail closed
      by default; authority findings aggregate by capability/class with sorted
      sites, first-site evidence, class, and SDK key.
    actual: |
      ScanAnalysisDefeats, AggregateAuthority, report rendering, and canonical
      report encoding implement those rules and retain site-specific boundary
      findings.
    status: aligned
    files:
      - go/internal/goanalysis/defeatscan.go
      - go/internal/checker/aggregate.go
      - go/internal/report/report.go
      - go/internal/artifactio/report.go
    notes: |
      The unsafe repair feeds this existing policy path rather than introducing a
      second classification mechanism.

  - element: Production cutover and fail-closed artifact publication
    expected: |
      Runner uses member typed facts, source-backed dependency interfaces, and a
      validated StdlibAuthority. Any missing, malformed, target-key,
      classifier-hash, format-version, or inventory fault exits 2 before a report
      or surface is published.
    actual: |
      Runner resolves the map before verdict formation and publication. Six
      independent production-Runner rows each create distinct fresh output paths,
      assert absence before invocation, and assert both remain absent afterward.
    status: aligned
    files:
      - go/cmd/arcc/app/check.go
      - go/cmd/arcc/app/check_integration_test.go
      - go/internal/artifactio/stdlibmap.go
      - go/internal/artifactio/stdlibmapreader.go
    notes: |
      This closes prior important finding F3 and the deferred Task 05 coverage
      residue without invoking whole-SDK generation.

  - element: Transitional Step 6 loading boundary
    expected: |
      NeedDeps and source-backed ResolveDependencyInterface remain until Steps 7
      and 8; Step 6 must not claim surface consumption or export-data-only loading.
    actual: |
      Both member and dependency loads retain NeedDeps and dependency interfaces
      are still resolved from source, with comments naming the Step 7/8 handoff.
    status: aligned
    files:
      - go/internal/goanalysis/goanalysis.go
    notes: |
      Surface consumption, export-data loading, and dependency-source removal are
      deliberately absent and are not Step 6 gaps.

  - element: Bounded routine stdlib-map topology and repaired action-count contract
    expected: |
      Routine native tests and selfcheck use a fully key-validated pinned map;
      routine Bazel has exactly one default-configuration map action, may retain
      non-default actions pulled by routine analysis-time-failure fixtures, and
      satisfies N5's five-minute warm wall-clock and cold-generation bounds.
    actual: |
      The pinned map, live classifier-key derivation, repository pin check, thin
