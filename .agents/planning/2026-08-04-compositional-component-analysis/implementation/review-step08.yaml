findings:
  - id: F1
    severity: critical
    category: architecture
    file: bazel_rules/go/private/component.bzl
    line: 142
    title: Bazel pruning drops member files required by defeat scanning
    details: |
      `_layout_content` emits only `.go` sources as GoFiles/CompiledGoFiles
      (lines 142-157), and final action-input derivation again accepts only
      `.go` files (lines 898-905). ValidateAndResolveForMemberOnly filters
      excluded root files out of both lists at packagelayout.go:1814-1821 but
      never retains them as IgnoredFiles. ScanAnalysisDefeats can observe only
      GoFiles, IgnoredFiles, and OtherFiles (defeatscan.go:62-109), so a Bazel
      member's `.s` file or a build-excluded `.go` file containing linkname/cgo
      syntax disappears before the fail-closed scan. This violates DR-11 and
      Task 06 requirements 2-3/acceptance criterion 2 and can let a checked
      component pass despite an analysis bypass; the current tests cover the
      scanner only with native go-list metadata and contain no Bazel seam fixture.
    suggested_action: |
      Preserve declared member assembly and excluded Go files in layout roles
      and ArccCheck inputs, retain excluded files as IgnoredFiles without
      type-checking them, keep all non-member source pruned, and add an executing
      Bazel fixture that pins strict/WARN findings for assembly, linkname, and cgo.
    source: built-in
    addressed_by: .agents/tasks/2026-08-04-compositional-component-analysis/step08/task-07-restore-bazel-member-defeat-scan-inputs.code-task.md

  - id: F2
    severity: important
    category: doc_divergence
    file: .agents/planning/2026-08-04-compositional-component-analysis/design/detailed-design.md
    line: 43
    title: Repaired topology contradicts closure-independence claims
    details: |
      The new build-topology bullet at lines 258-264 explicitly permits an
      auxiliary metadata action to read non-member source, and
      component.bzl:246-309 registers one ArccImportGraph action per checked
      component over its ordinary non-root source closure. That decision is
      hermetic and correctness-sound, but it contradicts the unchanged overview
      at lines 43-49 (only member source is scanned and only export files remain
      closure-shaped) and composition text at lines 372-374 (nothing re-reads or
      parses dependency source). The discrepancy also risks a misleading Step 13
      performance result if only ArccCheck loader time is measured and the
      per-component projection cost is omitted.
    suggested_action: |
      Keep the approved auxiliary topology, but update the overview, N1/N2
      boundary explanation, composition section, and performance acceptance to
      disclose and measure the cached lexical non-member import projection.
    source: built-in
    addressed_by: .agents/tasks/2026-08-04-compositional-component-analysis/step08/task-08-reconcile-auxiliary-projection-design-claims.code-task.md

  - id: F3
    severity: suggestion
    category: consistency
    file: bazel_rules/go/tests/aspect_tests.bzl
    line: 138
    title: Fixture comments describe the pre-split embed graph
    details: |
      The normal probe now uses the direct core fixture, while the actual embed
      edge is under the separate embed probe. Comments at lines 138-140 and
      185-186 still attribute the normal closure shape to embed folding and say
      core inherits extradep from an embedded library. Assertions are correct,
      but the comments can mislead future fixture changes.
    suggested_action: |
      Rewrite the comments for the direct core fixture and point embed-specific
      reasoning at the dedicated embed probe.
    source: built-in

  - id: F4
    severity: suggestion
    category: coverage
    file: bazel_rules/go/tests/stdlib_export_data_tests.bzl
    line: 36
    title: Positive stdlib seam test omits three identity fields
    details: |
      The successful descriptor test directly asserts GOOS, GOARCH, and cgo but
      not build tags, normalized toolchain version, or GOEXPERIMENT. Production
      comparison covers all six fields and mismatch coverage exists, so this is
      non-blocking residue rather than a correctness gap.
    suggested_action: |
      Assert all successful target identity fields or add focused transitioned
      fixtures for tags, toolchain version, and GOEXPERIMENT.
    source: built-in

  - id: F5
    severity: nit
    category: style
    file: bazel_rules/go/private/component.bzl
    line: 38
    title: Starlark load entry uses a tab
    details: |
      The go_build_platform load entry begins with a tab while the surrounding
      entries use four spaces. Bazel behavior is unaffected.
    suggested_action: |
      Replace the tab with the surrounding indentation when this file is next
      touched.
    source: built-in

