findings:
  - id: F2
    severity: suggestion
    category: dead_code
    file: bazel_rules/go/private/go_adapter.bzl
    line: 371
    title: Legacy SDK aliases remain as bounded compatibility surface
    details: |
      The first pass observed that go_sdk_srcs, go_stdlib_toolchain,
      go_target_mode, and the private _stdlib_mode_mismatches alias have no
      in-tree consumers. The three externally loadable functions now explicitly
      identify themselves as compatibility accessors and delegate to the
      canonical source or identity contracts; all generic consumers use the new
      three-seam surface. Keeping them through Step 12 is acceptable: they do not
      affect hook inertness, package topology, action inputs, artifacts, or
      verdicts, while deleting host-loadable adapter names requires an explicit
      compatibility-policy decision. The unused private comparison alias is
      harmless cleanup residue and does not obscure any call path in practice.
    suggested_action: |
      Revisit the four aliases during a deliberate adapter API cleanup. Remove
      the private alias then; for the externally loadable accessors, either
      publish and honor a deprecation window or remove them as an intentional
      compatibility break.
    source: built-in

