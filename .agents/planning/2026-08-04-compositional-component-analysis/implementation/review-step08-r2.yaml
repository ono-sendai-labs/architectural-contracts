findings:
  - id: F6
    severity: important
    category: doc_divergence
    file: docs/package-layout-schema.md
    line: 260
    title: Exact ArccCheck inventory omits fail-closed member file roles
    details: |
      docs/package-layout-schema.md:178-205 describes member roots only through
      selected GoFiles/CompiledGoFiles, and line 260 says the checked action declares
      exactly selected member .go files. The Step 8 evidence repeats target-selected
      .go files at step08-input-pruning.md:8 and calls the analysis assertion an exact
      member-only .go set at line 25. After F1, component.bzl:142-172 emits non-Go
      member files as OtherFiles, lines 909-916 stage all declared member sources, and
      packagelayout.go:1800-1837 preserves assembly and moves excluded Go into
      IgnoredFiles. The implementation and design's generic "member sources" wording
      are correct, but the public emitter contract and evidence can direct a future
      implementation back to the fail-open that F1 fixed.
    suggested_action: |
      Document the selected Go, build-excluded Go/ignored, and assembly/other member
      roles in the package-layout schema; correct the exact ArccCheck allowlist and the
      Step 8 research inventory/test description; and preserve the explicit exclusion
      of every non-member and SDK source input.
    source: built-in
    addressed_by: .agents/tasks/2026-08-04-compositional-component-analysis/step08/task-09-reconcile-member-file-role-documentation.code-task.md

  - id: F3
    severity: suggestion
    category: consistency
    file: bazel_rules/go/tests/aspect_tests.bzl
    line: 138
    title: Fixture comments describe the pre-split embed graph
    details: |
      The normal probe uses the direct core fixture, while the real embed edge is under
      the separate embed probe. Comments at lines 138-140 and 185-186 still attribute
      the normal closure to embed folding and inherited dependencies. Assertions remain
      correct, so this deliberately deferred item is unchanged from the first report.
    suggested_action: |
      Rewrite the comments for the direct core fixture and point embed-specific
      reasoning at the dedicated embed probe when this test is next maintained.
    source: built-in

  - id: F4
    severity: suggestion
    category: coverage
    file: bazel_rules/go/tests/stdlib_export_data_tests.bzl
    line: 36
    title: Positive stdlib seam test omits three identity fields
    details: |
      The successful descriptor test directly asserts GOOS, GOARCH, and cgo but not
      build tags, normalized toolchain version, or GOEXPERIMENT. Production comparison
      covers all six fields and mismatch coverage exists, so this deliberately deferred
      item remains non-blocking.
    suggested_action: |
      Assert all successful target identity fields or add focused transitioned fixtures
      for tags, toolchain version, and GOEXPERIMENT when extending this seam.
    source: built-in

  - id: F5
    severity: nit
    category: style
    file: bazel_rules/go/private/component.bzl
    line: 38
    title: Starlark load entry uses a tab
    details: |
      The go_build_platform load entry still begins with a tab while surrounding entries
      use spaces. Bazel behavior is unaffected; this deliberately deferred nit remains
      unchanged from the first report.
    suggested_action: |
      Replace the tab with surrounding indentation when this file is next touched.
    source: built-in

