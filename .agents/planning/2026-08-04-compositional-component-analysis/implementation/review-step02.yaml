findings:
  - id: F1
    severity: suggestion
    category: doc_divergence
    file: go/internal/hostpolicy/hostpolicy.go
    line: 30
    title: Source comment still names removed membership patterns
    details: |
      CanonicalizePath's input list still includes "membership patterns" even
      though Step 2 removed manifest pattern membership and all Go-side matching.
      The remaining Starlark import_path_patterns mechanism belongs only to
      infrastructure auto-attachment, so this phrase can mislead maintainers
      about the Go hook's current callers. This is the same non-blocking residue
      recorded by the final Task 3 review.
    suggested_action: |
      Replace "membership patterns" with "literal member import paths" or a
      similarly current description when this comment is next touched.
    source: built-in

