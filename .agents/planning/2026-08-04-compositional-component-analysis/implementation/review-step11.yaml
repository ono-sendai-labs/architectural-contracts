      so the Step 11 contract is covered and every acceptance criterion passed.
      The task review and merge-request commit description deliberately retain
      this as suggestion-severity residue: co-locating the text-facing checks
      would improve auditability but is not an implementation or architecture
      gap, so no remediation task is generated.
    suggested_action: |
      If the fixture is revisited, add a CLI-facing assertion over this same
      dependent edge that requires untrusted and rejects certified or declared
      status wording while retaining the current JSON checks.
