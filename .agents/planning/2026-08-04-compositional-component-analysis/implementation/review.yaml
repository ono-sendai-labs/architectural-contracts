summary: |
  The completed thirteen-step implementation aligns with the design's major
  architectural elements, and no critical defect or escalation decision needs
  reversal. Three focused remediation tasks should restore the documented lint
  gate, align final schema and handoff documentation, and close two inexpensive
  acceptance-fixture gaps. The stale .agents/summary knowledge base is recorded
  as important documentation debt but, by owner decision, will be regenerated
  separately with the codebase-summary skill after Step 14. Legacy SDK adapter
  aliases remain intentionally supported while an external monorepo migrates.
  The remaining carried aspect-test comment concern was re-derived against the
  current closure behavior and is closed as accurate.

architecture:
  - element: Persisted schemas, symbol grammar, and authority lattice
    expected: |
      One canonical SymbolID grammar and versioned, deterministic schemas for
      surfaces and standard-library maps, including structural UNKNOWN authority.
    actual: |
      Schema-owned capability vocabulary, canonical artifact I/O, exact symbol
      extraction, and the absorbing UNKNOWN lattice are shared by producers and
      consumers with fail-closed validation.
    status: aligned
    files:
      - proto/archcontracts/v1/component.proto
      - proto/archcontracts/v1/surface.proto
      - proto/archcontracts/v1/stdlibmap.proto
      - go/internal/schema
      - go/internal/symbol
      - go/internal/artifactio
    notes: |
      The implementation is aligned. The digest field's prose does not yet
      distinguish checked surfaces from asserted surfaces; finding F3 addresses
      that documentation defect without changing the schema or behavior.

  - element: Total standard-library authority map
    expected: |
      A total, SDK-keyed, fail-closed authority map generated once per target
      configuration, with Capslock retained only in the generation path.
    actual: |
      The generator inventories every supported package and symbol, preserves
      UNANALYZED classifications, uses an independently fingerprinted classifier,
      and supplies native cached and hermetic Bazel artifacts.
    status: aligned
    files:
      - go/internal/stdlibmap
      - go/internal/stdlibauthority
      - go/internal/capslockadapter
      - bazel_rules/go/private/stdlib_map.bzl
    notes: |
      I5's layout-driver generation and the deliberate cgo-enabled Bazel
      rejection are coherent proof-of-concept choices and should not be reverted.

  - element: Member reference analysis and pure checker
    expected: |
      Replace check-time SSA, VTA, and Capslock with AST/types.Info reference and
      import facts over member packages, classified by a pure core.
    actual: |
      ScanReferences and ScanAnalysisDefeats operate only on member inputs;
      checker classification uses exact declaring objects, dependency surfaces,
      and the StdlibAuthority port with deterministic, fail-closed outcomes.
    status: aligned
    files:
      - go/internal/goanalysis/refscan.go
      - go/internal/goanalysis/defeatscan.go
      - go/internal/checker
      - go/internal/facts
    notes: ""

  - element: Compositional surfaces and dependency status
    expected: |
      Checked and asserted producers publish structurally distinct surfaces;
      dependents consume surfaces and reports with independent provenance,
      freshness, and authority axes.
    actual: |
      Checked actions publish report/surface pairs, asserted UNKNOWN components
      publish package-level surfaces with no report, and native/Bazel resolvers
      validate version, namespace, SDK identity, freshness, and overlap.
    status: aligned
    files:
      - go/internal/surface
      - go/internal/goanalysis/surface_resolver.go
      - go/internal/report
      - bazel_rules/go/private/component.bzl
      - bazel_rules/providers.bzl
    notes: |
      I6's package-level asserted surface is an honest non-analysis claim. The
      user-visible untrusted rendering has unit/native coverage; finding F4 adds
      the missing assertion at the persisted Bazel fixture seam.

  - element: Member-only export-data loading and Bazel producer topology
    expected: |
      ArccCheck receives only member sources and declared artifact inputs, with
      non-member types supplied from export data and no toolchain executable.
    actual: |
      ArccCheck uses final layouts and projected export artifacts without
      non-member source or toolchain binaries. A separate hermetic
      ArccImportGraph action lexically projects exact imports from target-selected
      ordinary source because the pinned rules_go provider lacks that graph.
    status: aligned
    files:
      - go/internal/packagelayout
      - go/internal/goanalysis/goanalysis.go
      - bazel_rules/go/private/aspect.bzl
      - bazel_rules/go/private/component.bzl
      - bazel_rules/go/private/go_adapter.bzl
    notes: |
      The auxiliary projection was an explicit, measured design amendment. It is
      acceptable for the MVP but remains a production-handoff item because its
      source inputs and work are closure-shaped.

  - element: Analysis-defeating policy and UNKNOWN adoption
    expected: |
      Analysis-defeating constructs fail closed by default, explicit WARN keeps
      limitations visible, and unanalysed components remain structurally UNKNOWN.
    actual: |
      STRICT is the default; WARN downgrades only AnalysisDefeating findings while
      retaining sites and evidence. UNKNOWN is package-level, report-free, and
      rendered untrusted at dependency boundaries.
    status: aligned
    files:
      - proto/archcontracts/v1/component.proto
      - go/internal/manifest/authority.go
      - go/internal/checker/aggregate.go
      - bazel_rules/go/private/component.bzl
    notes: |
      Component-wide WARN is a reversible MVP policy carrier, not a classifier
      override. A production implementation should prefer narrower exceptions or
      improved classifier coverage when evidence permits.

  - element: Host adapter contract
    expected: |
      Host-neutral runtime injection, SDK source, SDK export-data, target identity,
      and namespace seams with inert upstream defaults.
    actual: |
      The canonical seams are isolated in go_adapter.bzl and generic rules consume
      only their host-neutral descriptors. Runtime injection merges before
      validation and infra attachment.
    status: aligned
    files:
      - bazel_rules/go/private/go_adapter.bzl
      - bazel_rules/go/private/component.bzl
      - go/internal/hostpolicy/hostpolicy.go
    notes: |
      Four unused-in-repository legacy accessors remain as documented compatibility
      aliases. The owner confirmed an external monorepo consumer; they are retained
      until that consumer migrates to the canonical three-seam SDK contract.

  - element: Hermeticity, scaling, and deterministic acceptance
    expected: |
      Exact structural evidence must prove member-only scanning, hermetic action
      inputs, bounded routine generation, and byte-identical persisted artifacts.
    actual: |
      Native and Bazel scaling suites pin scanner-internal work, restricted sandbox
      tests audit expanded action inputs and cache/network isolation, and independent
      builds compare report, surface, and map bytes.
    status: aligned
    files:
      - go/internal/goanalysis/member_analysis_scaling_integration_test.go
      - go/internal/goanalysis/producer_chain_scaling_integration_test.go
      - go/internal/goanalysis/hermeticity_integration_test.go
      - go/internal/goanalysis/full_build_determinism_integration_test.go
      - .agents/planning/2026-08-04-compositional-component-analysis/research/current-analysis-pipeline.md
    notes: |
      Finding F6 concerns the semantic intent of one fixture, not the established
      exact-byte determinism property.

  - element: Routine validation topology
    expected: |
      just ci is the complete pre-commit gate and the GitHub Go lane mirrors its Go
      checks, including generation, lint, build, unit/integration tests, and bounded
      stdlib-map validation.
    actual: |
      The generation, build, test, integration, selfcheck, and Bazel lanes pass, but
      both just ci and the GitHub Go job reach ci-go without invoking the existing
      lint recipe.
    status: partial
    files:
      - justfile
      - .github/workflows/ci.yml
      - AGENTS.md
      - README.md
    notes: |
      just lint passes independently. Finding F1 restores the promised aggregate
      gate so future vet or formatting failures cannot bypass both entry points.

