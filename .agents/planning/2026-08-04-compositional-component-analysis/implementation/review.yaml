findings:
  - id: F1
    severity: important
    category: consistency
    file: justfile
    line: 163
    title: Aggregate CI no longer runs the documented lint gate
    details: |
      ci-go runs gen, build, unit/integration tests, the stdlib-map pin, and the
      staging test, while ci adds generated-file, selfcheck, and Bazel gates; neither
      depends on lint. GitHub's Go job calls ci-go, so go vet and gofmt can be skipped
      by both advertised aggregate entry points even though AGENTS.md requires just ci
      before every commit and README.md says that command lints. The current tree is
      clean because just lint passes when invoked separately, but the process guard is
      absent.
    suggested_action: |
      Add lint to the shared aggregate Go recipe so local just ci and GitHub ci-go
      execute the same vet/format gate, and verify it through dry-run command expansion
      plus the real validation commands.
    source: built-in
    addressed_by: step14/task-01-restore-lint-to-ci-gates.code-task.md

  - id: F2
    severity: important
    category: doc_divergence
    file: .agents/summary/index.md
    line: 27
    title: Generated knowledge base describes the removed analysis architecture
    details: |
      The summary identifies its old baseline, but its primary orientation and
      companion documents still teach check-time SSA/VTA/Capslock, absorbed
      dependencies, old component counts, the former CLI, and obsolete provider/data
      models. It is therefore unsafe as an implementation knowledge base after a plan
      that replaced those exact surfaces. The repository owner explicitly excluded
      this generated artifact from Step 14 and will refresh it out of band with the
      dedicated codebase-summary skill after remediation completes.
    suggested_action: |
      After Step 14, run the codebase-summary skill in update mode and review its
      architecture, interface, workflow, dependency, data-model, and coding-style
      output against the final implementation.
    source: built-in

  - id: F3
    severity: important
    category: doc_divergence
    file: proto/archcontracts/v1/surface.proto
    line: 78
    title: Final schema and handoff documentation retain stale contracts
    details: |
      SurfaceManifest.digest is documented as a source-derived digest for every
      surface, while asserted UNKNOWN surfaces intentionally carry no derived content
      and an empty digest. The detailed design still reports implementation in progress;
      hostpolicy and stdlib-map comments contain future/step placeholders; PackageEntry
      describes only internal-package exclusion; and README's limitations omit a
      concise production handoff for the accepted component-wide WARN policy and
      closure-shaped ArccImportGraph projection. These do not change correct behavior,
      but they materially impair using this MVP as the basis of a permanent
      implementation.
    suggested_action: |
      Reconcile the proto/generated comments, design final status and baseline wording,
      source comments, and README limitations with the implemented checked/asserted
      semantics. State the two accepted prototype debts without changing either
      behavior.
    source: built-in
    addressed_by: step14/task-02-align-final-implementation-documentation.code-task.md

  - id: F4
    severity: suggestion
    category: coverage
    file: bazel_rules/go/tests/testdata/reportboundary/consumer/BUILD.bazel
    line: 37
    title: UNKNOWN boundary fixture checks JSON but not rendered status text
    details: |
      The end-to-end Bazel fixture verifies ASSERTED provenance and UNKNOWN authority
      in persisted JSON, while separate Go-level renderer tests cover the word
      untrusted. It does not bind those layers by requiring this actual dependency edge
      to render untrusted and reject certified/declared wording.
    suggested_action: |
      Add a focused end-to-end assertion over production-rendered text for this
      fixture without introducing a second ArccCheck action or changing report
      production semantics.
    source: built-in
    addressed_by: step14/task-03-pin-acceptance-fixture-semantics.code-task.md

  - id: F5
    severity: suggestion
    category: dead_code
    file: bazel_rules/go/private/go_adapter.bzl
    line: 372
    title: Legacy SDK accessors remain beside the canonical adapter seams
    details: |
      go_sdk_srcs, go_stdlib_toolchain, go_target_mode, and
      _stdlib_mode_mismatches have no generic or in-repository consumers. They are
      documented compatibility accessors rather than accidental duplicate logic. The
      owner confirmed that an external monorepo still uses the legacy adapter and chose
      to retain it until that consumer adopts this implementation, so removal is not a
      Step 14 remediation.
    suggested_action: |
      After the external monorepo migrates to the canonical source, export-data, and
      target-identity seams, schedule a separate compatibility cleanup to remove the
      aliases and any alias-accepting fallback fields.
    source: built-in

  - id: F6
    severity: suggestion
    category: tests
    file: go/internal/goanalysis/full_build_determinism_integration_test.go
    line: 301
    title: Determinism fixture does not pin its intended failing verdict
    details: |
      The consumer fixture is intended to persist a failing report with three
      os.ReadFile authority sites. The semantic audit accepts a matching multi-site
      finding from violations or warnings and never requires verdict FAIL, so a policy
      change could make the fixture pass while byte-for-byte determinism remained green.
      This does not weaken N4, but it weakens the fixture's documented intent.
    suggested_action: |
      Require verdict FAIL and the intended multi-site violation kind while retaining
      the existing exact-byte comparison and dependency-axis assertions.
    source: built-in
    addressed_by: step14/task-03-pin-acceptance-fixture-semantics.code-task.md

