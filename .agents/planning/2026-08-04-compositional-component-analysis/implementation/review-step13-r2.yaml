findings:
  - id: F3
    severity: suggestion
    category: tests
    file: go/internal/goanalysis/full_build_determinism_integration_test.go
    line: 301
    title: Determinism fixture still does not pin its intended failing verdict
    details: |
      The consumer fixture intentionally produces three os.ReadFile sites, and
      the semantic audit requires a sorted multi-site finding plus the expected
      dependency-boundary axes, but it still does not require
      consumerReport.Verdict == FAIL or constrain that finding to the intended
      violation kind. Carrying this is acceptable at the final gate because
      the Step 13 determinism claim is directly established by raw-byte and
      digest equality across isolated builds; a future warning-policy change
      could reduce the fixture's semantic strength but would not turn that
      equality into a proxy. This remains a focused hardening opportunity, not
      unresolved evidence for N4.
    suggested_action: |
      When this fixture is next touched, require the consumer report verdict to
      be FAIL and require the expected multi-site finding to be a violation of
      the intended kind rather than accepting a matching warning.
    source: built-in

