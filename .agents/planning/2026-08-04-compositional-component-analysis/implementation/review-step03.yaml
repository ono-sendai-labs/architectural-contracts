summary: |
  The confirmation review finds all four findings from the initial Step 3
  review discharged. The ratified schema-owned capability taxonomy restores
  the intended artifactio-to-core dependency direction, ordered stdlib-map
  evidence and total record validation now match the schema, and the
  inventory-backed Capslock normalizer closes both deferred grammar findings.
  The remediation introduced no new cross-task architectural drift; the
  duplicated protobuf-runtime membership is the documented Step 5-6 migration
  state whose durable repair belongs to plan Step 7. No further remediation
  tasks are required for Step 3.

architecture:
  - element: Retired manifest verification fields
    expected: |
      component.proto reserves fields 8 and 9 and the names own_check_runs and
      certification_reference; stale authored fields are rejected before
      lenient textproto parsing and no self-declared verification state remains.
    actual: |
      The reservations, RemovedFieldError checks, native/report/Bazel cleanup,
      and compatibility tests remain present after remediation.
    status: aligned
    files:
      - proto/archcontracts/v1/component.proto
      - go/internal/manifest/manifest.go
    notes: ""

  - element: AuthorityDeclaration lattice
    expected: |
      DECLARED{} and UNKNOWN are structurally distinct, UNKNOWN absorbs Join,
      known sets are sorted and duplicate-free, and contradictory persisted
      forms fail.
    actual: |
      The native Known/Set model, constructors, Join, persisted conversions,
      manifest parsing, schema enum, and tests implement the required lattice.
    status: aligned
    files:
      - proto/archcontracts/v1/component.proto
      - go/internal/manifest/authority.go
      - go/internal/manifest/manifest.go
    notes: ""

  - element: Surface artifact schema
    expected: |
      A protobuf-defined, major-versioned surface with structural authority,
      concrete packages, exact symbols, namespace, SDK key, producer version,
      and digest, without a persisted provenance claim or proto maps.
    actual: |
      surface.proto represents each required field, shares component enums and
      SDKKey, documents canonical keys, and has descriptor and round-trip tests.
    status: aligned
    files:
      - proto/archcontracts/v1/surface.proto
      - go/internal/archcontracts/schema_test.go
    notes: ""

  - element: Standard-library map schema
    expected: |
      A total package, symbol, and init inventory keyed by a target-complete
      SDKKey, explicit terminal classifications, and ordered evidence paths,
      using no proto map fields.
    actual: |
      stdlibmap.proto represents the complete model, documents keyed collection
      ordering separately from the ordered Evidence.frames sequence, and is
      covered by descriptor and round-trip tests.
    status: aligned
    files:
      - proto/archcontracts/v1/stdlibmap.proto
      - go/internal/archcontracts/schema_test.go
    notes: ""

  - element: SymbolID grammar and declaring-object conversion
    expected: |
      One canonical v1 grammar for top-level objects, declared methods, and
      package init, with go/types conversion covering aliases, promotions,
      generic origins, fields, and interface method specifications.
    actual: |
      SymbolID parsing and formatting, FromObject, FromSelection, alias and
      promotion handling, generic origins, and the grammar-table fixtures are
      implemented without changing the live checker.
    status: aligned
    files:
      - go/internal/symbol/symbol.go
      - go/internal/symbol/typesconv.go
    notes: ""

  - element: Capslock-to-SymbolID normalization
    expected: |
      Structured package and declaration inventory data disambiguate Capslock
      names; pointer/value and instantiated spellings converge, valid Go/SSA
      type spellings are accepted, and malformed or unresolved names fail closed.
    actual: |
      ParseCapslockFunction requires an inventory, validates package identity
      through the canonical SymbolID path grammar, resolves exact method owners,
      and checks type arguments with Go scanner tokens plus a typed corpus. The
      original tuple and valid-spelling cases, quote-aware splitting, declaring
      interface ownership, and lexical-error rejection are all pinned by tests.
    status: aligned
    files:
      - go/internal/symbol/capslock.go
      - go/internal/symbol/capslock_inventory_test.go
      - go/internal/symbol/capslock_corpus_test.go
      - go/internal/symbol/capslock_test.go
    notes: |
      This discharges original findings F3 and F4 and the important residue from
      deferred Task 4 through the approved Task 9 implementation.

  - element: Exact declared-surface extraction
    expected: |
      Typed interface declarations produce sorted, duplicate-free SymbolIDs,
      expand only same-package alias targets, and inject no implements closure.
    actual: |
      ExtractSurface implements the expected traversal, bounded alias expansion,
      sorting, deduplication, namespace canonicalization, and init handling.
    status: aligned
    files:
      - go/internal/symbol/extract.go
      - go/internal/symbol/extract_test.go
    notes: ""

  - element: Canonical artifact I/O and map invariants
    expected: |
      Canonical JSON sorts keyed sets without changing ordered sequences,
      validates required semantic invariants, bounds reads, hashes canonical
      bytes, and atomically replaces files.
    actual: |
      Map normalization preserves Evidence.frames while sorting only keyed
      collections. Validation requires one init for every importable package,
      forbids inits for non-importable packages, and requires exactly one
      non-empty evidence path for every symbol-capability pair. Existing version,
      terminal-classification, bounded-read, digest, and atomic-write checks remain.
    status: aligned
    files:
      - go/internal/artifactio/stdlibmap.go
      - go/internal/artifactio/surface.go
      - go/internal/artifactio/write.go
      - go/internal/artifactio/stdlibmap_test.go
    notes: |
      This discharges original finding F2. Reversing evidence frames now changes
      canonical bytes and the digest, while keyed collection reordering does not.

  - element: Canonical namespace policy
    expected: |
      NamespaceID defaults to upstream; IsCanonicalPath agrees with an
      idempotent CanonicalizePath; shell helpers validate loader paths and keep
      stdlib paths namespace-free.
    actual: |
      The seams, fixed-point validator, stdlib invariant validator, defaults,
      and isolated override tests remain present while IsStdlibPath stays for
      the later authority-map cutover.
    status: aligned
    files:
      - go/internal/hostpolicy/hostpolicy.go
      - go/internal/hostpolicy/namespace_test.go
    notes: ""

  - element: Schema, manifest, symbol, and artifact-I/O component boundaries
    expected: |
      The schema component singly owns generated persisted types and the shared
      capability taxonomy; manifest and artifactio consume schema explicitly,
      artifactio also consumes symbol explicitly, and pure packages do not
      depend on the artifact-I/O shell.
    actual: |
      schema owns internal/schema and internal/schema/gen as a package surface;
      artifactio owns only its implementation among the reviewed project
      packages and declares schema and symbol dependencies; manifest declares
      schema; ownership, import direction, and native/Bazel parity are guarded
      by manifestparity tests.
    status: aligned
    files:
      - go/internal/schema/component.textproto
      - go/internal/artifactio/component.textproto
      - go/internal/manifest/component.textproto
      - go/internal/symbol/component.textproto
      - go/internal/manifestparity/ownership_test.go
    notes: |
      This discharges original finding F1 under the user-ratified architecture.
      Protobuf-runtime packages remain repeated members of self-hosting consumers
      only for the documented source-resolver transition; plan Step 7 explicitly
      owns their migration to one protobuf-runtime package-surface component.

