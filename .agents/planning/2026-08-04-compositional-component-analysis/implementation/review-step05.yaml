findings:
  - id: F1
    severity: suggestion
    category: style
    file: bazel_rules/go/private/command.bzl
    line: 64
    title: Function documentation still says the golden rule uses verdict argv
    details: |
      The module-level documentation correctly says only the normal and grep
      assertions call arcc_verdict_argv, while the function doc still includes
      the golden rule. Production behavior is correct: the golden rule directly
      diffs the provider report, so this is non-blocking local prose residue.
    suggested_action: |
      Say that the normal and grep rules consume arcc_verdict_argv and that the
      golden rule directly compares the report artifact.
    source: code-task-review

  - id: F2
    severity: suggestion
    category: tests
    file: bazel_rules/go/tests/asserted_surface_sdk_key_test.sh
    line: 61
    title: SDK symmetry probe does not parse a true cgoEnabled boolean
    details: |
      The asserted/checked symmetry test compares cgoEnabled through a helper
      that only extracts quoted JSON scalars. Its current cgo-off fixture is
      correct and omission symmetry is covered, but a future true boolean would
      look absent and could evade this particular drift guard. The production
      key writer and the transitioned checked-key coverage are unaffected.
    suggested_action: |
      Use a boolean-aware JSON extraction or add a non-default transition
      fixture that compares every SDK-key field with cgoEnabled true.
    source: code-task-review

  - id: F3
    severity: suggestion
    category: tests
    file: justfile
    line: 85
    title: Malformed-action failure log can survive a failed grep
    details: |
      The log path is safely unique, but a grep failure under the recipe's
      fail-fast shell can exit before the following cleanup. This leaks only a
      temporary diagnostic on an already-failing CI gate and has no effect on
      Step 5 behavior or test validity.
    suggested_action: |
      Install a cleanup trap after mktemp or ensure cleanup runs on both grep
      success and failure.
    source: code-task-review

  - id: F4
    severity: nit
    category: doc_divergence
    file: bazel_rules/go/private/stdlib_map.bzl
    line: 50
    title: Default-map seam comment still speaks from the pre-Step-5 state
    details: |
      The helper doc says that until Step 5 nothing consumes the default map and
      no analysis action exists, although component.bzl now attaches it to the
      landed Step 5 action. The preceding lines and implementation are accurate,
      so this is a stale tense rather than architectural ambiguity.
    suggested_action: |
      Replace the historical "until then" sentence with the current consumer
      relationship when this comment is next touched.
    source: built-in

